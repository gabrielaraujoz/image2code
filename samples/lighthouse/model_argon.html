<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peggy's Point Lighthouse — Winter Live Photograph</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #6b9be3;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // =========================================================================
    // 1. SCENE, RENDERER & CAMERA SETUP (Calibrated to Reference Photograph)
    // =========================================================================
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.06;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    // Camera framed to match the reference viewpoint (horizon at ~47.2% from bottom)
    const camera = new THREE.PerspectiveCamera(
      35,
      window.innerWidth / window.innerHeight,
      0.2,
      2500
    );
    camera.position.set(0.0, 2.40, 28.0);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0.0, 2.82, 0.0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enablePan = false;
    controls.minDistance = 8.0;
    controls.maxDistance = 95.0;
    controls.minPolarAngle = 0.15;
    controls.maxPolarAngle = Math.PI * 0.492;
    controls.update();

    // =========================================================================
    // 2. WINTER SUN & SKY LIGHTING
    // =========================================================================
    // Sun shines from left-front at ~33 deg elevation, casting crisp blue shadows right
    const sunDirection = new THREE.Vector3(-0.74, 0.54, 0.40).normalize();

    const sunLight = new THREE.DirectionalLight(0xfffcf5, 3.15);
    sunLight.position.copy(sunDirection).multiplyScalar(120);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 4096;
    sunLight.shadow.mapSize.height = 4096;
    sunLight.shadow.camera.near = 10;
    sunLight.shadow.camera.far = 260;
    const d = 52;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    sunLight.shadow.bias = -0.00035;
    sunLight.shadow.normalBias = 0.015;
    scene.add(sunLight);

    // Cool crisp winter sky hemisphere fill light
    const hemiLight = new THREE.HemisphereLight(0x8cb8f2, 0x5c6e87, 1.35);
    hemiLight.position.set(0, 60, 0);
    scene.add(hemiLight);

    // Subtle snow bounce fill from below-left
    const bounceLight = new THREE.DirectionalLight(0xcce0ff, 0.55);
    bounceLight.position.set(0.6, -0.3, 0.7).multiplyScalar(50);
    scene.add(bounceLight);

    // =========================================================================
    // 3. ATMOSPHERIC SKY DOME & DISTANT HORIZON CLOUDS SHADER
    // =========================================================================
    const skyUniforms = {
      uTime: { value: 0 },
      uSunDir: { value: sunDirection.clone() }
    };

    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      uniforms: skyUniforms,
      vertexShader: /* glsl */ `
        varying vec3 vWorldPos;
        void main() {
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorldPos = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: /* glsl */ `
        varying vec3 vWorldPos;
        uniform float uTime;
        uniform vec3 uSunDir;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
        }

        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          float a = hash(i);
          float b = hash(i + vec2(1.0, 0.0));
          float c = hash(i + vec2(0.0, 1.0));
          float d = hash(i + vec2(1.0, 1.0));
          return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
        }

        float fbm(vec2 p) {
          float v = 0.0;
          float a = 0.5;
          mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
          for (int i = 0; i < 5; i++) {
            v += a * noise(p);
            p = rot * p * 2.03;
            a *= 0.5;
          }
          return v;
        }

        void main() {
          vec3 dir = normalize(vWorldPos);
          float elev = max(dir.y, 0.0);

          // Clear Nova Scotia winter sky gradient matching reference photo
          vec3 horizonCol = vec3(0.76, 0.855, 0.965);
          vec3 lowSkyCol  = vec3(0.51, 0.695, 0.925);
          vec3 midSkyCol  = vec3(0.37, 0.575, 0.855);
          vec3 zenithCol  = vec3(0.27, 0.465, 0.775);

          vec3 sky = mix(horizonCol, lowSkyCol, smoothstep(0.0, 0.065, elev));
          sky = mix(sky, midSkyCol, smoothstep(0.05, 0.24, elev));
          sky = mix(sky, zenithCol, smoothstep(0.22, 0.65, elev));

          // Subtle brighter atmospheric glow toward the left (sun side)
          float sunAz = clamp(-dir.x * 0.5 + 0.5, 0.0, 1.0);
          sky += vec3(0.035, 0.04, 0.045) * sunAz * exp(-elev * 5.0);

          // Distant low horizon stratocumulus clouds on the right side (as in photo)
          if (dir.y > -0.01 && dir.y < 0.25 && dir.z < 0.2) {
            float az = atan(dir.x, -dir.z); // 0 is center, positive is right
            // Cloud band concentrated on right horizon (az > 0.02)
            float rightMask = smoothstep(-0.02, 0.16, az) * smoothstep(1.3, 0.5, az);
            vec2 cloudUV = vec2(az * 14.0 - uTime * 0.012, elev * 95.0);
            float n1 = fbm(cloudUV);
            float n2 = fbm(cloudUV * 2.1 + vec2(3.7, -1.4));

            // Main low cloud bank right above the distant headland (elev ~ 0.012 to 0.052)
            float bandProfile = smoothstep(0.006, 0.020, elev) * smoothstep(0.062, 0.022, elev);
            float cloudShape = smoothstep(0.42, 0.68, n1 * 0.75 + n2 * 0.25) * bandProfile * rightMask;

            // Upper faint cloud wisps on right (around elev ~ 0.12 - 0.16, az ~ 0.28)
            float wispMask = exp(-pow((az - 0.29) * 8.0, 2.0)) * exp(-pow((elev - 0.135) * 42.0, 2.0));
            float wispShape = smoothstep(0.45, 0.72, fbm(vec2(az * 18.0 - uTime * 0.018, elev * 60.0))) * wispMask * 0.45;

            float totalCloud = clamp(cloudShape + wispShape, 0.0, 1.0);
            float cloudLit = smoothstep(0.015, 0.042, elev + (n2 - 0.5) * 0.015);
            vec3 cloudShadowCol = vec3(0.55, 0.64, 0.77);
            vec3 cloudTopCol    = vec3(0.83, 0.88, 0.95);
            vec3 cloudCol = mix(cloudShadowCol, cloudTopCol, cloudLit);

            sky = mix(sky, cloudCol, totalCloud * 0.82);
          }

          // Crisp horizon mist blend
          float horizonHaze = exp(-abs(dir.y) * 55.0);
          sky = mix(sky, vec3(0.79, 0.87, 0.96), horizonHaze * 0.35);

          gl_FragColor = vec4(sky, 1.0);
        }
      `
    });

    const skyDome = new THREE.Mesh(new THREE.SphereGeometry(1800, 64, 48), skyMat);
    scene.add(skyDome);

    // =========================================================================
    // 4. ANIMATED ATLANTIC OCEAN SHADER & DISTANT COASTLINE
    // =========================================================================
    const oceanUniforms = {
      uTime: { value: 0 },
      uSunDir: { value: sunDirection.clone() },
      uCamPos: { value: camera.position }
    };

    const oceanGeo = new THREE.PlaneGeometry(2400, 2400, 220, 220);
    oceanGeo.rotateX(-Math.PI / 2);

    const oceanMat = new THREE.ShaderMaterial({
      uniforms: oceanUniforms,
      vertexShader: /* glsl */ `
        uniform float uTime;
        varying vec3 vWorldPos;
        varying float vWaveHeight;

        float wave(vec2 p, vec2 dir, float freq, float speed, float amp) {
          return sin(dot(p, dir) * freq + uTime * speed) * amp;
        }

        void main() {
          vec4 wp = modelMatrix * vec4(position, 1.0);
          float dist = length(wp.xz);
          float atten = smoothstep(950.0, 80.0, dist);

          float h = 0.0;
          h += wave(wp.xz, normalize(vec2(0.85, 0.52)), 0.19, 1.65, 0.14);
          h += wave(wp.xz, normalize(vec2(0.95, -0.31)), 0.37, 2.20, 0.07);
          h += wave(wp.xz, normalize(vec2(0.55, 0.83)), 0.73, 2.95, 0.035);
          h *= atten;

          wp.y += h;
          vWorldPos = wp.xyz;
          vWaveHeight = h;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: /* glsl */ `
        uniform float uTime;
        uniform vec3 uSunDir;
        uniform vec3 uCamPos;
        varying vec3 vWorldPos;
        varying float vWaveHeight;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
        }

        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
            mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x),
            f.y
          );
        }

        float fbm(vec2 p) {
          float v = 0.0;
          float a = 0.5;
          mat2 m = mat2(0.8, 0.6, -0.6, 0.8);
          for (int i = 0; i < 4; i++) {
            v += a * noise(p);
            p = m * p * 2.07;
            a *= 0.5;
          }
          return v;
        }

        void main() {
          vec2 p = vWorldPos.xz;
          float dist = length(p - uCamPos.xz);

          // Multi-scale wind-driven wave normals
          vec2 uv1 = p * vec2(0.32, 0.58) - vec2(uTime * 0.42, uTime * 0.18);
          vec2 uv2 = p * vec2(0.85, 1.45) - vec2(uTime * 0.65, -uTime * 0.25);
          float n1 = fbm(uv1);
          float n2 = fbm(uv2);
          float eps = 0.25;
          float nx = fbm(uv1 + vec2(eps, 0.0)) - n1;
          float nz = fbm(uv1 + vec2(0.0, eps)) - n1;

          vec3 N = normalize(vec3(-nx * 1.9, 1.0, -nz * 1.9));
          vec3 V = normalize(uCamPos - vWorldPos);
          float NoV = max(dot(N, V), 0.0);

          // Cold deep Atlantic winter blue palette matching reference photo
          vec3 deepWater = vec3(0.095, 0.225, 0.375);
          vec3 midWater  = vec3(0.145, 0.305, 0.475);
          vec3 skyRefl   = vec3(0.42, 0.61, 0.84);

          float fresnel = pow(1.0 - NoV, 4.0) * 0.55 + 0.12;
          vec3 waterCol = mix(deepWater, midWater, n1 * 0.7 + 0.15);
          waterCol = mix(waterCol, skyRefl, clamp(fresnel, 0.0, 0.65));

          // Wind-blown whitecap streaks & shore surf on left ocean
          float crest = smoothstep(0.61, 0.78, n1 * 0.65 + n2 * 0.35 + vWaveHeight * 0.8);
          // Prominent surf bands on left side matching reference left water
          float surfBand = sin(p.z * 0.28 + p.x * 0.08 + uTime * 1.4 + n1 * 3.5);
          float leftSurf = smoothstep(0.75, 0.96, surfBand) *
                           smoothstep(-10.0, -45.0, p.x) *
                           smoothstep(-260.0, -45.0, p.z) * 0.55;

          // Foam Ring around the granite headland perimeter
          vec2 headCenter = vec2(2.0, -14.0);
          float rHead = length((p - headCenter) * vec2(0.72, 1.05));
          float shoreWave = sin(rHead * 1.6 - uTime * 2.2 + n1 * 4.0);
          float shoreFoam = smoothstep(32.0, 26.5, rHead) * smoothstep(21.0, 25.0, rHead) *
                            smoothstep(0.2, 0.85, shoreWave + n2 * 0.5);

          float totalFoam = clamp(crest * 0.35 + leftSurf + shoreFoam * 0.85, 0.0, 1.0);
          waterCol = mix(waterCol, vec3(0.86, 0.91, 0.97), totalFoam);

          // Crisp sun glints
          vec3 H = normalize(uSunDir + V);
          float spec = pow(max(dot(N, H), 0.0), 140.0) * 0.9;
          waterCol += vec3(0.95, 0.98, 1.0) * spec * smoothstep(700.0, 50.0, dist);

          // Horizon atmospheric blend
          float fogFactor = smoothstep(350.0, 1180.0, dist);
          waterCol = mix(waterCol, vec3(0.52, 0.67, 0.85), fogFactor);

          gl_FragColor = vec4(waterCol, 1.0);
        }
      `
    });

    const ocean = new THREE.Mesh(oceanGeo, oceanMat);
    ocean.position.y = -0.35;
    scene.add(ocean);

    // =========================================================================
    // 5. DISTANT NOVA SCOTIA COASTLINE (Right Peninsula & Far Left Island)
    // =========================================================================
    function buildDistantCoastline() {
      const coastMat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: skyUniforms.uTime
        },
        vertexShader: /* glsl */ `
          varying vec3 vWorldPos;
          varying vec2 vUv;
          void main() {
            vUv = uv;
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldPos = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: /* glsl */ `
          varying vec3 vWorldPos;
          varying vec2 vUv;
          uniform float uTime;

          float hash(vec2 p) {
            return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
          }
          float noise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            f = f * f * (3.0 - 2.0 * f);
            return mix(
              mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
              mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x),
              f.y
            );
          }

          void main() {
            float h = max(vWorldPos.y + 0.35, 0.0);
            float n = noise(vWorldPos.xz * 0.035) * 0.6 + noise(vWorldPos.xz * 0.12) * 0.4;

            // Atmospheric blue-slate coastal hills matching right horizon in reference
            vec3 hillBase = vec3(0.28, 0.38, 0.51);
            vec3 hillHigh = vec3(0.35, 0.45, 0.59);
            vec3 col = mix(hillBase, hillHigh, clamp(h * 0.06 + n * 0.35, 0.0, 1.0));

            // Distant snowy/rocky shoreline specks & surf line right at water edge
            float shoreLine = smoothstep(2.1, 0.25, h);
            float surf = shoreLine * smoothstep(0.32, 0.68, noise(vec2(vWorldPos.x * 0.12 + uTime * 0.2, vWorldPos.z * 0.12)));
            col = mix(col, vec3(0.84, 0.89, 0.96), surf * 0.88);

            gl_FragColor = vec4(col, 1.0);
          }
        `
      });

      // Right distant peninsula across St. Margarets Bay
      const segsX = 160, segsZ = 24;
      const rightGeo = new THREE.PlaneGeometry(780, 90, segsX, segsZ);
      rightGeo.rotateX(-Math.PI / 2);
      const pos = rightGeo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const lx = pos.getX(i); // -390 to +390
        const lz = pos.getZ(i); // -45 to +45
        const u = (lx + 390) / 780; // 0 (left tip near center) to 1 (far right)
        const v = 1.0 - Math.abs(lz / 45.0);
        const ridge = Math.max(0, Math.sin(u * Math.PI * 0.95));
        // Higher rounded hump around u = 0.26 (matches hill at x ~ 73% in photo)
        const mainHill = Math.exp(-Math.pow((u - 0.24) * 5.2, 2.0)) * 13.5;
        const secondHill = Math.exp(-Math.pow((u - 0.68) * 3.5, 2.0)) * 8.2;
        const baseRidge = smoothstepJS(0.02, 0.12, u) * 5.8;
        const micro = Math.sin(u * 42.0) * 0.6 + Math.cos(u * 95.0) * 0.3;
        const y = (baseRidge + mainHill + secondHill + micro) * Math.pow(Math.max(v, 0), 0.75) - 0.55;
        pos.setY(i, y);
      }
      rightGeo.computeVertexNormals();
      const rightCoast = new THREE.Mesh(rightGeo, coastMat);
      rightCoast.position.set(420, 0, -680);
      rightCoast.rotation.y = -0.16;
      scene.add(rightCoast);

      // Faint low distant island strip on left horizon (around x = 20% in reference)
      const leftGeo = new THREE.PlaneGeometry(95, 25, 40, 8);
      leftGeo.rotateX(-Math.PI / 2);
      const lPos = leftGeo.attributes.position;
      for (let i = 0; i < lPos.count; i++) {
        const lx = lPos.getX(i);
        const lz = lPos.getZ(i);
        const u = 1.0 - Math.pow(lx / 47.5, 2.0);
        const v = 1.0 - Math.abs(lz / 12.5);
        lPos.setY(i, Math.max(0, u * v) * 2.4 - 0.45);
      }
      leftGeo.computeVertexNormals();
      const leftIsland = new THREE.Mesh(leftGeo, coastMat);
      leftIsland.position.set(-225, 0, -740);
      scene.add(leftIsland);
    }

    function smoothstepJS(edge0, edge1, x) {
      const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
      return t * t * (3 - 2 * t);
    }

    buildDistantCoastline();

    // =========================================================================
    // 6. DETERMINISTIC NOISE & PROCEDURAL GRANITE / SNOW / PATH TEXTURES
    // =========================================================================
    function hash2(x, y) {
      const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
      return s - Math.floor(s);
    }

    function noise2D(x, y) {
      const ix = Math.floor(x);
      const iy = Math.floor(y);
      const fx = x - ix;
      const fy = y - iy;
      const ux = fx * fx * (3.0 - 2.0 * fx);
      const uy = fy * fy * (3.0 - 2.0 * fy);
      const a = hash2(ix, iy);
      const b = hash2(ix + 1, iy);
      const c = hash2(ix, iy + 1);
      const d = hash2(ix + 1, iy + 1);
      return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
    }

    function fbm2D(x, y, octaves = 5) {
      let v = 0.0;
      let a = 0.5;
      let px = x, py = y;
      for (let i = 0; i < octaves; i++) {
        v += a * noise2D(px, py);
        const nx = px * 1.62 + py * 1.18;
        const ny = -px * 1.18 + py * 1.62;
        px = nx;
        py = ny;
        a *= 0.5;
      }
      return v;
    }

    function createProceduralTextures() {
      // 1. High-resolution salt-and-pepper Devonian granite texture + bump
      const size = 1024;
      const gCanvas = document.createElement('canvas');
      gCanvas.width = size;
      gCanvas.height = size;
      const gCtx = gCanvas.getContext('2d');
      const imgData = gCtx.createImageData(size, size);
      const data = imgData.data;

      const bCanvas = document.createElement('canvas');
      bCanvas.width = size;
      bCanvas.height = size;
      const bCtx = bCanvas.getContext('2d');
      const bImg = bCtx.createImageData(size, size);
      const bData = bImg.data;

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const idx = (y * size + x) * 4;
          // Tileable frequencies
          const u = x / size;
          const v = y / size;
          const nMacro = noise2D(u * 16, v * 16) * 0.5 + noise2D(u * 32, v * 32) * 0.3 + noise2D(u * 64, v * 64) * 0.2;
          const grain1 = hash2(x * 0.9, y * 0.9);
          const grain2 = hash2(x * 0.45 + 17, y * 0.45 + 31);

          // Salt & pepper biotite/feldspar crystal speckles
          let speck = 0.52 + (nMacro - 0.5) * 0.28;
          if (grain1 < 0.16) speck -= 0.24; // dark biotite mica flake
          else if (grain1 > 0.83) speck += 0.18; // bright quartz/feldspar crystal
          speck += (grain2 - 0.5) * 0.14;

          // Subtle glacial striation micro-grooves
          const striation = Math.sin((u * 38 + v * 14 + nMacro * 2.5) * Math.PI * 2) * 0.04;
          const val = Math.max(0, Math.min(1, speck + striation));

          data[idx]     = Math.round(val * 232);
          data[idx + 1] = Math.round(val * 238);
          data[idx + 2] = Math.round(val * 246);
          data[idx + 3] = 255;

          const bumpVal = Math.max(0, Math.min(255, Math.round((nMacro * 0.65 + grain2 * 0.35 + striation) * 255)));
          bData[idx] = bData[idx + 1] = bData[idx + 2] = bumpVal;
          bData[idx + 3] = 255;
        }
      }
      gCtx.putImageData(imgData, 0, 0);
      bCtx.putImageData(bImg, 0, 0);

      const graniteMap = new THREE.CanvasTexture(gCanvas);
      graniteMap.wrapS = graniteMap.wrapT = THREE.RepeatWrapping;
      graniteMap.repeat.set(14, 14);
      graniteMap.colorSpace = THREE.SRGBColorSpace;
      graniteMap.anisotropy = 8;

      const graniteBump = new THREE.CanvasTexture(bCanvas);
      graniteBump.wrapS = graniteBump.wrapT = THREE.RepeatWrapping;
      graniteBump.repeat.set(14, 14);
      graniteBump.anisotropy = 8;

      return { graniteMap, graniteBump };
    }

    const procTex = createProceduralTextures();

    // =========================================================================
    // 7. COASTAL GRANITE HEADLAND TOPOGRAPHY & CUSTOM SHADER MATERIAL
    // =========================================================================
    function distToSegment(px, pz, ax, az, bx, bz) {
      const vx = bx - ax, vz = bz - az;
      const wx = px - ax, wz = pz - az;
      const c1 = vx * wx + vz * wz;
      if (c1 <= 0) return Math.hypot(px - ax, pz - az);
      const c2 = vx * vx + vz * vz;
      if (c2 <= c1) return Math.hypot(px - bx, pz - bz);
      const b = c1 / c2;
      return Math.hypot(px - (ax + b * vx), pz - (az + b * vz));
    }

    function getWalkwayDist(x, z) {
      // Main diagonal concrete walkway visible in reference photo:
      // Runs from bottom-right bend (5.3, 13.6) diagonally up-left to (-1.3, 3.2),
      // then curves up toward the lighthouse base (1.2, -15.5), plus the foreground turn-down spur (5.1, 17.5)
      const d1 = distToSegment(x, z, 5.15, 17.4, 5.35, 13.6);
      const d2 = distToSegment(x, z, 5.35, 13.6, -1.35, 3.2);
      const d3 = distToSegment(x, z, -1.35, 3.2, 1.25, -14.8);
      return Math.min(d1, d2, d3);
    }

    function getTerrainData(x, z) {
      // 1. Broad oval granite headland whaleback dome rising out of the Atlantic
      const cx = 1.5, cz = -15.5;
      const dx = (x - cx) / 24.5;
      const dz = (z - cz) / 21.0;
      const r2 = dx * dx + dz * dz;
      let dome = 2.65 * Math.exp(-r2 * 1.18);

      // Extend main ridge forward to camera so foreground connects seamlessly
      const ridgeX = x / 18.5;
      const ridgeZ = (z - 6.0) / 24.0;
      const forwardSaddle = 1.48 * Math.exp(-(ridgeX * ridgeX * 0.85 + ridgeZ * ridgeZ * 0.95));

      // Steep drop-off behind lighthouse (-z) and into ocean on far left/right
      const seaDrop = smoothstepJS(32.0, 21.5, Math.hypot((x - 1.0) * 0.78, (z - 1.0) * 0.68));
      let h = Math.max(dome, forwardSaddle) * seaDrop - 0.55;

      // Flatten lighthouse plinth area around (x = 1.34, z = -18.0) at y = 2.57
      const dLight = Math.hypot(x - 1.34, z + 18.0);
      const lightPad = Math.exp(-dLight * dLight * 0.085);
      h = h * (1.0 - lightPad) + 2.57 * lightPad;

      // Right crest slope of glaciated granite whaleback (x = 3 to 16, z = -19 to -8)
      const rightWhaleback = Math.exp(-Math.pow((x - 7.5) / 7.5, 2.0) - Math.pow((z + 14.5) / 6.5, 2.0)) * 1.15;
      h += rightWhaleback;

      // Left rocky ridge slope (x = -14 to -3, z = -16 to +2)
      const leftRidge = Math.exp(-Math.pow((x + 7.5) / 6.8, 2.0) - Math.pow((z + 7.5) / 9.5, 2.0)) * 0.92;
      h += leftRidge;

      // 2. Prominent Foreground Granite Outcrop Humps & Deep Glacial Fissures (z = 13.5 to 26.0)
      const fgMask = smoothstepJS(12.2, 16.5, z) * smoothstepJS(27.2, 24.2, z);
      // Center-left foreground hero granite hump (x = -2.8 to +1.7, z = 15 to 25)
      const humpCenter = Math.exp(-Math.pow((x + 0.35) / 2.45, 2.0) - Math.pow((z - 20.2) / 4.2, 2.0)) * 0.72;
      // Mid-left foreground granite hump (x = -6.5 to -2.2, z = 15.5 to 25)
      const humpLeft = Math.exp(-Math.pow((x + 4.35) / 2.6, 2.0) - Math.pow((z - 19.8) / 4.5, 2.0)) * 0.68;
      // Far-left foreground granite ledges (x = -11 to -6.5, z = 14 to 24)
      const humpFarLeft = Math.exp(-Math.pow((x + 8.4) / 2.8, 2.0) - Math.pow((z - 18.8) / 4.2, 2.0)) * 0.56;

      // Deep diagonal glacial crevices cutting through the foreground granite (as in reference photo)
      const c1Dist = Math.abs((x + 1.05) - (z - 19.5) * 0.14 + Math.sin(z * 1.3) * 0.12);
      const crevice1 = Math.exp(-c1Dist * c1Dist * 18.0) * smoothstepJS(15.2, 17.5, z) * smoothstepJS(2.0, -3.2, x);

      const c2Dist = Math.abs((x + 3.65) + (z - 19.5) * 0.26 + Math.cos(z * 1.1) * 0.15);
      const crevice2 = Math.exp(-c2Dist * c2Dist * 14.0) * smoothstepJS(15.0, 17.2, z) * smoothstepJS(-1.5, -7.0, x);

      const c3Dist = Math.abs((x + 6.8) + (z - 19.0) * 0.32);
      const crevice3 = Math.exp(-c3Dist * c3Dist * 12.0) * smoothstepJS(14.5, 16.8, z);

      const totalCrevice = Math.min(1.0, crevice1 + crevice2 * 0.9 + crevice3 * 0.8);
      const fgRockHeight = (humpCenter + humpLeft + humpFarLeft) * (1.0 - totalCrevice * 0.78);
      h += fgRockHeight * fgMask;

      // Micro-relief granite undulations
      const nMed = fbm2D(x * 0.35 + 11.3, z * 0.35 + 7.1, 4);
      const nFine = fbm2D(x * 1.25, z * 1.25, 3);
      h += (nMed - 0.5) * 0.24 * seaDrop + (nFine - 0.5) * 0.06 * seaDrop;

      // 3. Smooth Snowdrift on Bottom-Right Foreground (x = 1.9 to 11.5, z = 14 to 25)
      const rightSnowZone = smoothstepJS(1.4, 3.1, x) * smoothstepJS(12.5, 16.0, z);
      const driftMound = Math.exp(-Math.pow((x - 4.8) / 4.8, 2.0) - Math.pow((z - 19.5) / 5.5, 2.0)) * 0.26;
      h = h * (1.0 - rightSnowZone * 0.45) + (0.82 + driftMound) * rightSnowZone * 0.45;

      // Boot footprints / ski-like tracks in bottom-right snow (x = 4.6 to 7.8, z = 16.5 to 25.0)
      const track1X = 5.45 + (z - 17.0) * 0.14 + Math.sin(z * 0.8) * 0.12;
      const track2X = 6.55 + (z - 17.0) * 0.22 + Math.cos(z * 0.7) * 0.12;
      const dTrack1 = Math.abs(x - track1X);
      const dTrack2 = Math.abs(x - track2X);
      const stepMod = 0.55 + 0.45 * Math.sin(z * 5.2);
      const footprintDepth = (Math.exp(-dTrack1 * dTrack1 * 28.0) + Math.exp(-dTrack2 * dTrack2 * 24.0)) *
                             smoothstepJS(16.0, 18.0, z) * smoothstepJS(25.5, 24.0, z) * stepMod;
      h -= footprintDepth * 0.065;

      // Concrete walkway slight channel depression & raised curb edges
      const dPath = getWalkwayDist(x, z);
      const pathWidth = z > 13.4 ? 0.38 : 0.62;
      if (dPath < pathWidth + 0.35 && z > -13.5 && z < 17.8) {
        const inPath = smoothstepJS(pathWidth + 0.12, pathWidth - 0.08, dPath);
        h -= inPath * 0.045;
      }

      return { h, totalCrevice, footprintDepth, dPath };
    }

    function createCoastalTerrainMaterial() {
      const mat = new THREE.MeshStandardMaterial({
        map: procTex.graniteMap,
        bumpMap: procTex.graniteBump,
        bumpScale: 0.065,
        roughness: 0.78,
        metalness: 0.04
      });

      mat.onBeforeCompile = (shader) => {
        shader.vertexShader = shader.vertexShader
          .replace(
            '#include <common>',
            /* glsl */ `
            #include <common>
            varying vec3 vWorldPosition;
            varying vec3 vWorldNormal;
            `
          )
          .replace(
            '#include <beginnormal_vertex>',
            /* glsl */ `
            #include <beginnormal_vertex>
            vWorldNormal = normalize((modelMatrix * vec4(objectNormal, 0.0)).xyz);
            `
          )
          .replace(
            '#include <worldpos_vertex>',
            /* glsl */ `
            #include <worldpos_vertex>
            vWorldPosition = (modelMatrix * vec4(transformed, 1.0)).xyz;
            `
          );

        shader.fragmentShader = shader.fragmentShader
          .replace(
            '#include <common>',
            /* glsl */ `
            #include <common>
            varying vec3 vWorldPosition;
            varying vec3 vWorldNormal;

            float hashG(vec2 p) {
              return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
            }
            float noiseG(vec2 p) {
              vec2 i = floor(p);
              vec2 f = fract(p);
              f = f * f * (3.0 - 2.0 * f);
              return mix(
                mix(hashG(i), hashG(i + vec2(1.0, 0.0)), f.x),
                mix(hashG(i + vec2(0.0, 1.0)), hashG(i + vec2(1.0, 1.0)), f.x),
                f.y
              );
            }
            float fbmG(vec2 p) {
              float v = 0.0;
              float a = 0.5;
              mat2 m = mat2(0.8, 0.6, -0.6, 0.8);
              for (int i = 0; i < 4; i++) {
                v += a * noiseG(p);
                p = m * p * 2.04;
                a *= 0.5;
              }
              return v;
            }
            float segDist(vec2 p, vec2 a, vec2 b) {
              vec2 pa = p - a, ba = b - a;
              float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
              return length(pa - ba * h);
            }
            `
          )
          .replace(
            '#include <map_fragment>',
            /* glsl */ `
            #include <map_fragment>
            vec2 wp = vWorldPosition.xz;
            float nMacro = fbmG(wp * 0.28);
            float nDetail = fbmG(wp * 1.35 + vec2(4.2, -3.1));
            float nFine = noiseG(wp * 6.5);
            float grain = hashG(floor(wp * 45.0));

            // 1. Devonian Granite Base Color (salt-and-pepper crystalline grey)
            vec3 graniteBase = diffuseColor.rgb * vec3(0.68, 0.70, 0.73);
            graniteBase *= (0.84 + 0.32 * nDetail);
            // Dark glacial crack network on exposed rock
            float crackPattern = abs(noiseG(wp * 0.95 + nMacro * 1.4) - 0.5);
            float crackLine = smoothstep(0.045, 0.008, crackPattern);
            graniteBase = mix(graniteBase, vec3(0.22, 0.24, 0.27), crackLine * 0.65);

            // Weathered olive-brown coastal moss / lichen in foreground & low rock hollows
            float fgZone = smoothstep(7.0, 18.0, wp.y);
            float mossNoise = smoothstep(0.46, 0.72, fbmG(wp * 0.82 + vec2(9.1, 2.4)));
            float leftForeMoss = smoothstep(1.5, -4.5, wp.x) * fgZone * mossNoise;
            float midTuftPatch = smoothstep(0.58, 0.78, fbmG(wp * 0.55)) * smoothstep(-8.0, 14.0, wp.y) * 0.55;
            vec3 mossCol = mix(vec3(0.35, 0.31, 0.22), vec3(0.46, 0.39, 0.27), nFine);
            graniteBase = mix(graniteBase, mossCol, clamp(leftForeMoss * 0.78 + midTuftPatch * 0.45, 0.0, 0.82));

            // 2. Snow Blanket Coverage (matching reference photo snow distribution)
            float flatness = smoothstep(0.58, 0.88, vWorldNormal.y);
            // Midground snowfield (z from -12 to +15) + right foreground snowbank (x > 1.8, z > 12)
            float midSnow = smoothstep(-14.5, -7.5, wp.y) * smoothstep(17.5, 11.5, wp.y);
            float rightFgSnow = smoothstep(1.3, 2.6, wp.x) * smoothstep(10.0, 15.5, wp.y);
            // Snow pockets trapped in foreground granite crevices & leeward right slopes
            float leewardSlope = smoothstep(-0.15, 0.45, vWorldNormal.x);
            float fgCreviceSnow = smoothstep(13.0, 16.5, wp.y) * smoothstep(-9.0, 2.2, wp.x) *
                                  smoothstep(0.44, 0.64, nMacro * 0.65 + leewardSlope * 0.55);

            // Exposed rock whalebacks on upper crest (z < -10, x > 1.5 or x < -2.0) stay mostly bare granite
            float crestBare = smoothstep(-9.5, -14.0, wp.y) * (smoothstep(1.2, 4.5, wp.x) + smoothstep(-1.5, -5.0, wp.x));
            // Exposed foreground granite humps (x from -9.5 to +1.5, z from 15.5 to 25)
            float fgHump1 = exp(-pow((wp.x + 0.35) / 2.1, 2.0) - pow((wp.y - 20.2) / 3.8, 2.0));
            float fgHump2 = exp(-pow((wp.x + 4.35) / 2.2, 2.0) - pow((wp.y - 19.8) / 4.0, 2.0));
            float fgHump3 = exp(-pow((wp.x + 8.2) / 2.4, 2.0) - pow((wp.y - 18.8) / 3.8, 2.0));
            float fgBareRock = clamp((fgHump1 + fgHump2 + fgHump3) * 1.25, 0.0, 1.0);

            // Midground exposed flat granite slabs peeking through snow (as in reference photo)
            float slabPatches = smoothstep(0.54, 0.72, fbmG(wp * 0.38 + vec2(1.7, 5.3)));
            float leftMidSlabs = smoothstep(-1.0, -7.5, wp.x) * smoothstep(-3.0, 8.0, wp.y) * 0.55;

            float snowScore = flatness * (midSnow * (0.85 - slabPatches * 0.52 - leftMidSlabs) + rightFgSnow * 1.15 + fgCreviceSnow * 0.85);
            snowScore -= crestBare * 0.85 + fgBareRock * (0.92 - leewardSlope * 0.38);
            snowScore += (nDetail - 0.5) * 0.28 + (nFine - 0.5) * 0.12;
            float snowMask = smoothstep(0.32, 0.48, snowScore);

            // 3. Concrete / Icy Walkway Path Cutting Diagonally Across Midground
            float dP1 = segDist(wp, vec2(5.15, 17.4), vec2(5.35, 13.6));
            float dP2 = segDist(wp, vec2(5.35, 13.6), vec2(-1.35, 3.2));
            float dP3 = segDist(wp, vec2(-1.35, 3.2), vec2(1.25, -14.8));
            float dPath = min(dP1, min(dP2, dP3));
            float pWidth = wp.y > 13.4 ? 0.32 : 0.56;
            float pathMask = smoothstep(pWidth + 0.08, pWidth - 0.08, dPath) *
                             smoothstep(-13.5, -6.0, wp.y) * smoothstep(18.0, 16.8, wp.y);
            // Parallel wheel-track / curb stripes along the diagonal path
            float trackStripe = smoothstep(0.12, 0.28, abs(dPath - pWidth * 0.52));
            vec3 pathCol = mix(vec3(0.42, 0.40, 0.36), vec3(0.56, 0.55, 0.51), trackStripe * 0.7 + nDetail * 0.3);

            // Refrozen blue-grey ice crust patches beside path & in midground hollows
            float icePatch = smoothstep(0.62, 0.76, fbmG(wp * 0.48 + vec2(8.3, -2.1))) * midSnow * (1.0 - pathMask);

            // Crisp sunlit snow color with subtle crystalline diamond sparkle
            float sparkle = step(0.965, grain) * 0.18;
            vec3 snowCol = vec3(0.93, 0.96, 1.0) + sparkle;
            vec3 iceCol  = vec3(0.64, 0.72, 0.82);
            vec3 finalSnow = mix(snowCol, iceCol, icePatch * 0.65);

            // Combine granite, snow, and walkway
            snowMask *= (1.0 - pathMask * 0.92);
            vec3 surfaceCol = mix(graniteBase, pathCol, pathMask * 0.88);
            surfaceCol = mix(surfaceCol, finalSnow, snowMask);

            diffuseColor.rgb = surfaceCol;
            `
          )
          .replace(
            '#include <roughnessmap_fragment>',
            /* glsl */ `
            #include <roughnessmap_fragment>
            roughnessFactor = mix(0.82, 0.62, snowMask);
            roughnessFactor = mix(roughnessFactor, 0.35, pathMask * 0.7 + icePatch * 0.65);
            `
          );
      };

      return mat;
    }

    const coastalTerrainMat = createCoastalTerrainMaterial();

    // Build high-resolution displaced headland terrain mesh
    function buildHeadlandTerrain() {
      const geo = new THREE.PlaneGeometry(76, 68, 280, 260);
      geo.rotateX(-Math.PI / 2);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const z = pos.getZ(i) - 4.0; // shift center to z = -4
        pos.setZ(i, z);
        const { h } = getTerrainData(x, z);
        pos.setY(i, h);
      }
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, coastalTerrainMat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    buildHeadlandTerrain();

    // =========================================================================
    // 8. GLACIATED GRANITE BOULDERS, COASTAL CLIFF BLOCKS & OUTCROP SLABS
    // =========================================================================
    function createBoulderMaterial() {
      const mat = new THREE.MeshStandardMaterial({
        map: procTex.graniteMap,
        bumpMap: procTex.graniteBump,
        bumpScale: 0.055,
        roughness: 0.76,
        metalness: 0.04,
        vertexColors: true
      });

      mat.onBeforeCompile = (shader) => {
        shader.vertexShader = shader.vertexShader
          .replace(
            '#include <common>',
            /* glsl */ `
            #include <common>
            varying vec3 vWPos;
            varying vec3 vWNorm;
            `
          )
          .replace(
            '#include <beginnormal_vertex>',
            /* glsl */ `
            #include <beginnormal_vertex>
            vWNorm = normalize((modelMatrix * vec4(objectNormal, 0.0)).xyz);
            `
          )
          .replace(
            '#include <worldpos_vertex>',
            /* glsl */ `
            #include <worldpos_vertex>
            vWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
            `
          );

        shader.fragmentShader = shader.fragmentShader
          .replace(
            '#include <common>',
            /* glsl */ `
            #include <common>
            varying vec3 vWPos;
            varying vec3 vWNorm;
            float hashB(vec2 p) {
              return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
            }
            float noiseB(vec2 p) {
              vec2 i = floor(p);
              vec2 f = fract(p);
              f = f * f * (3.0 - 2.0 * f);
              return mix(
                mix(hashB(i), hashB(i + vec2(1.0, 0.0)), f.x),
                mix(hashB(i + vec2(0.0, 1.0)), hashB(i + vec2(1.0, 1.0)), f.x),
                f.y
              );
            }
            `
          )
          .replace(
            '#include <map_fragment>',
            /* glsl */ `
            #include <map_fragment>
            // Vertex color channels: R = tone tint, G = seam/crack darkening, B = snow cap weight
            float toneTint = vColor.r;
            float seamDark = vColor.g;
            float snowWeight = vColor.b;

            float n1 = noiseB(vWPos.xy * 1.8 + vWPos.z * 1.1);
            float n2 = noiseB(vWPos.xz * 4.5);

            vec3 rockCol = diffuseColor.rgb * vec3(0.73, 0.75, 0.78) * (0.78 + 0.38 * toneTint);
            rockCol *= (0.88 + 0.24 * n1);
            // Darken glacial cleavage seam
            rockCol = mix(rockCol, vec3(0.18, 0.21, 0.26), seamDark * 0.78);

            // Optional snow crust on flat top surfaces of low slabs
            float topSnow = smoothstep(0.72, 0.92, vWNorm.y + (n2 - 0.5) * 0.18) * snowWeight;
            diffuseColor.rgb = mix(rockCol, vec3(0.93, 0.96, 1.0), clamp(topSnow, 0.0, 1.0));
            `
          );
      };

      return mat;
    }

    const boulderMat = createBoulderMaterial();

    function createGlaciatedBoulder(rx, ry, rz, seed, options = {}) {
      const {
        seamX = null,
        angular = 0.22,
        snowCap = 0.0,
        tone = 0.62
      } = options;

      const geo = new THREE.IcosahedronGeometry(1.0, 4);
      const pos = geo.attributes.position;
      const colors = new Float32Array(pos.count * 3);

      for (let i = 0; i < pos.count; i++) {
        let vx = pos.getX(i);
        let vy = pos.getY(i);
        let vz = pos.getZ(i);

        // Flatten underside so boulder sits naturally embedded in bedrock
        if (vy < -0.2) {
          vy = -0.2 + (vy + 0.2) * 0.38;
        }
        // Slightly dome/pillow the top for classic glaciated Peggy's Cove granite
        const nA = fbm2D(vx * 1.4 + seed * 7.3, vz * 1.4 + vy * 1.1 + seed * 3.9, 4);
        const nB = noise2D(vx * 3.2 - seed * 2.1, vy * 3.2 + vz * 2.7);

        // Cleavage planes (glacial plucking facets on right/back sides)
        const facet = Math.sin(vx * 2.4 + seed) * Math.cos(vz * 2.1 - seed * 0.7) * angular;
        const disp = 0.86 + (nA - 0.5) * 0.34 + (nB - 0.5) * 0.09 + facet;

        vx *= rx * disp;
        vy *= ry * disp;
        vz *= rz * disp;

        // Optional vertical cleavage crack (e.g. on Hero Pillow Boulder below lighthouse)
        let seamVal = 0.0;
        if (seamX !== null) {
          const dSeam = Math.abs(vx - seamX * rx + Math.sin(vy * 2.2) * 0.08 * rx);
          if (dSeam < 0.14 * rx) {
            const pinch = 1.0 - dSeam / (0.14 * rx);
            const groove = pinch * pinch;
            vy -= groove * 0.11 * ry;
            vz -= groove * 0.14 * rz;
            seamVal = groove;
          }
        }

        pos.setXYZ(i, vx, vy, vz);

        colors[i * 3]     = Math.max(0.1, Math.min(1.0, tone + (nA - 0.5) * 0.25));
        colors[i * 3 + 1] = seamVal;
        colors[i * 3 + 2] = snowCap;
      }

      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, boulderMat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function placeBoulder(x, z, rx, ry, rz, rotY, seed, options = {}) {
      const { yOffset = -0.08, rotX = 0, rotZ = 0 } = options;
      const mesh = createGlaciatedBoulder(rx, ry, rz, seed, options);
      const { h } = getTerrainData(x, z);
      mesh.position.set(x, h + ry * 0.38 + yOffset, z);
      mesh.rotation.set(rotX, rotY, rotZ);
      scene.add(mesh);
      return mesh;
    }

    function buildAllBouldersAndOutcrops() {
      // --- A. ICONIC CREST BOULDERS IMMEDIATELY BELOW & AROUND LIGHTHOUSE BASE ---
      // 1. Huge smooth rounded pillow boulder left-below lighthouse (x ~ 44% in photo) with vertical crack
      placeBoulder(-3.25, -16.2, 2.05, 1.38, 1.55, 0.12, 10.1, {
        seamX: 0.28, angular: 0.14, tone: 0.68, yOffset: 0.08
      });
      // 2. Rounded boulder immediately right of pillow boulder (under left side of lighthouse)
      placeBoulder(-0.45, -16.9, 1.35, 0.96, 1.25, -0.25, 21.4, {
        angular: 0.18, tone: 0.64, yOffset: 0.05
      });
      // 3. Flatter boulder directly in front of lighthouse porch/tower
      placeBoulder(1.45, -16.8, 1.45, 0.72, 1.20, 0.18, 33.7, {
        angular: 0.15, tone: 0.60, yOffset: -0.02
      });
      // 4. Crest boulders stepping left along the skyline ridge (x = 30% to 41% in photo)
      placeBoulder(-5.55, -16.4, 1.15, 0.82, 1.10, 0.42, 41.2, { tone: 0.62, yOffset: 0.04 });
      placeBoulder(-7.65, -15.8, 1.35, 0.88, 1.20, -0.31, 52.8, { tone: 0.65, yOffset: 0.02 });
      placeBoulder(-9.45, -15.2, 1.10, 0.74, 1.05, 0.19, 63.5, { tone: 0.60, yOffset: 0.0 });
      // Tilted angular horizon-breaking boulder at x ~ 26% on left skyline
      placeBoulder(-11.8, -15.5, 1.55, 1.18, 1.25, 0.55, 74.1, {
        angular: 0.34, tone: 0.66, rotZ: -0.28, yOffset: 0.12
      });
      placeBoulder(-13.8, -14.8, 1.25, 0.85, 1.15, -0.22, 81.9, { tone: 0.58, yOffset: 0.02 });

      // --- B. RIGHT SLOPE GLACIATED WHALEBACK LEDGES & BOULDERS (x = 55% to 84%) ---
      placeBoulder(4.8, -16.2, 2.65, 0.95, 2.15, -0.24, 91.3, {
        seamX: -0.15, angular: 0.12, tone: 0.68, rotZ: -0.14, yOffset: -0.05

    // =========================================================================
    // 10. SWAYING WINTER COASTAL SEDGE TUFTS & WIND-BLOWN SPINDRIFT / MIST
    // =========================================================================
    const grassUniforms = {
      uTime: { value: 0 }
    };

    function buildCoastalSedgeTufts() {
      // Dry golden-brown / russet winter coastal grass poking through snow crevices
      const tuftSpots = [
        [-2.8, 12.2, 1.1], [-1.7, 13.0, 0.9], [0.2, 9.6, 1.3],
        [0.6, 11.4, 0.9],  [-4.6, 9.8, 1.2],  [-3.2, 7.6, 1.0],
        [-5.8, 11.5, 1.1], [2.2, 8.2, 0.85],  [3.6, 12.0, 0.95],
        [-0.8, 6.8, 1.0],  [1.6, 5.8, 0.8],   [-2.4, 15.6, 1.15],
        [-5.1, 15.8, 1.0], [1.9, 14.2, 0.85], [-6.8, 7.2, 1.05]
      ];

      const bladeGeo = new THREE.ConeGeometry(0.032, 0.28, 4);
      bladeGeo.translate(0, 0.14, 0);

      const bladeMat = new THREE.MeshStandardMaterial({
        color: 0x7b6344,
        roughness: 0.88,
        metalness: 0.02
      });

      bladeMat.onBeforeCompile = (shader) => {
        shader.uniforms.uTime = grassUniforms.uTime;
        shader.vertexShader = shader.vertexShader
          .replace(
            '#include <common>',
            /* glsl */ `
            #include <common>
            uniform float uTime;
            `
          )
          .replace(
            '#include <begin_vertex>',
            /* glsl */ `
            #include <begin_vertex>
            vec4 wp = instanceMatrix * vec4(transformed, 1.0);
            float tipFactor = clamp(position.y / 0.28, 0.0, 1.0);
            float gust = sin(uTime * 3.4 + wp.x * 1.9 + wp.z * 1.3) * 0.045
                       + cos(uTime * 5.8 + wp.x * 3.1) * 0.020;
            transformed.x += (0.035 + gust) * tipFactor * tipFactor;
            transformed.z += gust * 0.4 * tipFactor;
            `
          );
      };

      const bladesPerTuft = 18;
      const totalBlades = tuftSpots.length * bladesPerTuft;
      const instMesh = new THREE.InstancedMesh(bladeGeo, bladeMat, totalBlades);
      instMesh.castShadow = true;
      instMesh.receiveShadow = true;

      const dummy = new THREE.Object3D();
      const col = new THREE.Color();
      let idx = 0;

      tuftSpots.forEach(([tx, tz, scale], sIdx) => {
        const { h } = getTerrainData(tx, tz);
        for (let b = 0; b < bladesPerTuft; b++) {
          const rAngle = hash2(sIdx * 19 + b, b * 7.3) * Math.PI * 2;
          const rDist = hash2(b * 13.1, sIdx * 5.7) * 0.34 * scale;
          const bx = tx + Math.cos(rAngle) * rDist;
          const bz = tz + Math.sin(rAngle) * rDist;
          const bh = getTerrainData(bx, bz).h;

          dummy.position.set(bx, bh - 0.03, bz);
          const tilt = 0.22 + hash2(b, sIdx) * 0.48;
          dummy.rotation.set(
            (hash2(b * 3, sIdx) - 0.5) * 0.4,
            rAngle,
            -tilt
          );
          const s = (0.65 + hash2(sIdx, b * 11) * 0.65) * scale;
          dummy.scale.set(s, s, s);
          dummy.updateMatrix();
          instMesh.setMatrixAt(idx, dummy.matrix);

          const shade = 0.78 + hash2(b * 5, sIdx * 3) * 0.38;
          col.setRGB(0.50 * shade, 0.40 * shade, 0.27 * shade);
          instMesh.setColorAt(idx, col);
          idx++;
        }
      });

      instMesh.instanceMatrix.needsUpdate = true;
      if (instMesh.instanceColor) instMesh.instanceColor.needsUpdate = true;
      scene.add(instMesh);
    }

    buildCoastalSedgeTufts();

    // Subtle wind-driven spindrift (surface snow crystals) & coastal mist
    function buildSpindriftSystem() {
      const count = 420;
      const positions = new Float32Array(count * 3);
      const speeds = new Float32Array(count);
      const phases = new Float32Array(count);

      for (let i = 0; i < count; i++) {
        const x = (hash2(i, 1.1) - 0.5) * 34.0;
        const z = -16.0 + hash2(i, 2.3) * 40.0;
        const { h } = getTerrainData(x, z);
        positions[i * 3]     = x;
        positions[i * 3 + 1] = h + 0.06 + hash2(i, 3.7) * 0.55;
        positions[i * 3 + 2] = z;
        speeds[i] = 1.6 + hash2(i, 4.9) * 2.1;
        phases[i] = hash2(i, 6.1) * Math.PI * 2;
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('aSpeed', new THREE.BufferAttribute(speeds, 1));
      geo.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));

      const mat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        uniforms: {
          uTime: skyUniforms.uTime
        },
        vertexShader: /* glsl */ `
          attribute float aSpeed;
          attribute float aPhase;
          uniform float uTime;
          varying float vAlpha;

          void main() {
            vec3 p = position;
            // Drift gently from left (-X) to right (+X) in the coastal breeze
            float drift = mod(p.x + 17.0 + uTime * aSpeed, 34.0) - 17.0;
            p.x = drift;
            p.y += sin(uTime * 2.8 + aPhase + p.x * 0.8) * 0.06;
            p.z += cos(uTime * 1.9 + aPhase) * 0.08;

            // Fade smoothly at edges of domain
            float edgeFade = smoothstep(-17.0, -12.0, p.x) * smoothstep(17.0, 12.0, p.x);
            vAlpha = edgeFade * (0.22 + 0.14 * sin(uTime * 3.5 + aPhase));

            vec4 mvPos = modelViewMatrix * vec4(p, 1.0);
            gl_PointSize = clamp(24.0 / -mvPos.z, 1.5, 4.2);
            gl_Position = projectionMatrix * mvPos;
          }
        `,
        fragmentShader: /* glsl */ `
          varying float vAlpha;
          void main() {
            float d = length(gl_PointCoord - vec2(0.5));
            float a = smoothstep(0.5, 0.08, d) * vAlpha;
            gl_FragColor = vec4(0.95, 0.98, 1.0, a);
          }
        `
      });

      const points = new THREE.Points(geo, mat);
      scene.add(points);
    }

    buildSpindriftSystem();

    // =========================================================================
    // 11. RESIZE HANDLER & CONTINUOUS LIVE PHOTOGRAPH ANIMATION LOOP
    // =========================================================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      skyUniforms.uTime.value = elapsed;
      oceanUniforms.uTime.value = elapsed;
      grassUniforms.uTime.value = elapsed;

      if (fresnelLensGroup) {
        fresnelLensGroup.rotation.y = elapsed * 0.35;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
