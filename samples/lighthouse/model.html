<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peggy's Cove Lighthouse — Photorealistic 3D Scene</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a2d47;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    #hud {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      color: #f4f8ff;
      background: rgba(14, 24, 38, 0.58);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 14px;
      padding: 14px 16px;
      width: 270px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.32);
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    #hud.collapsed .hud-body { display: none; }
    .hud-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .hud-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #ffffff;
    }
    .hud-subtitle {
      font-size: 11px;
      color: rgba(215, 232, 255, 0.78);
      margin-top: 2px;
    }
    #toggle-hud {
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: #fff;
      width: 26px;
      height: 26px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      transition: background 0.2s;
    }
    #toggle-hud:hover { background: rgba(255, 255, 255, 0.24); }
    .hud-body { margin-top: 12px; }
    .section-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(200, 222, 250, 0.72);
      margin: 10px 0 6px;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .btn-grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }
    button.ctrl-btn {
      background: rgba(255, 255, 255, 0.1);
      color: #eef5ff;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      padding: 7px 8px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    button.ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    button.ctrl-btn.active {
      background: rgba(208, 46, 54, 0.85);
      border-color: rgba(255, 165, 165, 0.55);
      color: #fff;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 9px;
      font-size: 12px;
      color: rgba(235, 244, 255, 0.9);
    }
    .toggle-row input[type="checkbox"] {
      accent-color: #d6323a;
      width: 15px;
      height: 15px;
      cursor: pointer;
    }
    .hint {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 10.5px;
      color: rgba(210, 228, 250, 0.7);
      line-height: 1.4;
    }
    #loading {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 40%, #2d5588, #101f33);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      z-index: 100;
      transition: opacity 0.6s ease;
    }
    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #e23c44;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;">Building 3D Coastal Scene...</div>
  </div>

  <div id="canvas-container"></div>

  <div id="hud">
    <div class="hud-header">
      <div>
        <div class="hud-title">Peggy's Cove 3D</div>
        <div class="hud-subtitle">Photorealistic Interactive Scene</div>
      </div>
      <button id="toggle-hud" title="Collapse Controls">−</button>
    </div>
    <div class="hud-body">
      <div class="section-label">Camera Views</div>
      <div class="btn-grid">
        <button class="ctrl-btn active" data-cam="photo">Original Photo</button>
        <button class="ctrl-btn" data-cam="aerial">Aerial Orbit</button>
        <button class="ctrl-btn" data-cam="closeup">Lighthouse</button>
        <button class="ctrl-btn" data-cam="shore">Shore Rocks</button>
      </div>

      <div class="section-label">Lighting</div>
      <div class="btn-grid-3">
        <button class="ctrl-btn active" data-light="noon">Winter Sun</button>
        <button class="ctrl-btn" data-light="sunset">Sunset</button>
        <button class="ctrl-btn" data-light="twilight">Blue Hour</button>
      </div>

      <div class="toggle-row">
        <label for="chk-beam">Lighthouse Beam</label>
        <input type="checkbox" id="chk-beam" />
      </div>
      <div class="toggle-row">
        <label for="chk-snow">Light Snow Flurries</label>
        <input type="checkbox" id="chk-snow" />
      </div>

      <div class="hint">
        Drag to orbit &bull; Scroll to zoom &bull; Right-drag to pan
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // =========================================================================
    // 1. DETERMINISTIC NOISE UTILITIES (CPU — matches terrain & boulders)
    // =========================================================================
    function hash2(x, y) {
      const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
      return h - Math.floor(h);
    }
    function valueNoise2D(x, y) {
      const ix = Math.floor(x), iy = Math.floor(y);
      const fx = x - ix, fy = y - iy;
      const ux = fx * fx * (3.0 - 2.0 * fx);
      const uy = fy * fy * (3.0 - 2.0 * fy);
      const a = hash2(ix, iy);
      const b = hash2(ix + 1, iy);
      const c = hash2(ix, iy + 1);
      const d = hash2(ix + 1, iy + 1);
      return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
    }
    function fbm2D(x, y, octaves = 5) {
      let val = 0.0, amp = 0.5, freq = 1.0;
      for (let i = 0; i < octaves; i++) {
        val += amp * valueNoise2D(x * freq, y * freq);
        freq *= 2.03;
        amp *= 0.5;
      }
      return val;
    }
    function ridged2D(x, y, octaves = 4) {
      let val = 0.0, amp = 0.5, freq = 1.0;
      for (let i = 0; i < octaves; i++) {
        const n = 1.0 - Math.abs(valueNoise2D(x * freq, y * freq) * 2.0 - 1.0);
        val += amp * n * n;
        freq *= 2.1;
        amp *= 0.48;
      }
      return val;
    }
    function smoothstep(edge0, edge1, x) {
      const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
      return t * t * (3 - 2 * t);
    }

    // Curved icy path centerline X(z) matching the diagonal melt track in the photo
    function getPathCenterX(z) {
      // Goes from bottom-right (x ≈ 14 at z = 28) curving toward center-left (x ≈ -2 at z = 4) then up toward lighthouse (x ≈ 2.2 at z = -14)
      const t = (z + 18.0) / 48.0; // 0 near lighthouse, 1 near foreground
      return 1.8 - Math.sin(t * Math.PI * 1.15) * 4.8 + Math.pow(Math.max(0, t - 0.32), 1.85) * 24.0;
    }

    // =========================================================================
    // 2. TERRAIN HEIGHT FUNCTION — Peggy's Cove Glacial Granite Promontory
    // =========================================================================
    const LIGHTHOUSE_POS = new THREE.Vector3(2.4, 0, -21.0);

    function getTerrainHeight(x, z) {
      // Main whaleback granite peninsula elongated along Z, gently curving
      const dxL = (x - 1.2) / 30.0;
      const dzL = (z + 2.0) / 44.0;
      const distSq = dxL * dxL + dzL * dzL;

      // Broad coastal dome rising cleanly above sea level (y = 0)
      let baseDome = 6.2 * Math.exp(-distSq * 1.05) - 1.65;

      // Elevated plateau right under the lighthouse (so base sits slightly above horizon)
      const lhDist = Math.hypot((x - LIGHTHOUSE_POS.x) * 0.95, (z - LIGHTHOUSE_POS.z) * 1.05);
      const lhMound = 2.65 * Math.exp(-(lhDist * lhDist) / 210.0);
      baseDome += lhMound;

      // Foreground rocky granite shelf framing the bottom-left and bottom-center
      const fgDist = Math.hypot((x + 4.5) * 0.65, (z - 27.5) * 0.85);
      const fgRidge = 2.15 * Math.exp(-(fgDist * fgDist) / 145.0);
      baseDome += fgRidge;

      // Left-side rugged boulder ridge dropping toward the left bay
      const leftShelf = 1.65 * Math.exp(-Math.pow((x + 19.0) / 11.0, 2.0) - Math.pow((z - 1.0) / 22.0, 2.0));
      baseDome += leftShelf;

      // Gentle smooth dome sloping down to the right ocean (just like the photo's right flank)
      const rightFlank = 1.3 * Math.exp(-Math.pow((x - 16.0) / 13.0, 2.0) - Math.pow((z + 10.0) / 18.0, 2.0));
      baseDome += rightFlank;

      // Glacial bedrock undulations (smooth whaleback swells)
      const nLarge = (fbm2D(x * 0.045 + 11.3, z * 0.045 + 7.1, 4) - 0.5) * 2.1;
      const nMed = (fbm2D(x * 0.13 + 3.7, z * 0.13 - 4.2, 4) - 0.5) * 0.72;

      // Glacial fissures / cracks carved into the foreground & midground granite
      const crackNoise = ridged2D(x * 0.14 + 2.1, z * 0.11 - 5.4, 3);
      const crackGroove = -Math.pow(Math.max(0, crackNoise - 0.56) * 2.2, 2.2) * 0.95;

      // Extra rugged fracture texture in the close foreground
      const fgMask = smoothstep(8.0, 28.0, z);
      const fgDetail = (fbm2D(x * 0.34, z * 0.34, 3) - 0.5) * 0.52 * fgMask;
      const fgCracks = -Math.pow(Math.max(0, ridged2D(x * 0.28 + 8.0, z * 0.24, 3) - 0.6) * 2.4, 2.0) * 0.75 * fgMask;

      // Flatten slightly immediately beneath the lighthouse foundation
      const flatPad = smoothstep(2.6, 6.2, lhDist);

      let h = baseDome + (nLarge + nMed + crackGroove + fgDetail + fgCracks) * (0.28 + 0.72 * flatPad);

      // Subtle depression along the curving wet/icy footpath
      if (z > -16.0 && z < 32.0) {
        const px = getPathCenterX(z);
        const pDist = Math.abs(x - px);
        const pathDip = Math.exp(-(pDist * pDist) / 2.6) * 0.24;
        h -= pathDip;
      }

      // Smooth sea-floor dropoff
      if (h < -0.5) {
        h = -0.5 + (h + 0.5) * 0.75;
      }
      return h;
    }

    LIGHTHOUSE_POS.y = getTerrainHeight(LIGHTHOUSE_POS.x, LIGHTHOUSE_POS.z) - 0.15;

    // =========================================================================
    // 3. PROCEDURAL NORMAL & BUMP MAPS (Granite + Painted Concrete)
    // =========================================================================
    function createNormalTexture(size, scale, octaves, strength, speckle = 0.0) {
      const heights = new Float32Array(size * size);
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          // Seamless periodic sampling via cosine/sine blending or wrapped noise
          const u = x / size, v = y / size;
          // Tileable 2D value noise using modular grid
          let val = 0, amp = 0.5, freq = scale;
          for (let o = 0; o < octaves; o++) {
            const gx = u * freq, gy = v * freq;
            const ix = Math.floor(gx), iy = Math.floor(gy);
            const fx = gx - ix, fy = gy - iy;
            const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
            const ix0 = ((ix % freq) + freq) % freq;
            const iy0 = ((iy % freq) + freq) % freq;
            const ix1 = (ix0 + 1) % freq;
            const iy1 = (iy0 + 1) % freq;
            const a = hash2(ix0 + o * 31, iy0 + o * 17);
            const b = hash2(ix1 + o * 31, iy0 + o * 17);
            const c = hash2(ix0 + o * 31, iy1 + o * 17);
            const d = hash2(ix1 + o * 31, iy1 + o * 17);
            const n = a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
            val += n * amp;
            freq *= 2;
            amp *= 0.5;
          }
          if (speckle > 0) {
            val += (hash2(x * 1.37, y * 2.13) - 0.5) * speckle;
          }
          heights[y * size + x] = val;
        }
      }

      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const img = ctx.createImageData(size, size);
      const data = img.data;

      for (let y = 0; y < size; y++) {
        const ym = (y - 1 + size) % size;
        const yp = (y + 1) % size;
        for (let x = 0; x < size; x++) {
          const xm = (x - 1 + size) % size;
          const xp = (x + 1) % size;
          const dx = (heights[y * size + xp] - heights[y * size + xm]) * strength;
          const dy = (heights[yp * size + x] - heights[ym * size + x]) * strength;
          const dz = 1.0;
          const invLen = 1.0 / Math.hypot(dx, dy, dz);
          const idx = (y * size + x) * 4;
          data[idx]     = Math.round(((-dx * invLen) * 0.5 + 0.5) * 255);
          data[idx + 1] = Math.round(((-dy * invLen) * 0.5 + 0.5) * 255);
          data[idx + 2] = Math.round(((dz * invLen) * 0.5 + 0.5) * 255);
          data[idx + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.anisotropy = 8;
      return tex;
    }

    const graniteNormalMap = createNormalTexture(512, 8, 5, 3.8, 0.14);
    graniteNormalMap.repeat.set(22, 22);

    const concreteNormalMap = createNormalTexture(256, 8, 4, 1.15, 0.05);
    concreteNormalMap.repeat.set(3, 5);

    // =========================================================================
    // 4. RENDERER, SCENE, CAMERA & CONTROLS
    // =========================================================================
    const container = document.getElementById('canvas-container');
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.06;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xc4daf0, 0.00145);

    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.2, 1600);
    // Initial framing closely matches the uploaded photograph
    const CAM_PRESETS = {
      photo:   { pos: new THREE.Vector3(-0.3, 6.4, 34.5), target: new THREE.Vector3(1.5, 7.6, -21.0) },
      aerial:  { pos: new THREE.Vector3(-34.0, 26.0, 24.0), target: new THREE.Vector3(1.0, 6.0, -14.0) },
      closeup: { pos: new THREE.Vector3(-8.2, 11.8, -6.5), target: new THREE.Vector3(2.4, 13.8, -21.0) },
      shore:   { pos: new THREE.Vector3(-19.5, 4.8, 18.5), target: new THREE.Vector3(2.0, 10.5, -20.5) }
    };
    camera.position.copy(CAM_PRESETS.photo.pos);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(CAM_PRESETS.photo.target);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI * 0.495;
    controls.minDistance = 5.0;
    controls.maxDistance = 140.0;
    controls.update();

    // =========================================================================
    // 5. LIGHTING & PROCEDURAL WINTER SKY DOME
    // =========================================================================
    const sunLight = new THREE.DirectionalLight(0xfff6ea, 3.2);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.near = 10;
    sunLight.shadow.camera.far = 220;
    const sc = 48;
    sunLight.shadow.camera.left = -sc;
    sunLight.shadow.camera.right = sc;
    sunLight.shadow.camera.top = sc;
    sunLight.shadow.camera.bottom = -sc;
    sunLight.shadow.bias = -0.00035;
    sunLight.shadow.normalBias = 0.04;
    sunLight.target.position.set(1.0, 5.0, -5.0);
    scene.add(sunLight);
    scene.add(sunLight.target);

    const hemiLight = new THREE.HemisphereLight(0x7eb2f0, 0x8ea4bc, 0.92);
    scene.add(hemiLight);

    // Subtle cool sky bounce fill from the right so shadows stay luminous & crisp
    const fillLight = new THREE.DirectionalLight(0x88b4e8, 0.42);
    fillLight.position.set(45, 22, -25);
    scene.add(fillLight);

    const skyUniforms = {
      uSunDir: { value: new THREE.Vector3(-0.76, 0.45, 0.46).normalize() },
      uZenithColor: { value: new THREE.Color(0x3670c2) },
      uMidSkyColor: { value: new THREE.Color(0x6fa1de) },
      uHorizonColor: { value: new THREE.Color(0xcce0f4) },
      uSunColor: { value: new THREE.Color(0xfff7e6) },
      uCloudTint: { value: new THREE.Color(0xdde8f5) },
      uTime: { value: 0 }
    };

    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      uniforms: skyUniforms,
      vertexShader: `
        varying vec3 vWorldDir;
        void main() {
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorldDir = normalize(wp.xyz);
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: `
        varying vec3 vWorldDir;
        uniform vec3 uSunDir;
        uniform vec3 uZenithColor;
        uniform vec3 uMidSkyColor;
        uniform vec3 uHorizonColor;
        uniform vec3 uSunColor;
        uniform vec3 uCloudTint;
        uniform float uTime;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
        }
        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
                     mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
        }
        float fbm(vec2 p) {
          float v = 0.0, a = 0.5;
          for (int i = 0; i < 4; i++) {
            v += a * noise(p);
            p *= 2.04;
            a *= 0.5;
          }
          return v;
        }

        void main() {
          vec3 dir = normalize(vWorldDir);
          float h = clamp(dir.y, 0.0, 1.0);

          // Crisp winter sky gradient
          vec3 col = mix(uHorizonColor, uMidSkyColor, pow(h, 0.42));
          col = mix(col, uZenithColor, pow(h, 1.15));

          // Subtle Rayleigh scattering glow around the sun
          float sunAmt = max(dot(dir, normalize(uSunDir)), 0.0);
          col += uSunColor * pow(sunAmt, 14.0) * 0.22;
          col += uSunColor * pow(sunAmt, 320.0) * 1.4;

          // Delicate low winter horizon clouds mainly on the right horizon (matching the photo)
          if (dir.y > 0.008 && dir.y < 0.26) {
            vec2 cloudUV = dir.xz / (dir.y + 0.075);
            float n = fbm(cloudUV * vec2(0.45, 0.7) + vec2(uTime * 0.004, 1.4));
            float rightBias = smoothstep(-0.15, 0.55, dir.x) * smoothstep(0.3, -0.4, dir.z);
            float altMask = smoothstep(0.012, 0.045, dir.y) * smoothstep(0.18, 0.055, dir.y);
            float cloud = smoothstep(0.54, 0.78, n) * rightBias * altMask * 0.65;
            vec3 cCol = mix(uCloudTint * 0.78, uCloudTint * 1.06, smoothstep(0.45, 0.85, n));
            col = mix(col, cCol, cloud);
          }

          // Below horizon blends smoothly into ocean haze
          if (dir.y < 0.0) {
            col = mix(uHorizonColor, vec3(0.08, 0.22, 0.36), smoothstep(0.0, -0.15, dir.y));
          }

          gl_FragColor = vec4(col, 1.0);
        }
      `
    });
    const skyDome = new THREE.Mesh(new THREE.SphereGeometry(950, 48, 32), skyMat);
    scene.add(skyDome);

    // Generate IBL Environment Map from our procedural sky for crisp reflections on glass & ice
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();
    function updateEnvironment() {
      const envScene = new THREE.Scene();
      const envSky = new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), skyMat);
      envScene.add(envSky);
      const envRT = pmremGenerator.fromScene(envScene, 0.04);
      if (scene.environment) scene.environment.dispose();
      scene.environment = envRT.texture;
    }

    // =========================================================================
    // 6. GRANITE + SNOW + ICY PATH CUSTOM PBR MATERIAL (Terrain & Boulders)
    // =========================================================================
    const terrainUniforms = {
      uSunDir: { value: skyUniforms.uSunDir.value },
      uSnowTint: { value: new THREE.Color(0xf6f9ff) },
      uTime: { value: 0 }
    };

    const graniteSnowMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.85,
      metalness: 0.04,
      normalMap: graniteNormalMap,
      normalScale: new THREE.Vector2(1.15, 1.15)
    });

    graniteSnowMat.onBeforeCompile = (shader) => {
      shader.uniforms.uSunDir = terrainUniforms.uSunDir;
      shader.uniforms.uSnowTint = terrainUniforms.uSnowTint;
      shader.uniforms.uTime = terrainUniforms.uTime;

      shader.vertexShader = shader.vertexShader.replace(
        '#include <common>',
        `#include <common>
        varying vec3 vWorldPos;
        varying vec3 vWorldNorm;`
      ).replace(
        '#include <begin_vertex>',
        `#include <begin_vertex>
        vec4 cwp = modelMatrix * vec4(transformed, 1.0);
        vWorldPos = cwp.xyz;
        vWorldNorm = normalize(mat3(modelMatrix) * objectNormal);`
      );

      shader.fragmentShader = shader.fragmentShader.replace(
        '#include <common>',
        `#include <common>
        varying vec3 vWorldPos;
        varying vec3 vWorldNorm;
        uniform vec3 uSunDir;
        uniform vec3 uSnowTint;
        uniform float uTime;

        float gHash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
        }
        float gNoise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(mix(gHash(i), gHash(i + vec2(1.0, 0.0)), u.x),
                     mix(gHash(i + vec2(0.0, 1.0)), gHash(i + vec2(1.0, 1.0)), u.x), u.y);
        }
        float gFbm(vec2 p) {
          float v = 0.0, a = 0.5;
          for (int i = 0; i < 5; i++) {
            v += a * gNoise(p);
            p *= 2.05;
            a *= 0.5;
          }
          return v;
        }
        float gRidged(vec2 p) {
          float v = 0.0, a = 0.5;
          for (int i = 0; i < 3; i++) {
            float n = 1.0 - abs(gNoise(p) * 2.0 - 1.0);
            v += a * n * n;
            p *= 2.15;
            a *= 0.5;
          }
          return v;
        }
        float pathCenterX(float z) {
          float t = (z + 18.0) / 48.0;
          return 1.8 - sin(t * 3.14159 * 1.15) * 4.8 + pow(max(0.0, t - 0.32), 1.85) * 24.0;
        }`
      ).replace(
        '#include <color_fragment>',
        `#include <color_fragment>
        vec3 wp = vWorldPos;
        vec3 wn = normalize(vWorldNorm);

        // Multi-scale Peggy's Cove glacial grey granite
        float nMacro = gFbm(wp.xz * 0.14 + vec2(2.3, -1.7));
        float nMid   = gFbm(wp.xz * 0.85 + wp.y * 0.45);
        float nFine  = gNoise(wp.xz * 7.5 + wp.y * 5.2);
        float nSpeck = gHash(floor(wp.xz * 26.0 + wp.y * 18.0));

        vec3 graniteLight = vec3(0.62, 0.64, 0.66);
        vec3 graniteMid   = vec3(0.42, 0.44, 0.47);
        vec3 graniteDark  = vec3(0.21, 0.22, 0.25);

        vec3 rockCol = mix(graniteMid, graniteLight, smoothstep(0.28, 0.78, nMacro * 0.65 + nMid * 0.35));
        rockCol = mix(rockCol, graniteDark, smoothstep(0.55, 0.88, nFine) * 0.38);
        // Mineral feldspar & mica flecks
        rockCol += (nSpeck - 0.5) * 0.085;

        // Subtle warm coastal lichen/weathering streaks
        float lichen = smoothstep(0.66, 0.84, gFbm(wp.xz * 0.32 + vec2(9.1, 4.4)));
        rockCol = mix(rockCol, vec3(0.46, 0.44, 0.38), lichen * 0.28);

        // Dark weathered granite fissures & cracks
        float crack = gRidged(wp.xz * 0.24 + vec2(1.4, -3.2));
        float crackLine = smoothstep(0.76, 0.90, crack);
        rockCol = mix(rockCol, vec3(0.11, 0.12, 0.14), crackLine * 0.72);

        // Wet dark shoreline rock zone near ocean water level
        float wetShore = 1.0 - smoothstep(0.15, 1.55, wp.y + (nMid - 0.5) * 0.45);
        rockCol *= mix(1.0, 0.42, wetShore);

        // --- Patchy Wind-Swept Winter Snow Coverage ---
        float slope = wn.y;
        float driftNoise = gFbm(wp.xz * 0.11 + vec2(-4.2, 6.1));
        float detailSnow = gFbm(wp.xz * 0.58 + vec2(1.7, -2.5));

        // Snow collects on flatter ledges and hollows, swept off steep granite domes & lighthouse summit boulders
        float lhSummitClear = smoothstep(4.5, 13.0, length(wp.xz - vec2(2.4, -21.0)));
        float snowThreshold = 0.69 - driftNoise * 0.34 - (detailSnow - 0.5) * 0.16;
        float snowMask = smoothstep(snowThreshold, snowThreshold + 0.11, slope);

        // Extra snow drifts filling foreground right & midground flats (matching photo)
        float fgRightDrift = smoothstep(-2.0, 18.0, wp.x) * smoothstep(2.0, 26.0, wp.z);
        snowMask = clamp(snowMask + fgRightDrift * 0.52 * smoothstep(0.52, 0.80, slope), 0.0, 1.0);

        // Keep foreground granite crests on bottom-left partially exposed with snowy crevices
        float fgLeftCrest = smoothstep(14.0, 28.0, wp.z) * smoothstep(6.0, -14.0, wp.x);
        snowMask *= mix(1.0, smoothstep(0.32, 0.75, 1.0 - nMacro) * 0.85, fgLeftCrest * 0.78);

        // No snow on wet shoreline rocks
        snowMask *= smoothstep(1.3, 2.7, wp.y);
        snowMask *= mix(0.45, 1.0, lhSummitClear);

        // Frost dusting on exposed foreground granite tops
        float frostDust = smoothstep(0.72, 0.94, slope) * smoothstep(0.48, 0.78, nFine) * smoothstep(2.0, 4.0, wp.y) * 0.35;
        rockCol = mix(rockCol, vec3(0.84, 0.88, 0.93), frostDust * (1.0 - snowMask));

        // --- Curved Icy / Melted Path from Foreground-Right toward Midground ---
        float pathMask = 0.0;
        if (wp.z > -15.0 && wp.z < 31.0) {
          float px = pathCenterX(wp.z);
          float pd = abs(wp.x - px);
          float widthVar = 0.95 + 0.35 * gNoise(vec2(wp.z * 0.25, 1.2));
          pathMask = (1.0 - smoothstep(widthVar * 0.55, widthVar * 1.25, pd))
                   * smoothstep(-15.0, -6.0, wp.z)
                   * smoothstep(31.0, 24.0, wp.z);
        }
        // Path melts/compacts snow into dark wet slushy stone & translucent ice
        snowMask *= (1.0 - pathMask * 0.92);
        vec3 icePathCol = mix(vec3(0.30, 0.32, 0.35), vec3(0.50, 0.56, 0.64), smoothstep(0.35, 0.75, nMid));
        rockCol = mix(rockCol, icePathCol, pathMask * 0.85);

        // Snow color with cool shadowed micro-variation
        vec3 snowCol = uSnowTint * (0.95 + 0.05 * detailSnow);
        diffuseColor.rgb = mix(rockCol, snowCol, snowMask);

        float customRoughness = mix(0.82, 0.58, snowMask);
        customRoughness = mix(customRoughness, 0.16, max(wetShore * 0.85, pathMask * 0.92));

        // Subtle crystalline snow sparkles in direct sunlight
        vec3 viewDirW = normalize(cameraPosition - wp);
        vec3 halfVec = normalize(normalize(uSunDir) + viewDirW);
        float sparkleCell = gHash(floor(wp.xz * 34.0 + wp.y * 22.0 + floor(viewDirW.xz * 6.0)));
        float sunFace = max(dot(wn, normalize(uSunDir)), 0.0);
        float customSparkle = smoothstep(0.986, 0.999, sparkleCell)
                            * pow(max(dot(wn, halfVec), 0.0), 6.0)
                            * snowMask * sunFace * 1.15;`
      ).replace(
        '#include <roughnessmap_fragment>',
        `#include <roughnessmap_fragment>
        roughnessFactor = customRoughness;`
      ).replace(
        '#include <emissivemap_fragment>',
        `#include <emissivemap_fragment>
        totalEmissiveRadiance += vec3(1.0, 0.98, 0.95) * customSparkle;`
      );
    };

    // =========================================================================
    // 7. BUILD TERRAIN MESH (Granite Headland)
    // =========================================================================
    const terrainW = 148, terrainD = 134, segsX = 220, segsZ = 200;
    const terrainGeo = new THREE.PlaneGeometry(terrainW, terrainD, segsX, segsZ);
    terrainGeo.rotateX(-Math.PI / 2);

    const posAttr = terrainGeo.attributes.position;
    for (let i = 0; i < posAttr.count; i++) {
      const x = posAttr.getX(i);
      const z = posAttr.getZ(i) - 4.0;
      posAttr.setZ(i, z);
      posAttr.setY(i, getTerrainHeight(x, z));
    }
    terrainGeo.computeVertexNormals();

    const terrainMesh = new THREE.Mesh(terrainGeo, graniteSnowMat);
    terrainMesh.receiveShadow = true;
    terrainMesh.castShadow = true;
    scene.add(terrainMesh);

    // =========================================================================
    // 8. GLACIAL GRANITE BOULDERS (Hero formations matching the photo)
    // =========================================================================
    function createGraniteBoulder(rx, ry, rz, seed, flatness = 0.25) {
      const geo = new THREE.IcosahedronGeometry(1.0, 4);
      const p = geo.attributes.position;
      const v = new THREE.Vector3();
      for (let i = 0; i < p.count; i++) {
        v.fromBufferAttribute(p, i);
        // Smooth glacial rounding + subtle planar rock facets
        const n1 = fbm2D(v.x * 1.6 + seed, v.z * 1.6 - seed * 0.7, 3) - 0.5;
        const n2 = fbm2D(v.y * 2.4 + seed * 1.3, v.x * 2.2 + v.z * 1.9, 3) - 0.5;
        const crack = Math.max(0, ridged2D(v.x * 2.1 + seed, v.y * 2.1 + v.z, 2) - 0.72);
        const disp = 1.0 + n1 * 0.34 + n2 * 0.14 - crack * 0.32;
        v.x *= rx * disp;
        v.y *= ry * disp;
        v.z *= rz * disp;
        if (v.y < -ry * (1.0 - flatness)) {
          v.y = -ry * (1.0 - flatness) + (v.y + ry * (1.0 - flatness)) * 0.25;
        }
        p.setXYZ(i, v.x, v.y, v.z);
      }
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, graniteSnowMat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    const boulderConfigs = [
      // Two iconic rounded boulders immediately in front-left of the lighthouse base
      { x: -3.2, z: -16.8, rx: 2.35, ry: 1.55, rz: 1.85, rotY: 0.3,  seed: 1.1 },
      { x: 0.4,  z: -16.2, rx: 1.75, ry: 1.15, rz: 1.35, rotY: -0.4, seed: 2.4 },
      { x: -6.4, z: -15.0, rx: 1.35, ry: 0.95, rz: 1.15, rotY: 0.8,  seed: 3.7 },
      { x: 4.5,  z: -13.5, rx: 1.15, ry: 0.85, rz: 0.95, rotY: 1.2,  seed: 4.3 },

      // Prominent lone boulder near the right foreground beside the curved icy path
      { x: 14.5, z: 16.5,  rx: 1.35, ry: 1.45, rz: 1.25, rotY: 0.5,  seed: 5.9 },
      { x: 7.4,  z: 7.2,   rx: 1.25, ry: 0.85, rz: 1.05, rotY: -0.6, seed: 6.8 },

      // Left-side dramatic coastal granite blocks dropping to the Atlantic
      { x: -24.5, z: 12.5, rx: 3.8, ry: 2.6, rz: 3.2, rotY: 0.2,  seed: 8.1 },
      { x: -19.5, z: 6.5,  rx: 3.4, ry: 2.3, rz: 2.8, rotY: 0.7,  seed: 9.4 },
      { x: -16.5, z: -2.0, rx: 3.1, ry: 2.1, rz: 2.6, rotY: -0.5, seed: 10.6 },
      { x: -14.2, z: -10.5,rx: 2.6, ry: 1.8, rz: 2.2, rotY: 0.9,  seed: 11.8 },
      { x: -11.0, z: -14.5,rx: 2.0, ry: 1.4, rz: 1.7, rotY: 0.4,  seed: 12.5 },
      { x: -28.0, z: 19.0, rx: 4.2, ry: 2.5, rz: 3.5, rotY: -0.3, seed: 13.2 },

      // Right shoreline granite boulders sloping into St. Margaret's Bay
      { x: 18.5, z: -8.5,  rx: 3.2, ry: 1.9, rz: 2.9, rotY: 0.4,  seed: 14.7 },
      { x: 22.5, z: -1.5,  rx: 2.8, ry: 1.7, rz: 2.6, rotY: -0.8, seed: 15.3 },
      { x: 21.0, z: 10.0,  rx: 2.2, ry: 1.3, rz: 1.9, rotY: 0.6,  seed: 16.4 },
      { x: 19.0, z: 18.0,  rx: 1.8, ry: 1.1, rz: 1.6, rotY: -0.2, seed: 17.9 },

      // Midground & foreground accents
      { x: -9.5, z: 19.5,  rx: 2.1, ry: 1.15, rz: 1.7, rotY: 0.3, seed: 18.6 },
      { x: 10.5, z: -15.8, rx: 2.6, ry: 1.55, rz: 2.2, rotY: -0.5, seed: 19.2 },
      { x: -7.2, z: -4.8,  rx: 1.3, ry: 0.75, rz: 1.1, rotY: 1.1, seed: 20.5 },
      { x: 11.2, z: 19.8,  rx: 1.15, ry: 0.65, rz: 0.95, rotY: 0.2, seed: 21.3 }
    ];

    for (const b of boulderConfigs) {
      const boulder = createGraniteBoulder(b.rx, b.ry, b.rz, b.seed);
      const y = getTerrainHeight(b.x, b.z) + b.ry * 0.32;
      boulder.position.set(b.x, y, b.z);
      boulder.rotation.y = b.rotY;
      scene.add(boulder);
    }

    // =========================================================================
    // 9. PEGGY'S COVE LIGHTHOUSE (High-Detail Architectural Recreation)
    // =========================================================================
    const lighthouseGroup = new THREE.Group();
    lighthouseGroup.position.copy(LIGHTHOUSE_POS);
    // Slight rotation so front-left entrance porch and right slit windows match the photo
    lighthouseGroup.rotation.y = 0.24;

    const whiteConcreteMat = new THREE.MeshStandardMaterial({

    });

    const redMetalMat = new THREE.MeshStandardMaterial({

    });

    const whiteMetalMat = new THREE.MeshStandardMaterial({

    });

    const darkRecessMat = new THREE.MeshStandardMaterial({

    const lanternGlassMat = new THREE.MeshPhysicalMaterial({

    });

    // 9a. Concrete Plinth Foundation
    const plinth = new THREE.Mesh(new THREE.CylinderGeometry(2.72, 2.95, 1.2, 8), whiteConcreteMat);
    plinth.position.y = 0.2;

    // 9b. Tapered Octagonal Tower Shaft
    const towerHeight = 10.6;

    const towerMesh = new THREE.Mesh(towerGeo, whiteConcreteMat);
    towerMesh.position.y = 0.75 + towerHeight * 0.5;
    towerMesh.castShadow = true;

    // 9c. Entrance Vestibule (left-front white porch with pitched cap)
    const porchGroup = new THREE.Group();

    porchRoof.position.set(0, 1.42, 0.02);

    porchGroup.add(porchRoof);

    // Recessed door/window detail on porch
    const porchDoor = new THREE.Mesh(new THREE.BoxGeometry(0.68, 1.85, 0.1), whiteConcreteMat);
    porchDoor.position.set(0.32, -0.35, 0.71);

    const doorFrame = new THREE.Mesh(new THREE.BoxGeometry(0.76, 1.92, 0.06), new THREE.MeshStandardMaterial({ color: 0xd0d7e0, roughness: 0.7 }));
    doorFrame.position.set(0.32, -0.35, 0.70);
    porchGroup.add(doorFrame);
    const porchSmallVent = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.24, 0.08), darkRecessMat);
    porchSmallVent.position.set(-0.35, 0.35, 0.72);
    porchGroup.add(porchSmallVent);
    lighthouseGroup.add(porchGroup);

    // 9d. Tower Windows & Lower Dark Vent (matching right-front & right faces in photo)
    const lowerWindow = new THREE.Mesh(new THREE.BoxGeometry(0.56, 0.48, 0.18), darkRecessMat);
    lowerWindow.position.set(0.62, 2.25, 2.18);
    lowerWindow.rotation.y = 0.26;
    lighthouseGroup.add(lowerWindow);

    const slitYPositions = [5.1, 7.6, 9.6];
    for (let i = 0; i < slitYPositions.length; i++) {
      const y = slitYPositions[i];
      const rAtY = THREE.MathUtils.lerp(2.48, 1.56, (y - 0.75) / towerHeight) * 0.92;
      const slit = new THREE.Mesh(new THREE.BoxGeometry(0.20, 0.88, 0.22), darkRecessMat);
      const angle = i === 2 ? 0.95 : 1.05;
      slit.position.set(Math.sin(angle) * rAtY, y, Math.cos(angle) * rAtY);
      slit.rotation.y = angle;
      lighthouseGroup.add(slit);
    }

    // 9e. Corbelled Flared Gallery Deck
    const galleryBaseY = 0.75 + towerHeight;
    const flare = new THREE.Mesh(new THREE.CylinderGeometry(2.14, 1.58, 0.62, 8), whiteConcreteMat);
    flare.position.y = galleryBaseY + 0.31;
    flare.castShadow = true;
    flare.receiveShadow = true;
    lighthouseGroup.add(flare);

    const deckSlab = new THREE.Mesh(new THREE.CylinderGeometry(2.18, 2.14, 0.22, 8), whiteConcreteMat);
    deckSlab.position.y = galleryBaseY + 0.72;
    deckSlab.castShadow = true;
    deckSlab.receiveShadow = true;
    lighthouseGroup.add(deckSlab);

    // Gallery Railing (8 posts + 2 horizontal octagonal rail loops)
    const railY = galleryBaseY + 0.83;
    const railR = 2.04;
    const railH = 0.96;
    const railPts = [];
    for (let i = 0; i < 8; i++) {
      const ang = (i / 8) * Math.PI * 2 + Math.PI / 8;

        const segLen = p1.distanceTo(p2);
        const railBar = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.026, segLen, 8), whiteMetalMat);
        railBar.position.set((p1.x + p2.x) * 0.5, railY + hOff, (p1.z + p2.z) * 0.5);
        railBar.quaternion.setFromUnitVectors(

    // 9f. Red Lantern Room Base (Parapet)
    const lanternBaseY = galleryBaseY + 0.83;
    const redParapet = new THREE.Mesh(new THREE.CylinderGeometry(1.36, 1.38, 1.05, 8), redMetalMat);

    // 9g. Lantern Glazing + Mullions + Internal Fresnel Lens
    const glassY = lanternBaseY + 1.09;

    glassCylinder.position.y = glassY + glassH * 0.5;
    lighthouseGroup.add(glassCylinder);

    // 8 Vertical red mullions around lantern glass
    for (let i = 0; i < 8; i++) {
      const ang = (i / 8) * Math.PI * 2 + Math.PI / 8;
      const mullion = new THREE.Mesh(new THREE.CylinderGeometry(0.036, 0.036, glassH + 0.06, 6), redMetalMat);
      mullion.position.set(Math.cos(ang) * 1.32, glassY + glassH * 0.5, Math.sin(ang) * 1.32);
      lighthouseGroup.add(mullion);
    }

    // Internal Fresnel Lens & Lamp Core
    const lensY = glassY + glassH * 0.52;
    const brassMat = new THREE.MeshStandardMaterial({ color: 0xb08a3e, roughness: 0.3, metalness: 0.85 });
    const lensPedestal = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.42, 0.55, 12), brassMat);
    lensPedestal.position.y = glassY + 0.25;
    lighthouseGroup.add(lensPedestal);

    const lampCoreMat = new THREE.MeshStandardMaterial({
      color: 0xfff5d6,
      emissive: new THREE.Color(0xffcf70),
      emissiveIntensity: 0.45,
      roughness: 0.15
    });
    const fresnelCore = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.68, 16), lampCoreMat);
    fresnelCore.position.y = lensY;
    lighthouseGroup.add(fresnelCore);

    // Optional Rotating Volumetric Lighthouse Beam (toggled via UI or Blue Hour)
    const beamPivot = new THREE.Group();
    beamPivot.position.y = lensY;
    beamPivot.visible = false;
    lighthouseGroup.add(beamPivot);

    const beamMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      uniforms: {
        uColor: { value: new THREE.Color(0xffdfa0) },
        uOpacity: { value: 0.28 }
      },
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vNorm;
        varying vec3 vView;
        void main() {
          vUv = uv;
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          vNorm = normalize(normalMatrix * normal);
          vView = normalize(-mv.xyz);
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: `
        varying vec2 vUv;
        varying vec3 vNorm;
        varying vec3 vView;
        uniform vec3 uColor;
        uniform float uOpacity;
        void main() {
          float edge = pow(abs(dot(vNorm, vView)), 1.6);
          float fade = smoothstep(0.0, 0.12, vUv.y) * pow(1.0 - vUv.y, 1.85);
          gl_FragColor = vec4(uColor, edge * fade * uOpacity);
        }
      `
    });
    const beamLen = 56;
    const beamConeGeo = new THREE.ConeGeometry(7.2, beamLen, 28, 1, true);
    beamConeGeo.translate(0, -beamLen * 0.5, 0);
    beamConeGeo.rotateX(Math.PI / 2);

    const beamA = new THREE.Mesh(beamConeGeo, beamMat);
    beamA.position.z = 0.5;
    beamPivot.add(beamA);
    const beamB = new THREE.Mesh(beamConeGeo, beamMat);
    beamB.rotation.y = Math.PI;
    beamB.position.z = -0.5;
    beamPivot.add(beamB);

    const beaconPointLight = new THREE.PointLight(0xffcf78, 0, 28);
    beaconPointLight.position.y = lensY;
    lighthouseGroup.add(beaconPointLight);

    // 9h. Red Conical Octagonal Roof + Standing Seams + Ventilator Ball Finial
    const roofBaseY = glassY + glassH;
    const roofEave = new THREE.Mesh(new THREE.CylinderGeometry(1.52, 1.48, 0.16, 8), redMetalMat);
    roofEave.position.y = roofBaseY + 0.08;
    roofEave.castShadow = true;
    lighthouseGroup.add(roofEave);

    const roofCone = new THREE.Mesh(new THREE.ConeGeometry(1.48, 1.28, 8), redMetalMat);
    roofCone.position.y = roofBaseY + 0.16 + 0.64;
    roofCone.castShadow = true;
    lighthouseGroup.add(roofCone);

    const ventCap = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.28, 0.34, 12), redMetalMat);
    ventCap.position.y = roofBaseY + 1.42;
    lighthouseGroup.add(ventCap);

    const finialBall = new THREE.Mesh(new THREE.SphereGeometry(0.20, 14, 12), redMetalMat);
    finialBall.position.y = roofBaseY + 1.68;
    lighthouseGroup.add(finialBall);

    const lightningRod = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.022, 0.55, 6), redMetalMat);
    lightningRod.position.y = roofBaseY + 2.02;
    lighthouseGroup.add(lightningRod);

    // 9i. Small Dark Iron Handrail on the Granite Steps (right of lighthouse base, visible in photo)
    const ironMat = new THREE.MeshStandardMaterial({ color: 0x22262c, roughness: 0.55, metalness: 0.7 });
    const stairRailGroup = new THREE.Group();
    stairRailGroup.position.set(2.95, 0.65, 0.75);
    for (const dx of [0, 1.35]) {
      const p = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1.05, 6), ironMat);
      p.position.set(dx, 0.5 - dx * 0.28, 0);
      stairRailGroup.add(p);
    }
    const topRail = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1.5, 6), ironMat);
    topRail.position.set(0.68, 0.82, 0);
    topRail.rotation.z = Math.PI / 2 - 0.27;
    stairRailGroup.add(topRail);
    lighthouseGroup.add(stairRailGroup);

    // =========================================================================
    // 10. DRY WINTER COASTAL GRASS TUFTS (Instanced in rocky crevices)
    // =========================================================================
    const grassCount = 950;
    const bladeGeo = new THREE.ConeGeometry(0.035, 0.42, 3);
    bladeGeo.translate(0, 0.21, 0);
    const grassMat = new THREE.MeshStandardMaterial({
      color: 0x867458,
      roughness: 0.92,
      metalness: 0.0
    });
    const grassInst = new THREE.InstancedMesh(bladeGeo, grassMat, grassCount);
    const dummy = new THREE.Object3D();
    const gColor = new THREE.Color();
    let placed = 0;

    for (let i = 0; i < 4500 && placed < grassCount; i++) {
      const gx = (hash2(i * 1.13, 4.7) - 0.5) * 44.0;
      const gz = (hash2(i * 2.31, 9.2) - 0.5) * 52.0 + 4.0;
      const gy = getTerrainHeight(gx, gz);
      if (gy < 2.2) continue;
      // Avoid lighthouse footprint & icy path center
      if (Math.hypot(gx - LIGHTHOUSE_POS.x, gz - LIGHTHOUSE_POS.z) < 4.5) continue;
      if (Math.abs(gx - getPathCenterX(gz)) < 1.35) continue;

      // Cluster into natural coastal tussocks
      const cluster = fbm2D(gx * 0.35 + 12.0, gz * 0.35 - 5.0, 2);
      if (cluster < 0.57) continue;

      const s = 0.55 + hash2(i, 7.7) * 0.9;
      dummy.position.set(gx, gy - 0.04, gz);
      dummy.rotation.set(
        (hash2(i, 1.1) - 0.5) * 0.65,
        hash2(i, 2.2) * Math.PI * 2,
        (hash2(i, 3.3) - 0.5) * 0.65
      );
      dummy.scale.set(s, s * (0.75 + hash2(i, 5.5) * 0.6), s);
      dummy.updateMatrix();
      grassInst.setMatrixAt(placed, dummy.matrix);

      gColor.setHSL(0.09 + (hash2(i, 8.8) - 0.5) * 0.03, 0.24, 0.34 + hash2(i, 6.6) * 0.14);
      grassInst.setColorAt(placed, gColor);
      placed++;
    }
    grassInst.count = placed;
    grassInst.instanceMatrix.needsUpdate = true;
    if (grassInst.instanceColor) grassInst.instanceColor.needsUpdate = true;
    scene.add(grassInst);

    // =========================================================================
    // 11. ANIMATED COLD ATLANTIC OCEAN SHADER (Waves, Fresnel, Surf Foam)
    // =========================================================================
    const oceanUniforms = {
      uTime: { value: 0 },
      uSunDir: { value: skyUniforms.uSunDir.value },
      uSunColor: { value: new THREE.Color(0xfff5e4) },
      uSkyHorizon: { value: skyUniforms.uHorizonColor.value },
      uSkyZenith: { value: skyUniforms.uZenithColor.value },
      uDeepColor: { value: new THREE.Color(0x0d2d4a) },
      uShallowColor: { value: new THREE.Color(0x1f5378) }
    };

    const oceanGeo = new THREE.PlaneGeometry(1600, 1600, 140, 140);
    oceanGeo.rotateX(-Math.PI / 2);

    const oceanMat = new THREE.ShaderMaterial({
      uniforms: oceanUniforms,
      vertexShader: `
        uniform float uTime;
        varying vec3 vWorldPos;
        varying float vWaveH;
        void main() {
          vec4 wp = modelMatrix * vec4(position, 1.0);
          float d = length(wp.xz);
          float atten = 1.0 - smoothstep(140.0, 620.0, d);
          float w1 = sin(wp.x * 0.16 + wp.z * 0.12 + uTime * 1.15) * 0.16;
          float w2 = sin(wp.x * -0.09 + wp.z * 0.21 + uTime * 1.45) * 0.11;
          float w3 = cos(wp.x * 0.28 - wp.z * 0.17 + uTime * 1.85) * 0.05;
          float h = (w1 + w2 + w3) * atten;
          wp.y += h;
          vWaveH = h;
          vWorldPos = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform vec3 uSunDir;
        uniform vec3 uSunColor;
        uniform vec3 uSkyHorizon;
        uniform vec3 uSkyZenith;
        uniform vec3 uDeepColor;
        uniform vec3 uShallowColor;

        varying vec3 vWorldPos;
        varying float vWaveH;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
        }
        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
                     mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
        }
        float waveHeight(vec2 p) {
          float t = uTime;
          float h = 0.0;
          h += noise(p * 0.22 + vec2(t * 0.35, t * 0.22)) * 0.55;
          h += noise(p * 0.58 - vec2(t * 0.45, -t * 0.31)) * 0.28;
          h += noise(p * 1.45 + vec2(-t * 0.62, t * 0.54)) * 0.12;
          h += noise(p * 3.20 + vec2(t * 0.85, -t * 0.7)) * 0.05;
          return h;
        }

        void main() {
          vec3 viewVec = cameraPosition - vWorldPos;
          float dist = length(viewVec);
          vec3 V = viewVec / dist;

          // Finite-difference micro-wave normal (fades slightly with distance to avoid aliasing)
          float eps = mix(0.18, 1.2, smoothstep(20.0, 350.0, dist));
          float hC = waveHeight(vWorldPos.xz);
          float hX = waveHeight(vWorldPos.xz + vec2(eps, 0.0));
          float hZ = waveHeight(vWorldPos.xz + vec2(0.0, eps));
          float bumpScale = mix(0.65, 0.22, smoothstep(40.0, 420.0, dist));
          vec3 N = normalize(vec3((hC - hX) * bumpScale / eps, 1.0, (hC - hZ) * bumpScale / eps));

          // Physically inspired Fresnel reflection
          float NdotV = max(dot(N, V), 0.001);
          float fresnel = 0.03 + 0.97 * pow(1.0 - NdotV, 4.6);

          vec3 R = reflect(-V, N);
          vec3 skyRefl = mix(uSkyHorizon, uSkyZenith, pow(clamp(R.y, 0.0, 1.0), 0.55));

          vec3 waterBase = mix(uDeepColor, uShallowColor, clamp(hC * 0.85 + 0.15, 0.0, 1.0));
          vec3 col = mix(waterBase, skyRefl, clamp(fresnel * 0.92, 0.0, 0.88));

          // Crisp winter sun specular glints on choppy swells
          vec3 L = normalize(uSunDir);
          vec3 H = normalize(L + V);
          float specTight = pow(max(dot(N, H), 0.0), 260.0) * 2.2;
          float specBroad = pow(max(dot(N, H), 0.0), 26.0) * 0.18;
          col += uSunColor * (specTight + specBroad);

          // Shoreline surf foam ring around the granite headland
          vec2 penUV = vec2((vWorldPos.x - 1.2) / 30.0, (vWorldPos.z + 2.0) / 44.0);
          float penDist = length(penUV);
          float shoreBand = smoothstep(1.38, 1.02, penDist) * smoothstep(0.76, 1.08, penDist);
          float surfWave = sin(penDist * 28.0 - uTime * 2.2 + hC * 4.5) * 0.5 + 0.5;
          float foam = shoreBand * smoothstep(0.42, 0.82, surfWave * 0.65 + hC * 0.55) * 0.72;
          col = mix(col, vec3(0.86, 0.92, 0.97), foam);

          // Atmospheric distance haze blending cleanly to the horizon
          float fogFactor = 1.0 - exp(-pow(dist * 0.00155, 1.6));
          col = mix(col, uSkyHorizon, clamp(fogFactor, 0.0, 1.0));

          gl_FragColor = vec4(col, 1.0);
        }
      `
    });
    const oceanMesh = new THREE.Mesh(oceanGeo, oceanMat);
    oceanMesh.position.y = 0.0;
    scene.add(oceanMesh);

    // =========================================================================
    // 12. DISTANT COASTLINE HILLS (St. Margaret's Bay right + island sliver left)
    // =========================================================================
    function createDistantLand(startAngle, endAngle, radius, maxHeight, seed) {
      const segs = 90;
      const geo = new THREE.BufferGeometry();
      const verts = [];
      const indices = [];

      for (let i = 0; i <= segs; i++) {
        const t = i / segs;
        const ang = THREE.MathUtils.lerp(startAngle, endAngle, t);
        const envelope = Math.sin(t * Math.PI);
        const h = (0.35 + 0.65 * fbm2D(t * 7.5 + seed, seed, 4)) * maxHeight * Math.pow(envelope, 0.65);

        const x = Math.sin(ang) * radius;
        const z = -Math.cos(ang) * radius;
        verts.push(x, -1.5, z);
        verts.push(x, h, z);
      }
      for (let i = 0; i < segs; i++) {
        const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
        indices.push(a, b, c, b, d, c);
      }
      geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
      geo.setIndex(indices);
      geo.computeVertexNormals();

      const mat = new THREE.MeshStandardMaterial({
        color: 0x455a73,
        roughness: 0.95,
        metalness: 0.0,
        side: THREE.DoubleSide
      });
      return new THREE.Mesh(geo, mat);
    }

    // Right horizon hills (St. Margaret's Bay coastline matching the photo)
    const rightCoast = createDistantLand(0.14, 1.35, 560, 17.5, 3.2);
    scene.add(rightCoast);

    // Tiny low island sliver on the left horizon (matching the photo)
    const leftIsland = createDistantLand(-0.56, -0.34, 580, 4.2, 8.7);
    scene.add(leftIsland);

    // =========================================================================
    // 13. OPTIONAL LIGHT SNOW FLURRIES (Particle System)
    // =========================================================================
    const snowCount = 1400;
    const snowGeo = new THREE.BufferGeometry();
    const snowPositions = new Float32Array(snowCount * 3);
    const snowSeeds = new Float32Array(snowCount);
    for (let i = 0; i < snowCount; i++) {
      snowPositions[i * 3]     = (Math.random() - 0.5) * 90;
      snowPositions[i * 3 + 1] = Math.random() * 34 + 1;
      snowPositions[i * 3 + 2] = (Math.random() - 0.5) * 90;
      snowSeeds[i] = Math.random() * Math.PI * 2;
    }
    snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPositions, 3));
    const snowMat = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 0.16,
      transparent: true,
      opacity: 0.78,
      depthWrite: false
    });
    const snowPoints = new THREE.Points(snowGeo, snowMat);
    snowPoints.visible = false;
    scene.add(snowPoints);

    // =========================================================================
    // 14. LIGHTING PRESETS (Winter Sun / Sunset / Blue Hour)
    // =========================================================================
    const LIGHT_PRESETS = {
      noon: {
        sunDir: new THREE.Vector3(-0.76, 0.44, 0.47).normalize(),
        sunColor: 0xfff7ec,
        sunIntensity: 3.15,
        hemiSky: 0x7eb4f2,
        hemiGround: 0x8ea4bc,
        hemiIntensity: 0.94,
        zenith: 0x356fc2,
        midSky: 0x6ea0de,
        horizon: 0xcce0f5,
        cloudTint: 0xdde8f5,
        fogColor: 0xc5dbf0,
        exposure: 1.05,
        snowTint: 0xf7faff,
        autoBeam: false
      },
      sunset: {
        sunDir: new THREE.Vector3(-0.88, 0.16, 0.45).normalize(),
        sunColor: 0xffa75e,
        sunIntensity: 3.3,
        hemiSky: 0x627ba8,
        hemiGround: 0x5c4b4e,
        hemiIntensity: 0.68,
        zenith: 0x26447a,
        midSky: 0x8d6e82,
        horizon: 0xf2a572,
        cloudTint: 0xffbfa0,
        fogColor: 0xd99e7e,
        exposure: 1.0,
        snowTint: 0xfff0e4,
        autoBeam: false
      },
      twilight: {
        sunDir: new THREE.Vector3(-0.82, 0.05, -0.55).normalize(),
        sunColor: 0x7898cc,
        sunIntensity: 0.75,
        hemiSky: 0x2c4a78,
        hemiGround: 0x1e2c3e,
        hemiIntensity: 0.58,
        zenith: 0x0b1a36,
        midSky: 0x1e3862,
        horizon: 0x4f6c94,
        cloudTint: 0x657c9e,
        fogColor: 0x374f72,
        exposure: 1.12,
        snowTint: 0xbfd4f0,
        autoBeam: true
      }
    };

    const chkBeam = document.getElementById('chk-beam');
    const chkSnow = document.getElementById('chk-snow');

    function setBeamEnabled(enabled) {
      beamPivot.visible = enabled;
      lampCoreMat.emissiveIntensity = enabled ? 4.8 : 0.45;
      beaconPointLight.intensity = enabled ? 18.0 : 0.0;
      chkBeam.checked = enabled;
    }

    function applyLightPreset(key) {
      const p = LIGHT_PRESETS[key];
      sunLight.position.copy(p.sunDir).multiplyScalar(95);
      sunLight.color.setHex(p.sunColor);
      sunLight.intensity = p.sunIntensity;

      hemiLight.color.setHex(p.hemiSky);
      hemiLight.groundColor.setHex(p.hemiGround);
      hemiLight.intensity = p.hemiIntensity;

      skyUniforms.uSunDir.value.copy(p.sunDir);
      skyUniforms.uZenithColor.value.setHex(p.zenith);
      skyUniforms.uMidSkyColor.value.setHex(p.midSky);
      skyUniforms.uHorizonColor.value.setHex(p.horizon);
      skyUniforms.uSunColor.value.setHex(p.sunColor);
      skyUniforms.uCloudTint.value.setHex(p.cloudTint);

      oceanUniforms.uSunColor.value.setHex(p.sunColor);
      terrainUniforms.uSnowTint.value.setHex(p.snowTint);

      scene.fog.color.setHex(p.fogColor);
      renderer.toneMappingExposure = p.exposure;
      setBeamEnabled(p.autoBeam);
      updateEnvironment();
    }

    applyLightPreset('noon');

    // =========================================================================
    // 15. SMOOTH CAMERA TRANSITIONS & UI HANDLERS
    // =========================================================================
    let camTransition = null;
    function goToPreset(key) {
      const targetPreset = CAM_PRESETS[key];
      if (!targetPreset) return;
      camTransition = {
        startPos: camera.position.clone(),
        endPos: targetPreset.pos.clone(),
        startTarget: controls.target.clone(),
        endTarget: targetPreset.target.clone(),
        progress: 0
      };
    }

    document.querySelectorAll('[data-cam]').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-cam]').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        goToPreset(btn.dataset.cam);
      });
    });

    document.querySelectorAll('[data-light]').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-light]').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        applyLightPreset(btn.dataset.light);
      });
    });

    chkBeam.addEventListener('change', (e) => setBeamEnabled(e.target.checked));
    chkSnow.addEventListener('change', (e) => { snowPoints.visible = e.target.checked; });

    // Cancel camera transition if user manually grabs controls
    controls.addEventListener('start', () => { camTransition = null; });

    const hudEl = document.getElementById('hud');
    const toggleHudBtn = document.getElementById('toggle-hud');
    toggleHudBtn.addEventListener('click', () => {
      hudEl.classList.toggle('collapsed');
      toggleHudBtn.textContent = hudEl.classList.contains('collapsed') ? '+' : '−';
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // =========================================================================
    // 16. RENDER LOOP
    // =========================================================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.getElapsedTime();

      oceanUniforms.uTime.value = elapsed;
      skyUniforms.uTime.value = elapsed;
      terrainUniforms.uTime.value = elapsed;

      if (beamPivot.visible) {
        beamPivot.rotation.y = elapsed * 0.65;
      }

      if (snowPoints.visible) {
        const sp = snowGeo.attributes.position.array;
        for (let i = 0; i < snowCount; i++) {
          sp[i * 3]     += Math.sin(elapsed * 0.7 + snowSeeds[i]) * dt * 0.9 + dt * 0.75;
          sp[i * 3 + 1] -= dt * (1.8 + (i % 5) * 0.25);
          if (sp[i * 3 + 1] < 0.2) {
            sp[i * 3 + 1] = 34.0;
            sp[i * 3] = (Math.random() - 0.5) * 90;
          }
          if (sp[i * 3] > 45) sp[i * 3] = -45;
        }
        snowGeo.attributes.position.needsUpdate = true;
      }

      if (camTransition) {
        camTransition.progress = Math.min(1, camTransition.progress + dt * 1.15);
        const t = camTransition.progress;
        const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        camera.position.lerpVectors(camTransition.startPos, camTransition.endPos, ease);
        controls.target.lerpVectors(camTransition.startTarget, camTransition.endTarget, ease);
        if (camTransition.progress >= 1) camTransition = null;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    // Hide loading screen once first frame is ready
    renderer.render(scene, camera);
    document.getElementById('loading').classList.add('hidden');
    animate();
  </script>
</body>
</html>
