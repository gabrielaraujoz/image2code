<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photorealistic 3D Bamboo Forest</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #071109;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e9f3ea;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    #hud {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(10, 20, 13, 0.62);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(170, 220, 175, 0.22);
      border-radius: 14px;
      padding: 14px 16px;
      width: 260px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      transition: opacity 0.25s ease;
    }
    #hud h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.4px;
      margin-bottom: 4px;
      color: #d7f5da;
    }
    #hud p {
      font-size: 11px;
      color: rgba(215, 240, 218, 0.72);
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
    }
    button {
      background: rgba(135, 205, 145, 0.14);
      border: 1px solid rgba(165, 225, 172, 0.28);
      color: #e4f7e6;
      border-radius: 8px;
      padding: 7px 8px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    button:hover {
      background: rgba(135, 205, 145, 0.28);
      border-color: rgba(190, 245, 196, 0.55);
    }
    button.active {
      background: rgba(110, 195, 122, 0.38);
      border-color: #a9efb2;
      color: #ffffff;
    }
    .slider-group {
      margin-bottom: 9px;
    }
    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: rgba(225, 245, 228, 0.85);
      margin-bottom: 4px;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #82d98e;
      cursor: pointer;
    }
    #toggle-ui {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 11;
      padding: 8px 12px;
      background: rgba(10, 20, 13, 0.62);
      backdrop-filter: blur(10px);
    }
    .hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <button id="toggle-ui">Hide UI</button>

  <div id="hud">
    <h1>Arashiyama Bamboo Grove 3D</h1>
    <p>Drag to look around &bull; Scroll to zoom &bull; Right-drag to pan</p>

    <div class="btn-row">
      <button id="cam-photo" class="active">Photo Match</button>
      <button id="cam-walk">Eye Level</button>
      <button id="cam-orbit">Canopy Drift</button>
      <button id="cam-wide">Ultra-Wide</button>
    </div>

    <div class="slider-group">
      <div class="slider-label"><span>Wind Sway</span><span id="val-wind">1.0x</span></div>
      <input id="ctrl-wind" type="range" min="0" max="2.5" step="0.1" value="1.0" />
    </div>
    <div class="slider-group">
      <div class="slider-label"><span>Sun Exposure</span><span id="val-exp">1.10</span></div>
      <input id="ctrl-exp" type="range" min="0.7" max="1.6" step="0.02" value="1.10" />
    </div>
    <div class="slider-group">
      <div class="slider-label"><span>Sky Bloom</span><span id="val-bloom">0.42</span></div>
      <input id="ctrl-bloom" type="range" min="0" max="1.0" step="0.02" value="0.42" />
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    // Deterministic PRNG for consistent photorealistic layout
    function createRng(seed = 4219) {
      let s = seed >>> 0;
      return () => {
        s = (s * 1664525 + 1013904223) >>> 0;
        return s / 4294967296;
      };
    }
    const rand = createRng(7331);
    const randRange = (a, b) => a + rand() * (b - a);

    // =========================================================================
    // 1. RENDERER, SCENE, CAMERA & POST-PROCESSING
    // =========================================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x1b331d, 0.017);

    const camera = new THREE.PerspectiveCamera(
      78,
      window.innerWidth / window.innerHeight,
      0.1,
      220
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.10;
    container.appendChild(renderer.domElement);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.42, // strength
      0.65, // radius
      0.86  // threshold so bright sky gaps bloom softly through foliage
    );
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxDistance = 35;
    controls.minDistance = 0.4;
    controls.maxPolarAngle = Math.PI;

    // Camera presets
    let autoOrbit = false;
    const PRESETS = {
      photo: {
        pos: new THREE.Vector3(0.0, 1.25, 0.0),
        target: new THREE.Vector3(0.45, 15.2, -9.2),
        fov: 78
      },
      walk: {
        pos: new THREE.Vector3(0.0, 1.65, 5.5),
        target: new THREE.Vector3(0.0, 2.4, -8.0),
        fov: 58
      },
      wide: {
        pos: new THREE.Vector3(-0.15, 0.8, 0.4),
        target: new THREE.Vector3(0.4, 16.5, -8.2),
        fov: 92
      }
    };

    function applyPreset(key) {
      autoOrbit = false;
      const p = PRESETS[key];
      camera.position.copy(p.pos);
      controls.target.copy(p.target);
      camera.fov = p.fov;
      camera.updateProjectionMatrix();
      controls.update();
    }
    applyPreset('photo');

    // =========================================================================
    // 2. SKY DOME SHADER & LIGHTING
    // =========================================================================
    const skyGeo = new THREE.SphereGeometry(140, 40, 28);
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      uniforms: {
        uSunDir: { value: new THREE.Vector3(-0.36, 0.90, -0.22).normalize() }
      },
      vertexShader: `
        varying vec3 vWorldPos;
        void main() {
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorldPos = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: `
        uniform vec3 uSunDir;
        varying vec3 vWorldPos;
        void main() {
          vec3 dir = normalize(vWorldPos);
          float h = clamp(dir.y, 0.0, 1.0);

          // Overcast-bright luminous zenith matching the photograph's airy sky gaps
          vec3 horizonCol = vec3(0.22, 0.36, 0.24);
          vec3 midSkyCol  = vec3(0.76, 0.89, 0.94);
          vec3 zenithCol  = vec3(1.25, 1.38, 1.42);

          vec3 col = mix(horizonCol, midSkyCol, smoothstep(0.0, 0.35, h));
          col = mix(col, zenithCol, smoothstep(0.28, 0.85, h));

          // Bright solar glow through upper-left clearing
          float sunDot = max(dot(dir, uSunDir), 0.0);
          col += vec3(1.1, 1.15, 1.0) * pow(sunDot, 5.0) * 0.65;
          col += vec3(1.4, 1.42, 1.32) * pow(sunDot, 24.0) * 0.8;

          gl_FragColor = vec4(col, 1.0);
        }
      `
    });
    scene.add(new THREE.Mesh(skyGeo, skyMat));

    // Main overhead sunlight
    const sunLight = new THREE.DirectionalLight(0xf6ffe8, 3.2);
    sunLight.position.set(-14, 42, -8);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.near = 5;
    sunLight.shadow.camera.far = 90;
    const d = 24;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    sunLight.shadow.bias = -0.0004;
    scene.add(sunLight);

    // Rich forest canopy ambient fill
    const hemiLight = new THREE.HemisphereLight(0xd9f2e6, 0x162b14, 1.45);
    scene.add(hemiLight);

    // Cool subtle rim light from opposite sky gap
    const rimLight = new THREE.DirectionalLight(0xbce8d8, 0.9);
    rimLight.position.set(12, 28, 10);
    scene.add(rimLight);

    // =========================================================================
    // 3. PROCEDURAL PBR TEXTURES (BAMBOO, LEAVES, BARK, FOREST FLOOR)
    // =========================================================================
    function createBambooTextures() {
      const w = 512, h = 1024;

      // Albedo
      const cCol = document.createElement('canvas');
      cCol.width = w; cCol.height = h;
      const ctx = cCol.getContext('2d');

      // Base muted sage/blue-green Moso bamboo gradient
      const bg = ctx.createLinearGradient(0, 0, w, 0);
      bg.addColorStop(0.0, '#4f6e59');
      bg.addColorStop(0.3, '#5d7c65');
      bg.addColorStop(0.65, '#4c6a55');
      bg.addColorStop(1.0, '#4f6e59');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      // Vertical organic internode shading (slight darkening toward upper node)
      const vg = ctx.createLinearGradient(0, 0, 0, h);
      vg.addColorStop(0.0, 'rgba(20, 32, 22, 0.25)');
      vg.addColorStop(0.12, 'rgba(220, 238, 222, 0.16)');
      vg.addColorStop(0.5, 'rgba(0, 0, 0, 0.0)');
      vg.addColorStop(0.92, 'rgba(30, 48, 32, 0.12)');
      vg.addColorStop(1.0, 'rgba(18, 28, 18, 0.30)');
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, w, h);

      // Fine fibrous vertical striations
      for (let i = 0; i < 1200; i++) {
        const x = rand() * w;
        const lw = randRange(0.5, 2.2);
        const light = rand() > 0.5;
        ctx.fillStyle = light
          ? `rgba(175, 205, 178, ${randRange(0.03, 0.09)})`
          : `rgba(22, 42, 28, ${randRange(0.04, 0.11)})`;
        ctx.fillRect(x, 0, lw, h);
      }

      // Subtle weathering flecks & pale waxy bloom patches
      for (let i = 0; i < 240; i++) {
        const x = rand() * w;
        const y = rand() * h;
        const rx = randRange(4, 24);
        const ry = randRange(10, 60);
        ctx.fillStyle = rand() > 0.45
          ? `rgba(185, 205, 188, ${randRange(0.03, 0.09)})`
          : `rgba(40, 56, 36, ${randRange(0.05, 0.13)})`;
        ctx.beginPath();
        ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Signature Moso bamboo node details at v=0 / v=1
      // Powdery pale whitish-sage ring right below the node
      const powderGrad = ctx.createLinearGradient(0, 0, 0, 68);
      powderGrad.addColorStop(0.0, 'rgba(205, 220, 208, 0.55)');
      powderGrad.addColorStop(0.45, 'rgba(195, 212, 198, 0.30)');
      powderGrad.addColorStop(1.0, 'rgba(185, 205, 188, 0.0)');
      ctx.fillStyle = powderGrad;
      ctx.fillRect(0, 0, w, 68);

      // Crisp dark brown-black sheath scar & nodal crease
      ctx.fillStyle = 'rgba(24, 28, 20, 0.85)';
      ctx.fillRect(0, 0, w, 10);
      ctx.fillRect(0, h - 12, w, 12);

      ctx.fillStyle = 'rgba(145, 162, 138, 0.45)';
      ctx.fillRect(0, 10, w, 6);
      ctx.fillRect(0, h - 20, w, 6);

      // Bump map
      const cBump = document.createElement('canvas');
      cBump.width = w; cBump.height = h;
      const bctx = cBump.getContext('2d');
      bctx.fillStyle = '#808080';
      bctx.fillRect(0, 0, w, h);
      for (let i = 0; i < 900; i++) {
        const x = rand() * w;
        bctx.fillStyle = rand() > 0.5 ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.08)';
        bctx.fillRect(x, 0, randRange(0.6, 2.0), h);
      }
      bctx.fillStyle = '#ffffff';
      bctx.fillRect(0, 10, w, 12);
      bctx.fillRect(0, h - 24, w, 12);
      bctx.fillStyle = '#181818';
      bctx.fillRect(0, 0, w, 9);
      bctx.fillRect(0, h - 10, w, 10);

      // Roughness map (waxy smooth internode, chalkier node ring)
      const cRough = document.createElement('canvas');
      cRough.width = w; cRough.height = h;
      const rctx = cRough.getContext('2d');
      rctx.fillStyle = '#6c6c6c'; // ~0.42 waxy sheen
      rctx.fillRect(0, 0, w, h);
      for (let i = 0; i < 300; i++) {
        rctx.fillStyle = `rgba(210, 210, 210, ${randRange(0.05, 0.16)})`;
        rctx.beginPath();
        rctx.ellipse(rand() * w, rand() * h, randRange(6, 30), randRange(12, 65), 0, 0, Math.PI * 2);
        rctx.fill();
      }
      rctx.fillStyle = '#d0d0d0'; // matte powdery ring
      rctx.fillRect(0, 0, w, 58);
      rctx.fillRect(0, h - 26, w, 26);

      const map = new THREE.CanvasTexture(cCol);
      map.colorSpace = THREE.SRGBColorSpace;
      const bumpMap = new THREE.CanvasTexture(cBump);
      const roughnessMap = new THREE.CanvasTexture(cRough);

      for (const t of [map, bumpMap, roughnessMap]) {
        t.wrapS = THREE.RepeatWrapping;
        t.wrapT = THREE.RepeatWrapping;
        t.anisotropy = 8;
      }
      return { map, bumpMap, roughnessMap };
    }

    function createBambooLeafTexture() {
      const size = 512;
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, size, size);

      // Slender branching twigs
      ctx.strokeStyle = '#385822';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(size * 0.5, size * 0.95);
      ctx.quadraticCurveTo(size * 0.48, size * 0.52, size * 0.52, size * 0.14);
      ctx.stroke();

      // Cluster of lanceolate bamboo leaves
      function drawLeaf(ox, oy, angle, length, width, shade) {
        ctx.save();
        ctx.translate(ox, oy);
        ctx.rotate(angle);

        const g = ctx.createLinearGradient(0, 0, length, 0);
        g.addColorStop(0.0, `hsl(${92 + shade}, 62%, ${26 + shade * 0.4}%)`);
        g.addColorStop(0.5, `hsl(${88 + shade}, 72%, ${38 + shade * 0.5}%)`);
        g.addColorStop(1.0, `hsl(${78 + shade}, 80%, ${48 + shade * 0.4}%)`);

        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(length * 0.28, -width, length, 0);
        ctx.quadraticCurveTo(length * 0.28, width, 0, 0);
        ctx.fill();

        // Central midrib
        ctx.strokeStyle = 'rgba(215, 245, 130, 0.35)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(2, 0);
        ctx.lineTo(length * 0.92, 0);
        ctx.stroke();

        ctx.restore();
      }

      const nodes = [
        [0.50, 0.82], [0.46, 0.68], [0.54, 0.62],
        [0.44, 0.48], [0.56, 0.44], [0.49, 0.32], [0.52, 0.20]
      ];
      for (const [nx, ny] of nodes) {
        const count = 4 + Math.floor(rand() * 3);
        for (let i = 0; i < count; i++) {
          const ang = -Math.PI * 0.95 + (i / (count - 1)) * Math.PI * 0.9 + randRange(-0.22, 0.22);
          drawLeaf(
            nx * size + randRange(-14, 14),
            ny * size + randRange(-14, 14),
            ang,
            randRange(95, 185),
            randRange(11, 20),
            randRange(-12, 14)
          );
        }
      }

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      return tex;
    }

    function createTreeLeafTexture() {
      const size = 512;
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, size, size);

      // Vibrant sunlit yellow-green maple/hardwood foliage for upper-left tree
      for (let i = 0; i < 65; i++) {
        const angle = rand() * Math.PI * 2;
        const dist = Math.pow(rand(), 0.7) * 185;
        const x = size * 0.5 + Math.cos(angle) * dist;
        const y = size * 0.5 + Math.sin(angle) * dist;
        const r = randRange(18, 42);

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rand() * Math.PI * 2);
        const hue = randRange(72, 102);
        const light = randRange(34, 56);
        ctx.fillStyle = `hsla(${hue}, 82%, ${light}%, 0.94)`;
        ctx.beginPath();
        ctx.ellipse(0, 0, r, r * 0.52, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createBarkTexture() {
      const w = 512, h = 512;
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#1e1b16';
      ctx.fillRect(0, 0, w, h);

      for (let i = 0; i < 700; i++) {
        const x = rand() * w;
        const y = rand() * h;
        ctx.fillStyle = rand() > 0.35
          ? `rgba(12, 10, 8, ${randRange(0.25, 0.75)})`
          : `rgba(68, 74, 48, ${randRange(0.15, 0.45)})`;
        ctx.fillRect(x, y, randRange(2, 9), randRange(20, 110));
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2, 6);
      return tex;
    }

    function createFloorTexture() {
      const s = 512;
      const c = document.createElement('canvas');
      c.width = s; c.height = s;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#24291b';
      ctx.fillRect(0, 0, s, s);

      // Damp soil + fallen golden-brown bamboo leaves
      for (let i = 0; i < 1800; i++) {
        ctx.save();
        ctx.translate(rand() * s, rand() * s);
        ctx.rotate(rand() * Math.PI * 2);
        const isMoss = rand() < 0.25;
        ctx.fillStyle = isMoss
          ? `rgba(48, 76, 32, ${randRange(0.2, 0.5)})`
          : `rgba(${Math.floor(randRange(80, 130))}, ${Math.floor(randRange(68, 102))}, ${Math.floor(randRange(38, 56))}, ${randRange(0.25, 0.6)})`;
        ctx.beginPath();
        ctx.ellipse(0, 0, randRange(6, 18), randRange(1.8, 4), 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(22, 22);
      return tex;
    }

    // =========================================================================
    // 4. PROCEDURAL 3D BAMBOO CULM GEOMETRY (WITH 3D NODAL RIDGES)
    // =========================================================================
    function createBambooCulmGeometry({
      height = 30,
      baseRadius = 0.085,
      topRadius = 0.022,
      nodeCount = 46,
      radialSegs = 14,
      bendX = 0.25,
      bendZ = -0.15
    }) {
      // 4 rings per internode so each node gets a crisp physical 3D ridge
      const ringsPerNode = 4;
      const totalRings = nodeCount * ringsPerNode;
      const vertCount = (totalRings + 1) * (radialSegs + 1);

      const positions = new Float32Array(vertCount * 3);
      const uvs = new Float32Array(vertCount * 2);
      const colors = new Float32Array(vertCount * 3);
      const indices = [];

      const localFracs = [0.0, 0.035, 0.5, 0.965];
      const ridgeScales = [1.075, 0.985, 1.0, 1.045];

      let vIdx = 0;
      for (let r = 0; r <= totalRings; r++) {
        const nodeIdx = Math.floor(r / ringsPerNode);
        const sub = r % ringsPerNode;
        const tNode = nodeIdx + (r === totalRings ? 0 : localFracs[sub]);
        // Slightly shorter internodes near the base, longer higher up (authentic botanical growth)
        const normT = tNode / nodeCount;
        const y = height * Math.pow(normT, 1.06);

        const radiusBase = THREE.MathUtils.lerp(baseRadius, topRadius, Math.pow(normT, 0.85));
        const rScale = r === totalRings ? 1.0 : ridgeScales[sub];
        const radius = radiusBase * rScale;

        // Subtle organic curve
        const curveFactor = normT * normT;
        const cx = bendX * curveFactor + Math.sin(normT * Math.PI * 1.5) * 0.06;
        const cz = bendZ * curveFactor + Math.cos(normT * Math.PI) * 0.04;

        // Vertex color gradient: darker earthy moss at bottom, slightly warmer sunlit upper culm
        const baseShade = THREE.MathUtils.smoothstep(y, 0.0, 3.8);
        const topBright = THREE.MathUtils.smoothstep(y, 12.0, height);
        const cr = THREE.MathUtils.lerp(0.45, 0.98, baseShade) + topBright * 0.14;
        const cg = THREE.MathUtils.lerp(0.52, 1.02, baseShade) + topBright * 0.16;
        const cb = THREE.MathUtils.lerp(0.42, 0.96, baseShade) + topBright * 0.06;

        for (let s = 0; s <= radialSegs; s++) {
          const u = s / radialSegs;
          const theta = u * Math.PI * 2;
          const px = cx + Math.cos(theta) * radius;
          const pz = cz + Math.sin(theta) * radius;

          positions[vIdx * 3 + 0] = px;
          positions[vIdx * 3 + 1] = y;
          positions[vIdx * 3 + 2] = pz;

          uvs[vIdx * 2 + 0] = u;
          uvs[vIdx * 2 + 1] = tNode; // Exact 1:1 UV sync with 3D nodal ridges

          colors[vIdx * 3 + 0] = cr;
          colors[vIdx * 3 + 1] = cg;
          colors[vIdx * 3 + 2] = cb;
          vIdx++;
        }
      }

      const stride = radialSegs + 1;
      for (let r = 0; r < totalRings; r++) {
        for (let s = 0; s < radialSegs; s++) {
          const a = r * stride + s;
          const b = a + 1;
          const c = (r + 1) * stride + s;
          const d = c + 1;
          indices.push(a, b, d, a, d, c);
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return geo;
    }

    // =========================================================================
    // 5. FOREST FLOOR
    // =========================================================================
    const floorGeo = new THREE.PlaneGeometry(110, 110, 48, 48);
    floorGeo.rotateX(-Math.PI / 2);
    const fPos = floorGeo.attributes.position;
    for (let i = 0; i < fPos.count; i++) {
      const x = fPos.getX(i);
      const z = fPos.getZ(i);
      const undulation = Math.sin(x * 0.12) * Math.cos(z * 0.12) * 0.35 + Math.sin(x * 0.3 + z * 0.25) * 0.12;
      fPos.setY(i, undulation - 0.15);
    }
    floorGeo.computeVertexNormals();

    const floorMat = new THREE.MeshStandardMaterial({
      map: createFloorTexture(),
      roughness: 0.94,
      metalness: 0.0
    });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.receiveShadow = true;
    scene.add(floor);

    // =========================================================================
    // 6. BAMBOO FOREST (HERO FOREGROUND STALKS + 460 INSTANCED GROVE STALKS)
    // =========================================================================
    const bambooTex = createBambooTextures();
    const bambooMat = new THREE.MeshStandardMaterial({
      map: bambooTex.map,
      bumpMap: bambooTex.bumpMap,
      bumpScale: 0.018,
      roughnessMap: bambooTex.roughnessMap,
      roughness: 0.85,
      metalness: 0.02,
      vertexColors: true
    });

    // Hero foreground stalks carefully placed to mirror the exact photo framing
    const heroSpecs = [
      // Prominent thick center-left hero stalk
      { x: -0.58, z: -2.05, r: 0.105, h: 33, leanX: 0.018, leanZ: 0.005, tint: 0xa6c4ad },
      // Companion thin stalk just behind center-left hero
      { x: -1.15, z: -2.55, r: 0.072, h: 31, leanX: 0.024, leanZ: -0.01, tint: 0x8fb096 },
      { x: -1.65, z: -2.95, r: 0.068, h: 30, leanX: 0.028, leanZ: -0.005, tint: 0x86a88d },

      // Prominent thick foreground pair on the right
      { x: 0.72,  z: -1.78, r: 0.118, h: 35, leanX: -0.015, leanZ: 0.012, tint: 0xa2ba9c },
      { x: 1.12,  z: -2.18, r: 0.112, h: 34, leanX: -0.020, leanZ: 0.008, tint: 0x8aa892 },
      { x: 0.56,  z: -2.70, r: 0.075, h: 32, leanX: -0.008, leanZ: 0.004, tint: 0x85a38d },

      // Mid-center slender background stalks framing the gap between heroes
      { x: 0.12,  z: -4.20, r: 0.058, h: 29, leanX: 0.004, leanZ: -0.005, tint: 0x7c9c82 },
      { x: -0.25, z: -5.10, r: 0.052, h: 28, leanX: 0.010, leanZ: 0.002, tint: 0x76947c },

      // Far-right thick angled bamboo stalks sweeping in from the right edge
      { x: 2.35,  z: -0.55, r: 0.108, h: 32, leanX: -0.065, leanZ: -0.035, tint: 0x88a490 },
      { x: 2.75,  z: -0.20, r: 0.095, h: 31, leanX: -0.078, leanZ: -0.042, tint: 0x7d9886 },
      { x: 2.95,  z: -1.95, r: 0.082, h: 30, leanX: -0.042, leanZ: -0.018, tint: 0x829c85 }
    ];

    const heroMeshes = [];
    const heroGroup = new THREE.Group();
    scene.add(heroGroup);

    heroSpecs.forEach((sp, idx) => {
      const geo = createBambooCulmGeometry({
        height: sp.h,
        baseRadius: sp.r,
        topRadius: sp.r * 0.24,
        nodeCount: Math.round(sp.h * 1.55),
        radialSegs: 18,
        bendX: randRange(-0.3, 0.3),
        bendZ: randRange(-0.2, 0.2)
      });
      const mat = bambooMat.clone();
      mat.color = new THREE.Color(sp.tint);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(sp.x, -0.3, sp.z);
      mesh.rotation.set(sp.leanZ, rand() * Math.PI * 2, -sp.leanX);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.userData = {
        baseRotX: mesh.rotation.x,
        baseRotZ: mesh.rotation.z,
        phase: idx * 0.85,
        amp: randRange(0.004, 0.009)
      };
      heroGroup.add(mesh);
      heroMeshes.push(mesh);
    });

    // Instanced grove of 460 surrounding bamboo stalks
    const groveCount = 460;
    const instBambooGeo = createBambooCulmGeometry({
      height: 30,
      baseRadius: 0.078,
      topRadius: 0.018,
      nodeCount: 40,
      radialSegs: 10,
      bendX: 0.22,
      bendZ: -0.14
    });

    const bambooInstanced = new THREE.InstancedMesh(instBambooGeo, bambooMat, groveCount);
    bambooInstanced.castShadow = true;
    bambooInstanced.receiveShadow = true;

    const dummy = new THREE.Object3D();
    const tmpColor = new THREE.Color();
    const stalkPositions = []; // Save positions to anchor canopy leaves

    let placed = 0;
    let attempts = 0;
    while (placed < groveCount && attempts < 4000) {
      attempts++;
      const angle = rand() * Math.PI * 2;
      const radius = 2.6 + Math.pow(rand(), 0.72) * 28.0;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius - 3.5;

      // Keep clear of immediate camera tripod
      if (Math.hypot(x, z) < 2.2) continue;

      // Preserve the bright upper-left sky opening (so gnarled tree & sky shine through)
      if (x < -1.2 && x > -9.5 && z > -2.5 && z < 6.5 && rand() < 0.85) continue;

      // Extra dense wall on the left-back and right-back like the photograph
      const thickness = randRange(0.55, 1.28);
      const heightScale = randRange(0.75, 1.22);

      dummy.position.set(x, -0.35, z);
      dummy.rotation.set(
        randRange(-0.045, 0.045),
        rand() * Math.PI * 2,
        randRange(-0.045, 0.045)
      );
      dummy.scale.set(thickness, heightScale, thickness);
      dummy.updateMatrix();
      bambooInstanced.setMatrixAt(placed, dummy.matrix);

      // Natural variation in sage/emerald/olive culm tones
      tmpColor.setHSL(
        randRange(0.32, 0.41),
        randRange(0.18, 0.34),
        randRange(0.46, 0.68)
      );
      bambooInstanced.setColorAt(placed, tmpColor);

      stalkPositions.push({ x, z, h: 30 * heightScale });
      placed++;
    }
    bambooInstanced.count = placed;
    bambooInstanced.instanceMatrix.needsUpdate = true;
    bambooInstanced.instanceColor.needsUpdate = true;
    scene.add(bambooInstanced);

    // =========================================================================
    // 7. BACKLIT BAMBOO CANOPY FOLIAGE (2,800 INSTANCED LEAF SPRIGS)
    // =========================================================================
    const leafTex = createBambooLeafTexture();
    const leafGeo = new THREE.PlaneGeometry(2.6, 2.6);

    const leafMat = new THREE.MeshStandardMaterial({
      map: leafTex,
      alphaTest: 0.32,
      side: THREE.DoubleSide,
      roughness: 0.58,
      metalness: 0.0,
      emissive: new THREE.Color(0x285a12),
      emissiveIntensity: 0.42 // Simulates translucent backlit chlorophyll glow
    });

    const leafCount = 2800;
    const leafInstanced = new THREE.InstancedMesh(leafGeo, leafMat, leafCount);
    let leafIdx = 0;

    for (let i = 0; i < leafCount; i++) {
      const stalk = stalkPositions[Math.floor(rand() * stalkPositions.length)];
      // Concentrate foliage high in the canopy (12m to 34m)
      const heightRatio = randRange(0.42, 1.03);
      const y = stalk.h * heightRatio;
      const spread = randRange(0.4, 3.2);
      const ang = rand() * Math.PI * 2;
      const lx = stalk.x + Math.cos(ang) * spread;
      const lz = stalk.z + Math.sin(ang) * spread;

      // Keep the bright sky gap in the upper-left-center partially open
      if (lx < -1.2 && lx > -8.2 && lz > -4.0 && lz < 4.5 && y > 13 && rand() < 0.72) {
        continue;
      }

      dummy.position.set(lx, y, lz);
      dummy.rotation.set(
        randRange(-1.1, 1.1),
        rand() * Math.PI * 2,
        randRange(-1.1, 1.1)
      );
      const sc = randRange(0.75, 1.85);
      dummy.scale.set(sc, sc, sc);
      dummy.updateMatrix();
      leafInstanced.setMatrixAt(leafIdx, dummy.matrix);

      // Higher leaves catch bright lime-yellow sunlight; lower canopy is deep emerald
      const sunFactor = THREE.MathUtils.clamp((y - 12) / 20, 0, 1);
      tmpColor.setHSL(
        THREE.MathUtils.lerp(0.32, 0.24, sunFactor) + randRange(-0.025, 0.025),
        randRange(0.68, 0.92),
        THREE.MathUtils.lerp(0.24, 0.56, sunFactor) + randRange(-0.06, 0.06)
      );
      leafInstanced.setColorAt(leafIdx, tmpColor);
      leafIdx++;
    }
    leafInstanced.count = leafIdx;
    leafInstanced.instanceMatrix.needsUpdate = true;
    leafInstanced.instanceColor.needsUpdate = true;
    scene.add(leafInstanced);

    // =========================================================================
    // 8. GNARLED OVERHANGING TREE IN UPPER-LEFT CORNER (PHOTO SIGNATURE)
    // =========================================================================
    const gnarledTreeGroup = new THREE.Group();
    scene.add(gnarledTreeGroup);

    const barkMat = new THREE.MeshStandardMaterial({
      map: createBarkTexture(),
      roughness: 0.92,
      metalness: 0.0,
      color: 0x3b352c
    });

    function createTaperedBranch(points, rStart, rEnd, tubularSegs = 28, radialSegs = 9) {
      const curve = new THREE.CatmullRomCurve3(points);
      const frames = curve.computeFrenetFrames(tubularSegs, false);
      const positions = [];
      const uvs = [];
      const indices = [];
      const p = new THREE.Vector3();
      const v = new THREE.Vector3();

      for (let i = 0; i <= tubularSegs; i++) {
        const t = i / tubularSegs;
        curve.getPointAt(t, p);
        const N = frames.normals[i];
        const B = frames.binormals[i];
        const radius = THREE.MathUtils.lerp(rStart, rEnd, Math.pow(t, 0.82)) *
                       (1.0 + Math.sin(t * 18.0) * 0.06);

        for (let j = 0; j <= radialSegs; j++) {
          const theta = (j / radialSegs) * Math.PI * 2;
          const sin = Math.sin(theta);
          const cos = -Math.cos(theta);
          v.x = p.x + radius * (cos * N.x + sin * B.x);
          v.y = p.y + radius * (cos * N.y + sin * B.y);
          v.z = p.z + radius * (cos * N.z + sin * B.z);
          positions.push(v.x, v.y, v.z);
          uvs.push(j / radialSegs, t * 4);
        }
      }

      const stride = radialSegs + 1;
      for (let i = 0; i < tubularSegs; i++) {
        for (let j = 0; j < radialSegs; j++) {
          const a = i * stride + j;
          const b = (i + 1) * stride + j;
          const c = (i + 1) * stride + (j + 1);
          const d = i * stride + (j + 1);
          indices.push(a, b, d, b, c, d);
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, barkMat);
      mesh.castShadow = true;
      return mesh;
    }

    // Main gnarled trunk & twisting overhead boughs extending into upper-left frame
    const mainBoughs = [
      // Trunk rising from off-camera left
      {
        pts: [
          new THREE.Vector3(-9.5, -0.5, 4.2),
          new THREE.Vector3(-8.4, 3.8, 3.6),
          new THREE.Vector3(-6.8, 7.6, 2.5),
          new THREE.Vector3(-4.5, 9.8, 0.8),
          new THREE.Vector3(-2.6, 11.4, -0.9)
        ],
        r0: 0.42, r1: 0.05
      },
      // Lower sweeping dark gnarled limb reaching toward center-left sky gap
      {
        pts: [
          new THREE.Vector3(-6.6, 7.5, 2.4),
          new THREE.Vector3(-5.2, 8.7, 0.3),
          new THREE.Vector3(-4.1, 9.6, -1.6),
          new THREE.Vector3(-2.8, 10.6, -3.1),
          new THREE.Vector3(-1.9, 11.3, -4.0)
        ],
        r0: 0.21, r1: 0.025
      },
      // Forking twig reaching upward
      {
        pts: [
          new THREE.Vector3(-4.8, 9.4, 1.0),
          new THREE.Vector3(-3.9, 11.2, 1.6),
          new THREE.Vector3(-2.4, 12.6, 1.2),
          new THREE.Vector3(-1.2, 13.5, 0.2)
        ],
        r0: 0.14, r1: 0.02
      },
      // Secondary dark curling twigs
      {
        pts: [
          new THREE.Vector3(-4.3, 9.5, -1.2),
          new THREE.Vector3(-5.4, 10.4, -2.6),
          new THREE.Vector3(-4.9, 11.6, -4.1)
        ],
        r0: 0.09, r1: 0.015
      },
      {
        pts: [
          new THREE.Vector3(-7.4, 6.2, 2.9),
          new THREE.Vector3(-6.8, 7.4, -0.5),
          new THREE.Vector3(-6.2, 8.8, -3.2)
        ],
        r0: 0.16, r1: 0.025
      }
    ];

    mainBoughs.forEach(b => {
      gnarledTreeGroup.add(createTaperedBranch(b.pts, b.r0, b.r1));
    });

    // Glowing sunlit lime-green foliage around the gnarled upper-left tree
    const treeLeafMat = new THREE.MeshStandardMaterial({
      map: createTreeLeafTexture(),
      alphaTest: 0.35,
      side: THREE.DoubleSide,
      roughness: 0.52,
      emissive: new THREE.Color(0x4a8f14),
      emissiveIntensity: 0.62
    });
    const treeLeafGeo = new THREE.PlaneGeometry(2.8, 2.8);
    const treeLeafCount = 190;
    const treeLeaves = new THREE.InstancedMesh(treeLeafGeo, treeLeafMat, treeLeafCount);

    for (let i = 0; i < treeLeafCount; i++) {
      const bough = mainBoughs[Math.floor(rand() * mainBoughs.length)];
      const pt = bough.pts[Math.min(bough.pts.length - 1, 1 + Math.floor(rand() * (bough.pts.length - 1)))];
      dummy.position.set(
        pt.x + randRange(-2.6, 2.1),
        pt.y + randRange(-0.8, 2.4),
        pt.z + randRange(-2.4, 2.2)
      );
      dummy.rotation.set(rand() * Math.PI, rand() * Math.PI, rand() * Math.PI);
      const sc = randRange(0.65, 1.45);
      dummy.scale.set(sc, sc, sc);
      dummy.updateMatrix();
      treeLeaves.setMatrixAt(i, dummy.matrix);

      tmpColor.setHSL(randRange(0.21, 0.28), randRange(0.78, 0.98), randRange(0.42, 0.64));
      treeLeaves.setColorAt(i, tmpColor);
    }
    treeLeaves.instanceMatrix.needsUpdate = true;
    treeLeaves.instanceColor.needsUpdate = true;
    gnarledTreeGroup.add(treeLeaves);

    // =========================================================================
    // 9. VOLUMETRIC GOD RAYS & DRIFTING FOREST POLLEN MOTES
    // =========================================================================
    const rayGeo = new THREE.ConeGeometry(7.5, 36, 24, 1, true);
    const rayMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      uniforms: {
        uTime: { value: 0 }
      },
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vNormalView;
        varying vec3 vViewDir;
        void main() {
          vUv = uv;
          vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
          vNormalView = normalize(normalMatrix * normal);
          vViewDir = normalize(-mvPos.xyz);
          gl_Position = projectionMatrix * mvPos;
        }
      `,
      fragmentShader: `
        uniform float uTime;
        varying vec2 vUv;
        varying vec3 vNormalView;
        varying vec3 vViewDir;
        void main() {
          float fresnel = pow(abs(dot(vNormalView, vViewDir)), 2.2);
          float vFade = smoothstep(0.0, 0.35, vUv.y) * smoothstep(1.0, 0.15, vUv.y);
          float shimmer = 0.85 + 0.15 * sin(vUv.x * 18.0 + uTime * 0.45);
          float alpha = fresnel * vFade * shimmer * 0.055;
          vec3 col = vec3(0.75, 0.96, 0.68);
          gl_FragColor = vec4(col, alpha);
        }
      `
    });

    const rayConfigs = [
      { pos: [-3.5, 16, -2.0], rot: [0.18, 0.0, -0.26], scale: [0.9, 1.0, 0.9] },
      { pos: [-1.2, 17, -5.5], rot: [0.14, 0.3, -0.22], scale: [1.1, 1.1, 1.1] },
      { pos: [2.2, 18, -7.2],  rot: [0.12, -0.2, -0.24], scale: [0.85, 1.0, 0.85] }
    ];
    rayConfigs.forEach(rc => {
      const m = new THREE.Mesh(rayGeo, rayMat);
      m.position.set(...rc.pos);
      m.rotation.set(...rc.rot);
      m.scale.set(...rc.scale);
      scene.add(m);
    });

    // Subtle sunlit floating forest pollen/dust particles
    const moteCount = 320;
    const motePositions = new Float32Array(moteCount * 3);
    const moteSpeeds = new Float32Array(moteCount);
    for (let i = 0; i < moteCount; i++) {
      motePositions[i * 3 + 0] = randRange(-14, 14);
      motePositions[i * 3 + 1] = randRange(1, 24);
      motePositions[i * 3 + 2] = randRange(-16, 8);
      moteSpeeds[i] = randRange(0.25, 0.85);
    }
    const moteGeo = new THREE.BufferGeometry();
    moteGeo.setAttribute('position', new THREE.BufferAttribute(motePositions, 3));
    const moteMat = new THREE.PointsMaterial({
      color: 0xe6ffd6,
      size: 0.09,
      transparent: true,
      opacity: 0.48,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const motes = new THREE.Points(moteGeo, moteMat);
    scene.add(motes);

    // =========================================================================
    // 10. UI CONTROLS & INTERACTION
    // =========================================================================
    let windStrength = 1.0;

    const btnPhoto = document.getElementById('cam-photo');
    const btnWalk  = document.getElementById('cam-walk');
    const btnOrbit = document.getElementById('cam-orbit');
    const btnWide  = document.getElementById('cam-wide');
    const allBtns  = [btnPhoto, btnWalk, btnOrbit, btnWide];

    function setActiveBtn(active) {
      allBtns.forEach(b => b.classList.remove('active'));
      active.classList.add('active');
    }

    btnPhoto.addEventListener('click', () => { setActiveBtn(btnPhoto); applyPreset('photo'); });
    btnWalk.addEventListener('click',  () => { setActiveBtn(btnWalk);  applyPreset('walk'); });
    btnWide.addEventListener('click',  () => { setActiveBtn(btnWide);  applyPreset('wide'); });
    btnOrbit.addEventListener('click', () => {
      setActiveBtn(btnOrbit);
      applyPreset('photo');
      autoOrbit = true;
    });

    const ctrlWind = document.getElementById('ctrl-wind');
    const ctrlExp  = document.getElementById('ctrl-exp');
    const ctrlBloom = document.getElementById('ctrl-bloom');

    ctrlWind.addEventListener('input', e => {
      windStrength = parseFloat(e.target.value);
      document.getElementById('val-wind').textContent = `${windStrength.toFixed(1)}x`;
    });
    ctrlExp.addEventListener('input', e => {
      const v = parseFloat(e.target.value);
      renderer.toneMappingExposure = v;
      document.getElementById('val-exp').textContent = v.toFixed(2);
    });
    ctrlBloom.addEventListener('input', e => {
      const v = parseFloat(e.target.value);
      bloomPass.strength = v;
      document.getElementById('val-bloom').textContent = v.toFixed(2);
    });

    const hud = document.getElementById('hud');
    const toggleBtn = document.getElementById('toggle-ui');
    toggleBtn.addEventListener('click', () => {
      hud.classList.toggle('hidden');
      toggleBtn.textContent = hud.classList.contains('hidden') ? 'Show UI' : 'Hide UI';
    });

    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);
    });

    // =========================================================================
    // 11. ANIMATION LOOP (NATURAL WIND SWAY & ATMOSPHERE)
    // =========================================================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      rayMat.uniforms.uTime.value = t;

      // Gentle forest breeze on hero bamboo stalks
      for (const m of heroMeshes) {
        const { baseRotX, baseRotZ, phase, amp } = m.userData;
        const gust = (Math.sin(t * 0.85 + phase) + 0.45 * Math.sin(t * 1.9 + phase * 1.3)) * amp * windStrength;
        m.rotation.z = baseRotZ + gust;
        m.rotation.x = baseRotX + gust * 0.6;
      }

      // Subtle sway on canopy & gnarled overhanging tree
      leafInstanced.rotation.z = Math.sin(t * 0.72) * 0.008 * windStrength;
      leafInstanced.rotation.x = Math.cos(t * 0.55) * 0.006 * windStrength;
      gnarledTreeGroup.rotation.z = Math.sin(t * 0.65 + 1.1) * 0.004 * windStrength;

      // Drift floating pollen motes gently upward and sideways
      const mArr = moteGeo.attributes.position.array;
      for (let i = 0; i < moteCount; i++) {
        const sp = moteSpeeds[i];
        mArr[i * 3 + 0] += Math.sin(t * 0.4 + i) * 0.004 * (0.4 + windStrength);
        mArr[i * 3 + 1] += 0.003 * sp;
        if (mArr[i * 3 + 1] > 25) mArr[i * 3 + 1] = 1.0;
      }
      moteGeo.attributes.position.needsUpdate = true;

      // Optional cinematic drift
      if (autoOrbit) {
        const angle = t * 0.14;
        camera.position.x = Math.sin(angle) * 2.2;
        camera.position.z = Math.cos(angle) * 2.2 - 1.5;
        camera.position.y = 1.4 + Math.sin(t * 0.3) * 0.25;
        controls.target.set(0.3, 15.5, -7.5);
      }

      controls.update();
      composer.render();
    }

    animate();
  </script>
</body>
</html>
