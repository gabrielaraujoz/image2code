<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image2Code Photorealistic 3D</title>
<style>
@font-face { font-family: "Geist"; font-weight: 400; src: url(fonts/geist-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Geist"; font-weight: 500; src: url(fonts/geist-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url(fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url(fonts/jetbrains-mono-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "Funnel Display"; font-weight: 500; src: url(fonts/funnel-display-latin-500-normal.woff2) format("woff2"); }

:root {
  --bg: #141414; --side: #1B1B1B; --ink: #E8E8E8; --ink-2: #A3A3A3; --line: #2A2A2A;
  --accent: #3FD0E8; --accent-bg: #2B2B2B; --hover: #232323; --code: #1E1E1E; --side-w: 220px;
  --display: "Funnel Display", system-ui, sans-serif;
  --body: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --h1: 40px; --h2: 30px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.6 var(--body); }
h1, h2 { font-family: var(--display); font-weight: 500; letter-spacing: -0.02em; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.label { font: 400 11px/1.4 var(--mono); text-transform: uppercase; letter-spacing: 0.14em; color: var(--ink-2); }

/* menu */
.side { position: fixed; inset: 0 auto 0 0; width: var(--side-w); background: var(--side); border-right: 1px solid var(--line);
  padding: 16px 10px; z-index: 10; display: flex; flex-direction: column; }
.side .label { padding: 4px 10px 10px; }
.side a { display: flex; align-items: center; gap: 12px; padding: 7px 10px; margin-bottom: 2px; border-radius: 8px;
  text-decoration: none; color: #E8E8E8; font: 400 15px/1.3 var(--body); }
.side a svg { flex: none; color: #CFCFCF; }
.side a:hover { background: var(--hover); }
.side a[aria-current="page"] { background: var(--accent-bg); color: #fff; }
.side a[aria-current="page"] svg { color: #fff; }
.side .dl { margin-top: auto; justify-content: center; border: 1px solid var(--line); font-weight: 500; }

.main { margin-left: var(--side-w); min-height: 100vh; }
.doc { max-width: 1240px; padding: 40px 48px 96px; }
.doc h1 { font-size: var(--h1); line-height: 1.05; margin: 0 0 28px; }
.doc h2 { font-size: var(--h2); line-height: 1.1; margin: 48px 0 16px; padding-top: 20px; border-top: 1px solid var(--line); }

/* model vs redesign */
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.pane .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.pane .head a { font: 400 11px/1.4 var(--mono); text-transform: uppercase; letter-spacing: 0.14em; text-decoration: none; }
.frame { position: relative; aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; background: #04070A; border: 1px solid var(--line); }
.frame iframe, .frame img { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover; display: block; }
.frame .empty { position: absolute; inset: 0; display: grid; place-items: center; }

/* reference vs render slider */
.compare { position: relative; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); user-select: none; touch-action: none; cursor: ew-resize; }
.compare img { display: block; width: 100%; height: auto; pointer-events: none; }
.compare .top { position: absolute; inset: 0; clip-path: inset(0 0 0 var(--pos, 50%)); }
.compare .bar { position: absolute; top: 0; bottom: 0; left: var(--pos, 50%); width: 2px; margin-left: -1px; background: #fff; }
.compare .knob { position: absolute; top: 50%; left: var(--pos, 50%); width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%;
  background: rgba(20,20,20,.75); border: 2px solid #fff; display: grid; place-items: center; color: #fff; }
.compare .tag { position: absolute; top: 12px; padding: 4px 8px; border-radius: 4px; background: rgba(14,18,21,.78); color: #E8E8E8; }
.compare .tag.l { left: 12px; } .compare .tag.r { right: 12px; }

/* trajectory accordion */
details.acc { margin-top: 40px; border-top: 1px solid var(--line); }
details.acc > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; padding: 20px 0 16px; }
details.acc > summary::-webkit-details-marker { display: none; }
details.acc > summary h2 { margin: 0; padding: 0; border: 0; }
.sumr { display: flex; align-items: center; gap: 16px; }
details.acc > summary svg { flex: none; transition: transform .2s; color: var(--ink-2); }
details.acc[open] > summary svg { transform: rotate(180deg); }
.turns { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.turn { border-bottom: 1px solid var(--line); }
.turn > button { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 3em 1fr auto auto; gap: 12px; width: 100%; padding: 12px 4px; cursor: pointer; }
.turn > button:hover { background: var(--hover); }
.turn .n, .turn .t { font: 400 11px/2.2 var(--mono); letter-spacing: 0.14em; color: var(--ink-2); text-transform: uppercase; white-space: nowrap; }
.turn .p { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 4.95em; overflow: hidden; }
.turn.open .p { max-height: none; }
.turn .body { display: none; padding: 0 4px 16px calc(3em + 16px); }
.turn.open .body { display: block; }
.turn .reply { white-space: pre-wrap; font-size: 15px; background: var(--code); border-left: 3px solid var(--accent); padding: 10px 12px; border-radius: 0 4px 4px 0; }
.turn .calls { margin: 10px 0 0; padding-left: 1.2em; font: 12px/1.5 var(--mono); color: var(--ink-2); }


/* tables */
.tbl { width: 100%; border-collapse: collapse; font-size: 15px; }
.tbl th { text-align: left; font: 400 11px/1.4 var(--mono); text-transform: uppercase; letter-spacing: 0.14em; color: var(--ink-2); padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--side); }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl td.num, .tbl td.mono { font: 400 13px/1.6 var(--mono); color: var(--ink-2); white-space: nowrap; }
.tbl td.v { text-align: center; width: 92px; }
.tbl td.cm { min-width: 280px; font-size: 14px; }
.tbl td.cm .label { display: block; margin-top: 6px; }
.tbl td.cm .label:first-child { margin-top: 0; }
.tbl td.src a { text-decoration: none; font-size: 14px; }
.tbl td.mono:last-child { min-width: 0; }
.tbl tr.gate td { background: rgba(63,140,232,.08); }
.tbl tr.real td { background: rgba(232,190,63,.07); }
.tbl .ok { color: #4ADE80; font-weight: 600; } .tbl .no { color: #F87171; font-weight: 600; } .tbl .na { color: #555; }
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
.legend { display: flex; gap: 16px; margin: 0 0 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.review { margin-top: 10px; font-size: 15px; white-space: pre-wrap; background: var(--code); border-left: 3px solid #E8BE3F; padding: 10px 12px; border-radius: 0 4px 4px 0; }
.who { display: block; margin-bottom: 4px; }
.tag-rev { font: 400 11px/2.2 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: #E8BE3F; white-space: nowrap; }


.sub { font: 400 11px/1.4 var(--mono); text-transform: uppercase; letter-spacing: 0.14em; color: var(--ink-2); margin: -8px 0 12px; }
.round { list-style: none; border-bottom: 1px solid var(--line); padding: 14px 4px; display: grid; grid-template-columns: 3em 1fr; gap: 12px; background: #181818; }
.round .n { font: 400 11px/2.2 var(--mono); letter-spacing: 0.14em; color: #E8BE3F; }
.round .head { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; margin-bottom: 8px; }
.round .head b { font-weight: 500; }
.round .review { margin-top: 0; }
.note { white-space: pre-wrap; font-size: 15px; background: var(--code); border-left: 3px solid var(--accent); padding: 12px 14px; border-radius: 0 4px 4px 0; margin: 0 0 16px; }
.more { all: unset; cursor: pointer; display: block; text-align: center; padding: 12px; color: var(--accent); font: 400 11px/1.4 var(--mono); text-transform: uppercase; letter-spacing: 0.14em; border-bottom: 1px solid var(--line); }
.more:hover { background: var(--hover); }


.frame .loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #04070A; transition: opacity .4s ease; pointer-events: none; }
.frame .loading.done { opacity: 0; }
.frame .spin { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #2A2A2A; border-top-color: var(--accent); animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .frame .spin { animation-duration: 2.4s; } }


.doc p.lead { font-size: 18px; line-height: 1.65; color: var(--ink); max-width: 760px; margin: 0 0 8px; }
.doc .steps { list-style: none; counter-reset: step; margin: 0; padding: 0; max-width: 760px; }
.doc .steps > li { counter-increment: step; position: relative; padding: 0 0 22px 48px; }
.doc .steps > li::before { content: counter(step, decimal-leading-zero); position: absolute; left: 0; top: 2px; font: 400 12px/1.6 var(--mono); letter-spacing: 0.14em; color: var(--accent); }
.doc .steps h3 { font-family: var(--display); font-weight: 500; letter-spacing: -0.02em; font-size: 22px; line-height: 1.2; margin: 0 0 6px; }
.doc .steps p { margin: 0; color: var(--ink-2); }
.doc .results { max-width: 760px; }
.doc .results p { color: var(--ink-2); margin: 0 0 14px; }
.tbl td a.row { color: var(--ink); text-decoration: none; }
.tbl td a.row:hover { color: var(--accent); }


.refs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 760px; margin: 24px 0 8px; }
.refs a { text-decoration: none; display: block; }
.refs img { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
.refs a:hover img { border-color: var(--accent); }
.refs .label { display: block; margin-top: 8px; }
@media (max-width: 479px) { .refs { grid-template-columns: 1fr 1fr; } }

@media (max-width: 991px) { :root { --h1: 36px; --h2: 28px; } .pair { grid-template-columns: 1fr; } }
@media (max-width: 760px) {
  .side { position: sticky; top: 0; inset: auto; width: auto; flex-direction: row; gap: 4px; padding: 8px 10px; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .side .label { display: none; }
  .side a { white-space: nowrap; margin-bottom: 0; gap: 8px; }
  .side #menu { display: flex; gap: 4px; }
  .side .dl { margin-top: 0; margin-left: 8px; flex: none; }
  .side .dl span { display: none; }
  .main { margin-left: 0; }
  .doc { padding: 24px 16px 64px; }
}
@media (max-width: 479px) { :root { --h1: 28px; --h2: 23px; } .turn > button { grid-template-columns: 2.2em 1fr; } .turn .t { grid-column: 2; } .turn .body { padding-left: 4px; } }
</style>

 any input", "d": "Prompt Adherence", "m": true, "mc": "Clouds, tree sway and water ripples start on load with no input.", "r": true, "rc": "Water ripples and slow cloud morphing start as soon as the scene appears."}, {"n": "3", "c": "The default view matches the photo's camera angle and framing (horizon height, lake in the lower part, peaks across the top)", "d": "Composition", "m": true, "mc": "Broadly matches, eye level, lake in the lower half, peaks across the top. The left cliff and the peaks are smaller than in the photo, and the lake takes more of the frame.", "r": true, "rc": "Camera solved by fitting the real DEM skyline to the photo skyline. Same horizon height, lake in the lower part, peaks across the top."}, {"n": "4", "c": "The lake water is glacial turquoise, as in the photo", "d": "Reference Fidelity", "m": false, "mc": "The water is a pale greyish blue, about  #6B8E91, not the deep saturated glacial teal of the photo.", "r": true, "rc": "Saturated glacial cyan teal measured from the photo."}, {"n": "5", "c": "A row of jagged peaks spans the background, matching the photo's skyline", "d": "Reference Fidelity", "m": true, "mc": "The skyline follows the photo’s peak profile, though the peaks read softer and less jagged.", "r": true, "rc": "The skyline comes from the real terrain of the Ten Peaks and matches the photo peak by peak."}, {"n": "6", "c": "Snow or ice shows on the peaks where it appears in the photo", "d": "Reference Fidelity", "m": true, "mc": "Snow sits on the couloir and the summits where the photo has it, though it is drawn as horizontal dashes.", "r": true, "rc": "Snow on the summit caps, ledges, couloir and base fields, where the photo has it."}, {"n": "7", "c": "Conifer forest lines the shore where it does in the photo", "d": "Reference Fidelity", "m": true, "mc": "Conifers line the right shore and the far center, as in the photo.", "r": true, "rc": "Dense conifer forest on the right shore and the far center, as in the photo."}, {"n": "8", "c": "Time of day and light match the photo (sunrise light on the peaks)", "d": "Reference Fidelity", "m": true, "mc": "Sunrise sky with orange caps on the two end peaks, matching the time of day.", "r": true, "rc": "Sunrise light, the two end tips glow orange, the rest of the range is warm and the sky is pink and orange."}, {"n": "9", "c": "Mountains read as rock faces with ridges and gullies, not smooth cones", "d": "Scene Fidelity", "m": false, "mc": "Mountains are flat vertical ribbons painted with horizontal stripes. No ridges, gullies or depth.", "r": true, "rc": "Real relief with buttresses, ledges, couloirs and gullies."}, {"n": "10", "c": "Trees read as individual conifers of varied heights", "d": "Scene Fidelity", "m": false, "mc": "Every tree is the same low-poly cone with the same color and little height change. The forest reads as a uniform carpet.", "r": true, "rc": "Individual spruces of varied height built from scanned fir branches."}, {"n": "11", "c": "The shoreline has rocks or debris where water meets land (no knife-edge line)", "d": "Scene Fidelity", "m": false, "mc": "The shoreline is a knife edge where the flat terrain meets the water, with no rocks or debris. There is also a dark triangular notch at the center of the shore.", "r": true, "rc": "A thin band of wet stones runs along the right shore, and the talus meets the water with a soft edge."}, {"n": "12", "c": "When orbited, there are no floating objects, holes or visible scene edges", "d": "Scene Fidelity", "m": false, "mc": "Orbiting shows the cut edges of the terrain strips and the empty sky under the lake and the cliff.", "r": true, "rc": "Within the orbit limits there are no holes, floating parts or scene edges. Checked at both ends."}, {"n": "13", "c": "Peaks catch warm, low-angle sun while the valley and forest sit in cooler shade", "d": "Lighting", "m": false, "mc": "Color is painted, not lit. Only the two orange caps read as sun. There is no shading from a sun direction and no cooler shade in the valley.", "r": true, "rc": "Warm low sun on the peaks while the left wall, the valley and the forest sit in cool shade."}, {"n": "14", "c": "Distant peaks are hazier and bluer than near ones (atmospheric perspective)", "d": "Lighting", "m": false, "mc": "Distant peaks are as sharp and as saturated as the near cliff. No atmospheric haze.", "r": true, "rc": "Distance haze makes the far peaks lighter and softer than the near left wall."}, {"n": "15", "c": "No area of the default view is fully black or blown out to white", "d": "Lighting", "m": true, "mc": "No pure black or blown white areas.", "r": true, "rc": "The forest is very dark but keeps detail, and the snow is not clipped."}, {"n": "16", "c": "Trees and rocks are grounded by contact shadows", "d": "Lighting", "m": false, "mc": "No shadows anywhere. Trees and scree sit on flat color with no contact shadow.", "r": true, "rc": "Baked occlusion grounds the rocks and talus, and trees sit on a darkened forest floor."}, {"n": "17", "c": "The water reflects the mountains and sky", "d": "Materials", "m": false, "mc": "At the default view the lake shows no visible reflection of the mountains or the sky. It reads as a flat gradient.", "r": true, "rc": "Planar reflection of the peaks, the forest and the pink clouds, with fresnel."}, {"n": "18", "c": "The water shows depth: lighter and clearer near the shore, deeper colour further out", "d": "Materials", "m": false, "mc": "The water is a smooth flat gradient, with no lighter, clearer water near the shore.", "r": true, "rc": "Lighter, clearer cyan near the shore and deeper teal toward the camera."}, {"n": "19", "c": "Rock surfaces show texture detail at the default view", "d": "Materials", "m": false, "mc": "Rock is regular sine stripes and noise blobs, with no real rock texture at the default view.", "r": true, "rc": "Scanned rock with strata and fractures is visible at the default view."}, {"n": "20", "c": "Snow reads as snow (bright and soft, not grey  tiled textures."}, {"n": "27", "c": "No identical tree copies sit next to each other", "d": "Realism", "m": false, "mc": "All trees share one mesh with only rotation and scale changes. Identical copies sit next to each other.", "r": true, "rc": "Impostors mix several scanned card variants with flips, scale and tone changes. No twin trees next to each other."}, {"n": "28", "c": "The camera looks real: natural field of view, no fisheye, post effects kept subtle", "d": "Realism", "m": true, "mc": "36° FOV, no fisheye, no post effects.", "r": true, "rc": "Field of view solved from the photo with no fisheye. Bloom, chromatic aberration, vignette and grain are kept light."}, {"n": "29", "c": "A paused frame of the default view could pass for the reference photo at first glance", "d": "Realism", "m": false, "mc": "A paused frame reads as a flat illustration, not as the photo.", "r": true, "rc": "At first glance the sky, the reflection and the peaks read as the photo. The lower left cliff still looks a bit CG on a closer look."}], "round_count": 3, "rounds": [], "turns": [], "note": ""}, {"id": "bamboo", "name": "Bamboo Grove", "model": "samples/bamboo/model.html", "redesign": "samples/bamboo/redesign/index.html", "ref": "img/bamboo_ref.jpg", "thumb": "img/bamboo_ref_thumb.jpg", "render": "img/bamboo_render.jpg", "render_final": true, "render_label": "3D render", "files": [{"name": "index.html", "size": "881 B", "bytes": 881, "type": "HTML"}, {"name": "assets/app.js", "size": "519 KB", "bytes": 531931, "type": "JavaScript"}, {"name": "assets/d_insetA.js", "size": "9.1 MB", "bytes": 9549527, "type": "JPEG image (embedded)"}, {"name": "assets/d_insetB.js", "size": "11.6 MB", "bytes": 12129087, "type": "JPEG image (embedded)"}, {"name": "assets/d_insetO.js", "size": "4.2 MB", "bytes": 4409163, "type": "PNG image (embedded)"}, {"name": "assets/d_near.js", "size": "9.2 MB", "bytes": 9597969, "type": "Gzip data (embedded)"}, {"name": "assets/d_panoA.js", "size": "11.6 MB", "byte  low upward angle and framing as the photo, with the tree in the top left corner."}, {"n": "4", "c": "Bamboo density matches the photo (similar spacing between stalks)", "d": "Reference Fidelity", "m": true, "mc": "Stalk spacing and density are close to the photo.", "r": true, "rc": "Culm spacing and density match the photo."}, {"n": "5", "c": "The colour palette matches the photo (yellow-green to deep green)", "d": "Reference Fidelity", "m": false, "mc": "Palette is near black with neon green. The photo’s yellow green canopy and pale gray green stalks are missing.", "r": true, "rc": "Yellow green canopy and dark green culms, within the photo range."}, {"n": "6", "c": "Ground elements in the photo (path, brushwood fence) are present", "d": "Reference Fidelity", "m": false, "mc": "No path and no brushwood fence. The ground is a flat disc.", "r": true, "rc": "Dragging down shows the dirt path and the brushwood fence of dry bamboo."}, {"n": "7", "c": "The light matches the photo (sun or overcast, light direction)", "d": "Reference Fidelity", "m": false, "mc": "The photo has bright diffuse overcast light. The scene is underexposed and stalks read as dark silhouettes.", "r": true, "rc": "Soft bright overcast light from above, like the photo."}, {"n": "8", "c": "Stalks show nodes (rings) at regular intervals", "d": "Scene Fidelity", "m": true, "mc": "Node rings are visible at regular intervals on the near stalks.", "r": true, "rc": "Node rings at regular intervals on every culm."}, {"n": "9", "c": "Stalk thickness and height vary", "d": "Scene Fidelity", "m": true, "mc": "Stalk thickness and height vary.", "r": true, "rc": "Culm thickness and height vary."}, {"n": "10", "c": "Stalks lean at slightly varied angles, not a perfect vertical grid", "d": "Scene Fidelity", "m": true, "mc": "Stalks lean at slightly varied angles, not a perfect grid.", "r": true, "rc": "Culms lean at slightly different angles, not a perfect grid."}, {"n": "11", "c": "The canopy is made of thin, narrow leaves in clusters", "d": "Scene Fidelity", "m": false, "mc": "Canopy uses star shaped, maple like leaf sprites in saturated green, not narrow bamboo leaves.", "r": true, "rc": "The canopy is built from small fans of thin, narrow bamboo leaves along the branches."}, {"n": "12", "c": "The ground is covered with soil and fallen leaves, not a flat plane", "d": "Scene Fidelity", "m": false, "mc": "Ground is a flat circle with a tinted bark texture. No soil or fallen leaves.", "r": true, "rc": "The ground is uneven soil covered with dry bamboo leaves and small pebbles."}, {"n": "13", "c": "When orbited, the grove continues in every direction with no visible edge", "d": "Scene Fidelity", "m": false, "mc": "The floor is a 45 m disc with fog. The edge of the grove shows when orbiting out.", "r": true, "rc": "The grove continues in every direction the orbit allows, with no visible edge."}, {"n": "14", "c": "Sunlight filtering through the canopy makes dappled patches on stalks and ground", "d": "Lighting", "m": false, "mc": "No dappled sunlight patches on stalks or ground.", "r": true, "rc": "Soft warm sun patches filtered by the canopy fall on the thin culms and the ground."}, {"n": "15", "c": "Soft light shafts or haze give depth between the stalks", "d": "Lighting", "m": false, "mc": "Fog is too dark to read as depth, and there are no soft light shafts between stalks.", "r": true, "rc": "Distance haze between the culms gives depth."}, {"n": "16", "c": "Backlit leaves glow, with light passing through them", "d": "Lighting", "m": true, "mc": "Upper canopy leaves glow with backlight.", "r": true, "rc": "Leaves at the sky openings glow with backlight."}, {"n": "17", "c": "Shadows between stalks are dark but never fully black", "d": "Lighting", "m": false, "mc": "Large areas between stalks crush to pure black.", "r": true, "rc": "Shadows between culms are dark green, never pure black."}, {"n": "18", "c": "Stalks show a waxy sheen and natural colour variation (yellowing, st const menu = document.getElementById('menu');
const page = document.getElementById('page');
menu.innerHTML = SAMPLES.map(s => `<a href="#${s.id}" data-id="${s.id}">${ICON_BOX}<span>${s.name}</span></a>`).join('');

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = s => s ? new Date(s).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'UTC' }) + ' UTC' : '';
const host = u => u.replace(/^https?:\/\//, '').replace(/\/$/, '');
const na = '<span class="na">–</span>';

function pane(label, src) {
  const body = src ? `<iframe data-src="${esc(src)}" title="${esc(label)}" allow="fullscreen"></iframe><div class="loading" aria-live="polite"><span class="spin" aria-hidden="true"></span><span class="label">Loading</span></div>` : `<div class="empty"><span class="label">HTML pending</span></div>`;
  const open = src ? `<a href="${esc(src)}" target="_blank" rel="noopener">Full screen ↗</a>` : '';
  return `<div class="pane"><div class="head"><span class="label">${esc(label)}</span>${open}</div><div class="frame">${body}</div></div>`;
}

function filesTable(list) {
  if (!list.length) return `<div class="scroll"><table class="tbl"><thead><tr><th>Asset</th><th>Size</th><th>Type</th></tr></thead><tbody><tr><td colspan="3" class="label">Final scene pending</td></tr></tbody></table></div>`;
  const total = list.reduce((a, f) => a + f.bytes, 0);
  const rows = list.map(f => `<tr><td class="mono" style="color:var(--ink)">${esc(f.name)}</td><td class="mono">${esc(f.size)}</td><td>${esc(f.type)}</td></tr>`).join('');
  return `<p class="sub">${list.length} files · ${(total / 1048576).toFixed(1)} MB</p><div class="scroll"><table class="tbl"><thead><tr><th>Asset</th><th>Size</th><th>Type</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function sourcesTable(list) {
  const rows = list.map(a => `<tr><td>${esc(a.name)}</td><td class="src">${a.source ? `<a href="${esc(a.source)}" target="_blank" rel="noopener">${esc(host(a.source))}</a>` : na}</td><td>${esc(a.licence)}</td></tr>`).join('');
  return `<div class="scroll"><table class="tbl"><thead><tr><th>Source asset</th><th>Source</th><th>Licence</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

const mark = v => v === true ? '<span class="ok" aria-label="Pass">✓</span>' : v === false ? '<span class="no" aria-label="Fail">✕</span>' : '<span class="na" aria-label="Not scored">–</span>';

function rubricTable(rows) {
  const body = rows.map(r => `<tr class="${r.n.startsWith('G') ? 'gate' : r.d === 'Realism' ? 'real' : ''}"><td class="num">${esc(r.n)}</td><td>${esc(r.c)}</td><td class="mono">${esc(r.d)}</td><td class="v">${mark(r.m)}</td><td class="v">${mark(r.r)}</td><td class="cm">${r.mc ? `<span class="label">Model</span>${esc(r.mc)}` : ''}${r.rc ? `<span class="label">Redesign</span>${esc(r.rc)}` : ''}</td></tr>`).join('');
  return `<div class="legend label"><span><i style="background:rgba(63,140,232,.45)"></i>Gate</span><span><i style="background:rgba(232,190,63,.45)"></i>Realism check</span></div>
    <div class="scroll"><table class="tbl"><thead><tr><th>#</th><th>Criterion</th><th>Dimension</th><th>Model</th><th>Redesign</th><th>Comments</th></tr></thead><tbody>${body}</tbody></table></div>`;
}

const score = (rows, k) => `${rows.filter(r => r[k] === true).length} / ${rows.length}`;

function turnItem(t, i) {
  return `<li class="turn"><button aria-expanded="false"><span class="n">${i}</span><span class="p">${esc(t.prompt)}</span><span></span><span class="t">${esc(fmt(t.t))}</span></button><div class="body">${t.reply ? `<div class="reply">${esc(t.reply)}</div>` : ''}${t.calls.length ? `<ul class="calls">${t.calls.map(c => `<li>${esc(c)}</li>`).join('')}</ul>` : ''}</div></li>`;
}

function roundItem(r, i) {
  return `<li class="round"><span class="n">R${i}</span><div><div class="head"><b>Round ${i} submitted</b><span class="label">${esc(fmt(r.submitted))}</span><span class="tag-rev">${esc(r.rate.replace(/_/g, ' '))}</span></div>${r.review ? `<div class="review"><span class="who label">Reviewer${r.reviewed ? ' · ' + esc(fmt(r.reviewed)) : ''}</span>${esc(r.review)}</div>` : ''}</div></li>`;
}

// Turns and review rounds in time order: each round's review lands before the turns that answer it.
function timeline(s) {
  const items = [];
  s.rounds.forEach((r, i) => items.push({ at: r.submitted, html: roundItem(r, i + 1) }));
  s.turns.forEach((t, i) => items.push({ at: t.t, html: turnItem(t, i + 1) }));
  items.sort((a, b) => new Date(a.at) - new Date(b.at));
  const LIMIT = 40;
  const head = items.slice(0, LIMIT).map(x => x.html).join('');
  const rest = items.slice(LIMIT).map(x => x.html).join('');
  const note = s.note ? `<div class="note"><span class="who label" style="display:block;margin-bottom:6px">Trajectory note from the designer</span>${esc(s.note)}</div>` : '';
  return `${note}<ol class="turns">${head}</ol>${rest ? `<button class="more" data-more>Show ${items.length - LIMIT} more</button><ol class="turns" hidden>${rest}</ol>` : ''}`;
}


// Design time per sample, estimated from the trajectories and the platform timer (review time not included).
const TIME = { moraine: '~15–20 h', bamboo: '~15 h', lighthouse: '~15.5 h' };

function renderOverview() {
  const rows = SAMPLES.map(s => `<tr><td><a class="row" href="#${s.id}">${esc(s.name)}</a></td><td class="mono">${score(s.rubric, 'm')}</td><td class="mono">${score(s.rubric, 'r')}</td><td class="mono">${s.round_count}</td><td class="mono">${TIME[s.id] || '–'}</td></tr>`).join('');
  page.innerHTML = `
    <h1>Overview</h1>
    <p class="lead">These are Image2Code samples created by senior designers. Each one recreates a real photo as a photorealistic 3D scene that runs in the browser.</p>
    <div class="refs">${SAMPLES.map(s => `<a href="#${s.id}"><img src="${esc(s.thumb)}" alt="Reference photo: ${esc(s.name)}" loading="lazy"><span class="label">${esc(s.name)}</span></a>`).join('')}</div>
    <h2>How they were made</h2>
    <ol class="steps">
      <li><h3>Start from a photo</h3><p>Each sample started with a reference photo and the model's answer to it, from Gemini 4 Argon.</p></li>
      <li><h3>Rate the model answer</h3><p>The designer scored the model's answer against the rubric.</p></li>
      <li><h3>Build the scene in Blender</h3><p>Working with their LLM, the designer first got the scene right in Blender, in three stages: modelling, texturing and adding motion effects such as water, wind and snow.</p></li>
      <li><h3>Transpose it to HTML</h3><p>Once the Blender scene was right, it was transposed to HTML so it runs in the browser.</p></li>
      <li><h3>Review</h3><p>At every submission, another senior designer reviewed the work and sent feedback. If it wasn't there yet, the task went back for another round.</p></li>
    </ol>
    <h2>Results</h2>
    <div class="results">
      <p>Each sample went through 3 review rounds before approval. The redesigns passed every rubric criterion, against 13 to 18 for Gemini. Each sample took about 15 hours of design time, estimated from the trajectories and the platform's timer.</p>
      <div class="scroll"><table class="tbl"><thead><tr><th>Sample</th><th>Model</th><th>Redesign</th><th>Review rounds</th><th>Design time (est.)</th></tr></thead><tbody>${rows}</tbody></table></div>
    </div>`;
  window.scrollTo(0, 0);
}

function render() {
  const id = location.hash.slice(1);
  const s = SAMPLES.find(x => x.id === id);
  document.querySelectorAll('.side a[data-id]').forEach(a => { if (a.dataset.id === (s ? s.id : 'overview')) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (!s) return renderOverview();
  page.innerHTML = `
    <h1>${esc(s.name)}</h1>
    <section class="pair">${pane('Model · Gemini 4 Argon', s.model)}${pane('Redesign', s.redesign)}</section>
    <h2>Reference vs render</h2>
    <div class="compare" id="cmp" style="--pos:50%">
      <img src="${esc(s.ref)}" alt="Reference photo">
      <div class="top"><img src="${esc(s.render)}" alt="3D render"></div>
      <div class="bar"></div><div class="knob">${ARROWS}</div>
      <span class="tag l label">Photo</span><span class="tag r label">${esc(s.render_label)}</span>
    </div>
    <h2>Assets</h2>
    ${filesTable(s.files)}
    <h3 class="label" style="margin:28px 0 12px">Sources and licences</h3>
    ${sourcesTable(s.sources)}
    <details class="acc"><summary><h2>Rubrics</h2><span class="sumr"><span class="label">Model ${score(s.rubric, 'm')} · Redesign ${score(s.rubric, 'r')}</span>${CHEVRON}</span></summary>${rubricTable(s.rubric)}</details>
    `;
  // Set src only after the listener is in place, and ignore the about:blank load that comes before it.
  page.querySelectorAll('.frame iframe[data-src]').forEach(f => {
    let started = false;
    f.addEventListener('load', () => {
      if (!started) return;
      let href = '';
      try { href = f.contentWindow.location.href; } catch (e) { href = 'cross-origin'; }
      if (href === 'about:blank') return;   // the empty document before the scene
      f.nextElementSibling?.classList.add('done');
    });
    requestAnimationFrame(() => { started = true; f.src = f.dataset.src; });
  });
  wireCompare(document.getElementById('cmp'));
  page.querySelectorAll('.turn > button').forEach(b => b.addEventListener('click', () => {
    const open = b.parentElement.classList.toggle('open'); b.setAttribute('aria-expanded', String(open));
  }));
  const more = page.querySelector('[data-more]');
  if (more) more.addEventListener('click', () => { more.nextElementSibling.hidden = false; more.remove(); });
  window.scrollTo(0, 0);
}

function wireCompare(el) {
  const set = x => { const r = el.getBoundingClientRect(); el.style.setProperty('--pos', Math.min(100, Math.max(0, (x - r.left) / r.width * 100)) + '%'); };
  let drag = false;
  el.addEventListener('pointerdown', e => { drag = true; el.setPointerCapture(e.pointerId); set(e.clientX); });
  el.addEventListener('pointermove', e => { if (drag) set(e.clientX); });
  el.addEventListener('pointerup', () => { drag = false; });
  el.tabIndex = 0;
  el.addEventListener('keydown', e => {
    const cur = parseFloat(el.style.getPropertyValue('--pos')) || 50;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); el.style.setProperty('--pos', Math.min(100, Math.max(0, cur + (e.key === 'ArrowRight' ? 5 : -5))) + '%'); }
  });
}

window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
