<style>
/* Image2Code additions on top of the shared docs.css */
.side { display: flex; flex-direction: column; }
.side .dl { margin-top: auto; justify-content: center; border: 1px solid var(--line); }
@media (max-width: 760px) { .side { flex-direction: row; } .side .dl { margin-top: 0; margin-left: 8px; flex: none; } .side .dl span { display: none; } }

.refs-label { margin: 24px 0 8px; }
.refs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.refs a { text-decoration: none; display: block; color: var(--ink); }
.refs img { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
.refs a:hover img { border-color: #4A4A4A; }
.refs .label { display: block; margin-top: 6px; }
@media (max-width: 479px) { .refs { grid-template-columns: 1fr 1fr; } }

.doc p.note { color: var(--ink-2); margin: 0 0 4px; max-width: 68ch; }
table.rubric td.n { white-space: nowrap; font: 400 12px/1.6 var(--mono); color: var(--ink-2); width: 1%; }
table.rubric td.mono { font: 400 12.5px/1.6 var(--mono); color: var(--ink-2); white-space: nowrap; }
table.rubric td.src a { text-decoration: none; }
table.rubric td.grow { width: auto; }
table.plain td:first-child { width: auto; }
table.rubric tr.gate td { background: rgba(63, 140, 232, .06); }
table.rubric tr.real td { background: rgba(232, 190, 63, .05); }
.legend { display: flex; gap: 16px; margin: 12px 0 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.sub-h { margin: 22px 0 0; }

/* reference vs render slider */
.slider { position: relative; margin-top: 12px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); user-select: none; touch-action: none; cursor: ew-resize; }
.slider img { display: block; width: 100%; height: auto; pointer-events: none; }
.slider .top { position: absolute; inset: 0; clip-path: inset(0 0 0 var(--pos, 50%)); }
.slider .bar { position: absolute; top: 0; bottom: 0; left: var(--pos, 50%); width: 2px; margin-left: -1px; background: #fff; }
.slider .knob { position: absolute; top: 50%; left: var(--pos, 50%); width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; background: rgba(20, 20, 20, .75); border: 1.5px solid #fff; display: grid; place-items: center; color: #fff; }
.slider .tag { position: absolute; top: 10px; padding: 3px 7px; border-radius: 4px; background: rgba(14, 18, 21, .78); color: var(--ink); }
.slider .tag.l { left: 10px; } .slider .tag.r { right: 10px; }

/* the prompt sent with the reference photo */
.prompt { display: flex; gap: 14px; align-items: center; margin: 16px 0 20px; padding: 12px 14px; background: var(--side); border: 1px solid var(--line); border-radius: 8px; }
.prompt img { width: 52px; height: 52px; object-fit: cover; border-radius: 6px; flex: none; }
.prompt p { margin: 4px 0 0; font-size: 15px; color: var(--ink); }

/* loading state on the scene frames */
.frame .loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: #04070A; transition: opacity .4s ease; pointer-events: none; }
.frame .loading.done { opacity: 0; }
.frame .spin { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #2A2A2A; border-top-color: var(--ink-2); animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .frame .spin { animation-duration: 2.4s; } }
</style>

us.png", "size": "5.3 MB", "bytes": 5557121, "type": "PNG image"}, {"name": "cycles blender/03_arvore.png", "size": "5.4 MB", "bytes": 5644412, "type": "PNG image"}, {"name": "cycles blender/04_colmos_direita.png", "size": "4.9 MB", "bytes": 5102596, "type": "PNG image"}, {"name": "cycles blender/05_leque_esquerda.png", "size": "5.2 MB", "bytes": 5403485, "type": "PNG image"}, {"name": "cycles blender/06_zenite.png", "size": "5.8 MB", "bytes": 6073344, "type": "PNG image"}, {"name": "cycles blender/07_trilha_ate_o_fim.png", "size": "4.4 MB", "bytes": 4589244, "type": "PNG image"}, {"name": "cycles blender/08_cerca_e_chao.png", "size": "4.9 MB", "bytes": 5154705, "type": "PNG image"}, {"name": "cycles blender/bosque_bambu_redo.blend", "size": "224.0 MB", "bytes": 234923265, "type": "Blender file"}], "sources": [{"name": "overcast_soil_puresky, 4K HDRI", "source": "https://polyhaven.com/a/overcast_soil_puresky", "licence": "CC0"}, {"name": "leaves_forest_ground, 2K", "source": "https://polyhaven.com/a/leaves_forest_ground", "licence": "CC0"}, {"name": "mud_forest, 2K", "source": "https://polyhaven.com/a/mud_forest", "licence": "CC0"}, {"name": "park_dirt, 2K", "source": "https://polyhaven.com/a/park_dirt", "licence": "CC0"}, {"name": "stony_dirt_path, 2K", "source": "https://polyhaven.com/a/stony_dirt_path", "licence": "CC0"}, {"name": "japanese_zelkova_bark, 2K", "source": "https://polyhaven.com/a/japanese_zelkova_bark", "licence": "CC0"}, {"name": "Bamboo Stick (uevicfnfa), 2K", "source": "https://fab.com", "licence": "Fab Standard License, commercial use allowed"}, {"name": "three.js r170", "source": "https://threejs.org", "licence": "MIT"}], "rubric": [{"n": "G1", "c": "The HTML opens in Chrome and the scene renders, with no errors or blank screen", "d": "Builds", "m": true, "mc": "Opens and renders with no errors. Needs internet for three.js from jsDelivr.", "r": true, "rc": "Opens in Chrome by double click and renders the grove with no errors."}, {"n": "G2", "c": "Dragging orbits the camera around the scene; the camera can't go below the ground or outside the scene", "d": "Orbit", "m": false, "mc": "maxPolarAngle is 180°, so the camera can go below the ground, and it can rise above the canopy.", "r": true, "rc": "Drag orbits the camera inside fixed limits. It never goes below the ground or out of the grove."}, {"n": "G3", "c": "The scene runs at 30 fps or more on a standard laptop", "d": "Builds", "m": true, "mc": "460 instanced stalks, 2,800 leaf cards, soft shadows and bloom. Likely above 30 fps on a laptop, not measured on one.", "r": true, "rc": "Holds about 56 fps over 60 seconds in Chrome."}, {"n": "1", "c": "There is no UI, text or interaction other than orbiting", "d": "Prompt Adherence", "m": false, "mc": "A panel with four camera buttons, three sliders and a title, plus a Hide UI button, sit over the scene.", "r": true, "rc": "No UI, text or buttons. Orbit is the only input."}, {"n": "2", "c": "At least one environmental motion runs on load, without any input", "d": "Prompt Adherence", "m": true, "mc": "Stalk sway, canopy sway and floating motes run from load with no input.", "r": true, "rc": "Culms sway, the canopy rustles and leaves fall from the first frame, with no input."}, {"n": "3", "c": "The default view matches the photo's camera angle and framing", "d": "Composition", "m": true, "mc": "Low upward angle with the overhanging branch top left and the sky opening, as in the photo.", "r": true, "rc": "Same low upward angle and framing as the photo, with the tree in the top left corner."}, {"n": "4", "c": "Bamboo density matches the photo (similar spacing between stalks)", "d": "Reference Fidelity", "m": true, "mc": "Stalk spacing and density are close to the photo.", "r": true, "rc": "Culm spacing and density match the photo."}, {"n": "5", "c": "The colour palette matches the photo (yellow-green to deep green)", "d": "Reference Fidelity", "m": false, "mc": "A thick white haze turns the palette pale grey green. The photo's saturated yellow green and deep green are missing.", "r": true, "rc": "Yellow green canopy and dark green culms, within the photo range."}, {"n": "6", "c": "Ground elements in the photo (path, brushwood fence) are present", "d": "Reference Fidelity", "m": false, "mc": "No path and no brushwood fence.", "r": true, "rc": "Dragging down shows the dirt path and the brushwood fence of dry bamboo."}, {"n": "7", "c": "The light matches the photo (sun or overcast, light direction)", "d": "Reference Fidelity", "m": true, "mc": "Bright diffuse light from above, as in the photo, though the haze washes it out.", "r": true, "rc": "Soft bright overcast light from above, like the photo."}, {"n": "8", "c": "Stalks show nodes (rings) at regular intervals", "d": "Scene Fidelity", "m": true, "mc": "Node rings are modelled as raised ridges at regular intervals.", "r": true, "rc": "Node rings at regular intervals on every culm."}, {"n": "9", "c": "Stalk thickness and height vary", "d": "Scene Fidelity", "m": true, "mc": "Stalk thickness and height vary.", "r": true, "rc": "Culm thickness and height vary."}, {"n": "10", "c": "Stalks lean at slightly varied angles, not a perfect vertical grid", "d": "Scene Fidelity", "m": true, "mc": "Stalks lean at slightly varied angles.", "r": true, "rc": "Culms lean at slightly different angles, not a perfect grid."}, {"n": "11", "c": "The canopy is made of thin, narrow leaves in clusters", "d": "Scene Fidelity", "m": true, "mc": "The canopy is made of narrow lance shaped leaves in clusters.", "r": true, "rc": "The canopy is built from small fans of thin, narrow bamboo leaves along the branches."}, {"n": "12", "c": "The ground is covered with soil and fallen leaves, not a flat plane", "d": "Scene Fidelity", "m": true, "mc": "The ground is an uneven surface with a soil and fallen leaf texture.", "r": true, "rc": "The ground is uneven soil covered with dry bamboo leaves and small pebbles."}, {"n": "13", "c": "When orbited, the grove continues in every direction with no visible edge", "d": "Scene Fidelity", "m": true, "mc": "The grove and fog continue in every direction within the orbit range.", "r": true, "rc": "The grove continues in every direction the orbit allows, with no visible edge."}, {"n": "14", "c": "Sunlight filtering through the canopy makes dappled patches on stalks and ground", "d": "Lighting", "m": false, "mc": "Leaves cast no shadows, so there is no dappled light on the stalks or the ground.", "r": true, "rc": "Soft warm sun patches filtered by the canopy fall on the thin culms and the ground."}, {"n": "15", "c": "Soft light shafts or haze give depth between the stalks", "d": "Lighting", "m": true, "mc": "Fog and soft light cones give depth between the stalks.", "r": true, "rc": "Distance haze between the culms gives depth."}, {"n": "16", "c": "Backlit leaves glow, with light passing through them", "d": "Lighting", "m": true, "mc": "Upper leaves glow with a light emissive tint.", "r": true, "rc": "Leaves at the sky openings glow with backlight."}, {"n": "17", "c": "Shadows between stalks are dark but never fully black", "d": "Lighting", "m": true, "mc": "No area between the stalks is fully black.", "r": true, "rc": "Shadows between culms are dark green, never pure black."}, {"n": "18", "c": "Stalks show a waxy sheen and natural colour variation (yellowing, stains)", "d": "Materials", "m": true, "mc": "The culm texture has a waxy sheen, pale bloom and flecks, and stalk colours vary.", "r": true, "rc": "Soft waxy sheen with natural stains, yellowing and lichen near the base."}, {"n": "19", "c": "Leaves are translucent", "d": "Materials", "m": true, "mc": "Leaves read as lit through, using an emissive tint rather than real translucency.", "r": true, "rc": "Leaves read as translucent against the sky."}, {"n": "20", "c": "Ground materials read as real soil, leaves or stone", "d": "Materials", "m": true, "mc": "The ground reads as damp soil with fallen leaves.", "r": true, "rc": "Ground is soil, leaf litter and pebbles."}, {"n": "21", "c": "Verticals are straight and level (no unintended tilt)", "d": "Composition", "m": true, "mc": "No unwanted roll. Verticals converge as in the upward photo.", "r": true, "rc": "No unwanted roll. Convergence matches the upward view of the photo."}, {"n": "22", "c": "The canopy sways in the wind", "d": "Motion", "m": true, "mc": "The canopy sways, though as one rigid block.", "r": true, "rc": "The canopy sways in the wind."}, {"n": "23", "c": "Stalks bend more at the top than at the base", "d": "Motion", "m": false, "mc": "Stalks rotate rigidly from the base. They don't bend more at the top.", "r": true, "rc": "Sway grows with height, so culms bend more at the top."}, {"n": "24", "c": "Wind comes in varied gusts, not one uniform loop", "d": "Motion", "m": false, "mc": "Wind is a sum of two steady sine waves, with no gusts.", "r": true, "rc": "Wind comes in slow irregular gusts, not a steady motion."}, {"n": "25", "c": "Falling leaves or dust particles drift through the light", "d": "Motion", "m": true, "mc": "Dust motes drift up through the light.", "r": true, "rc": "Falling leaves and dust drift through the light."}, {"n": "26", "c": "Motion runs at real-world speed and loops without visible jumps", "d": "Motion", "m": true, "mc": "Motion runs on a continuous clock. Motes wrap back to the ground at the top of the canopy, mostly hidden by the haze.", "r": true, "rc": "Real speed motion on a continuous clock, with no visible jumps."}, {"n": "27", "c": "No visibly cloned stalks (same curve or stain repeated nearby)", "d": "Realism", "m": false, "mc": "All 460 grove stalks share one mesh with the same curve, so identical stalks stand side by side.", "r": true, "rc": "Every culm is modeled with its own curve and stains, no visible clones."}, {"n": "28", "c": "No pop-in or flicker when orbiting", "d": "Realism", "m": true, "mc": "No popping seen in the orbit captures. Not checked on a real GPU.", "r": true, "rc": "Orbit sweep to every limit shows no popping or flicker."}, {"n": "29", "c": "Leaves don't clip through stalks", "d": "Realism", "m": false, "mc": "Leaf cards up to about 4.8 m wide sit at random angles between stalks spaced 1 to 2 m apart, and the canopy rotates while the stalks stay still, so leaves cut through stalks.", "r": true, "rc": "Leaves do not clip through the culms."}, {"n": "30", "c": "A paused frame of the default view could pass for the reference photo at first glance", "d": "Realism", "m": false, "mc": "Too hazy and too pale to pass for the photo at a glance.", "r": true, "rc": "Seen on its own, the paused default view reads as a photograph same framing, real culm texture and nodes, soft overcast light and natural depth. The canopy is slightly darker than in the reference."}], "round_count": 3, "rounds": [], "turns": [], "note": ""}, {"id": "lighthouse", "name": "Snowy Lighthouse", "model": "samples/lighthouse/model.html", "redesign": "samples/lighthouse/redesign/index.html", "ref": "img/lighthouse_ref.jpg", "thumb": "img/lighthouse_ref_thumb.jpg", "render": "img/lighthouse_render.jpg", "render_final": true, "render_label": "3D render", "files": [{"name": "index.html", "size": "2 KB", "bytes": 1586, "type": "HTML"}, {"name": "assets/app.js", "size": "635 KB", "bytes": 650381, "type": "JavaScript"}, {"name": "assets/data_boulders_bake_jpg.js", "size": "1.0 MB", "bytes": 1096445, "type": "JPEG image (embedded)"}, {"name": "assets/data_camdepth_p1_png.js", "size": "435 KB", "bytes": 445711, "type": "PNG image (embedded)"}, {"name": "assets/data_camdepth_p2_png.js", "size": "449 KB", "bytes": 459815, "type": "PNG image (embedded)"}, {"name": "assets/data_camdepth_p3_png.js", "size": "571 KB", "bytes": 584491, "type": "PNG image (embedded)"}, {"name": "assets/data_camdepth_png.js", "size": "503 KB", "bytes": 515388, "type": "PNG image (embedded)"}, {"name": "assets/data_camproj_jpg.js", "size": "2.0 MB", "bytes": 2046099, "type": "JPEG image (embedded)"}, {"name": ", "licence": "CC0"}, {"name": "Namaqualand Boulder 05", "source": "https://polyhaven.com/a/namaqualand_boulder_05", "licence": "CC0"}, {"name": "Namaqualand Boulder 06", "source": "https://polyhaven.com/a/namaqualand_boulder_06", "licence": "CC0"}, {"name": "Rock 08", "source": "https://polyhaven.com/a/rock_08", "licence": "CC0"}, {"name": "Marble Rock 01", "source": "https://polyhaven.com/a/marble_rock_01", "licence": "CC0"}, {"name": "Rock Granite With Lichen (Quixel Megascans tcupeg3s)", "source": "", "licence": "Fab Standard License"}, {"name": "Granite 002 A", "source": "https://ambientcg.com/view?id=Granite002A", "licence": "CC0"}, {"name": "Rock 043 L", "source": "https://ambientcg.com/view?id=Rock043L", "licence": "CC0"}, {"name": "Snow 011", "source": "https://ambientcg.com/view?id=Snow011", "licence": "CC0"}, {"name": "Snow 014", "source": "https://ambientcg.com/view?id=Snow014", "licence": "CC0"}, {"name": "Concrete 034", "source": "https://ambientcg.com/view?id=Concrete034", "licence": "CC0"}, {"name": "Painted Plaster Wall", "source": "https://polyhaven.com/a/painted_plaster_wall", "licence": "CC0"}, {"name": "Grass Medium 01", "source": "https://polyhaven.com/a/grass_medium_01", "licence": "CC0"}, {"name": "Aerial Grass Rock", "source": "https://polyhaven.com/a/aerial_grass_rock", "licence": "CC0"}, {"name": "Aerial Rocks 02", "source": "https://polyhaven.com/a/aerial_rocks_02", "licence": "CC0"}, {"name": "Syferfontein 18d Clear Pure Sky (HDRI)", "source": "https://polyhaven.com/a/syferfontein_18d_clear_puresky", "licence": "CC0"}, {"name": "Water normals texture", "source": "https://github.com/mrdoob/three.js/blob/dev/examples/textures/waternormals.jpg", "licence": "MIT (credit: three.js authors)"}, {"name": "three.js r170", "source": "https://github.com/mrdoob/three.js", "licence": "MIT"}, {"name": "meshoptimizer decoder", "source": "https://github.com/zeux/meshoptimizer", "licence": "MIT"}], "rubric": [{"n": "G1", "c": "The HTML opens in Chrome and the scene renders, with no errors or blank screen", "d": "Builds", "m": false, "mc": "The ocean fragment shader does not compile because it reads p.z from a vec2. The console shows shader errors and the ocean never draws, so the space beyond the rocks is empty sky.", "r": true, "rc": "Opens straight from index.html in Chrome with no server. All assets are local in the assets folder, and there are no console errors and no blank screen."}, {"n": "G2", "c": "Dragging orbits the camera around the scene; the camera can't go below the ground or outside the scene", "d": "Orbit", "m": false, "mc": "The polar limit keeps the camera above the ground, but the max distance lets it pull back past the terrain edge. From there the headland reads as a flat slab floating in empty sky.", "r": true, "rc": "Orbit is limited in distance and angle. The camera stays above the terrain, so it can’t go under the rock or leave the scene."}, {"n": "G3", "c": "The scene runs at 30 fps or more on a standard laptop", "d": "Builds", "m": true, "mc": "The load is moderate, one shadow map, one terrain mesh, procedural sky and simple primitives. A standard laptop should hold 30 fps.", "r": true, "rc": "Lighting and shadows are baked into lightmaps, so the page draws flat textured meshes plus light sea, spray and snow shaders. The screen recording ran at 30 fps on an RTX 5060 while capturing."}, {"n": "1", "c": "There is no UI, text or interaction other than orbiting", "d": "Prompt Adherence", "m": true, "mc": "No UI, no text and no buttons. Orbit is the only interaction.", "r": true, "rc": "No UI, no text and no buttons. Orbit is the only interaction."}, {"n": "2", "c": "At least one environmental motion runs on load, without any input", "d": "Prompt Adherence", "m": true, "mc": "Clouds drift, the grass sways, snow drifts and the lens turns as soon as the page loads.", "r": true, "rc": "The sea, shore foam, wave spray, drifting snow and wind in the grass all start on load with no input."}, {"n": "3", "c": "The default view matches the photo's camera angle and framing", "d": "Composition", "m": false, "mc": "The horizon sits higher than in the photo and the tower is smaller in frame. The rock outcrops that fill the photo’s foreground are replaced by a snow slope.", "r": true, "rc": "The camera is locked to the photo: 24 mm lens, eye height of about 1.45 m, the same corner on view of the tower and the same horizon height."}, {"n": "4", "c": "The lighthouse matches the photo's shape and colours (tower, lantern, trim)", "d": "Reference Fidelity", "m": true, "mc": "White octagonal tapered tower, red lantern and cap, white gallery rail. The colours and silhouette read as the photo, though the model adds a small gabled porch that the photo doesn’t have.", "r": true, "rc": "White octagonal tower with a red lantern and red cap, white gallery, door, black plaque and small windows, as in the photo."}, {"n": "5", "c": "The lighthouse sits on a rocky shore with snow on the rocks, as in the photo", "d": "Reference Fidelity", "m": false, "mc": "The shore reads as a smooth snow field. The boulders render dark red and magenta because their vertex colour data gets multiplied into the rock colour, so it doesn’t read as a snowy granite shore.", "r": true, "rc": "The tower stands on rounded granite outcrops with snow lying in patches and in the hollows, plus scattered boulders and snowy stone steps."}, {"n": "6", "c": "The ocean is visible beyond the rocks, as in the photo", "d": "Reference Fidelity", "m": false, "mc": "The ocean shader fails to compile, so no sea is visible beyond the rocks.", "r": true, "rc": "Deep blue ocean all along the horizon behind the rocks, with the far shoreline on the right, as in the photo."}, {"n": "7", "c": "The clear blue winter sky and light match the photo", "d": "Reference Fidelity", "m": true, "mc": "Clear blue gradient sky with a pale horizon and low sun from the left, as in the photo.", "r": true, "rc": "Clear blue sky that gets paler toward the horizon, with low bright winter sun from the left."}, {"n": "8", "c": "The tower's shape and proportions match the photo", "d": "Scene Fidelity", "m": true, "mc": "Slender tapered octagonal shaft with the lantern on top, close to the photo’s proportions.", "r": true, "rc": "Tapered octagonal tower with the same height to width ratio and the lantern on top, matched against the photo."}, {"n": "9", "c": "The lantern room has windows and a railing gallery", "d": "Scene Fidelity", "m": true, "mc": "The lantern has glazed panes with red mullions and a white railing gallery around it.", "r": true, "rc": "The lantern has glazed panels with mullions and a gallery with a railing around it."}, {"n": "10", "c": "Rocks show natural shapes with cracks and fissures, not smooth blobs", "d": "Scene Fidelity", "m": false, "mc": "The boulders are noise-displaced spheres with a faceted low-poly look and no real cracks. The crack lines on the terrain are only painted on.", "r": true, "rc": "Rounded granite lobes with crevices, plus scanned Poly Haven rock that adds cracks, pits and grain."}, {"n": "11", "c": "The lighthouse base sits flush on the rock (no floating or sinking)", "d": "Scene Fidelity", "m": false, "mc": "The right whaleback bump is added after the plinth pad is flattened, so the ground rises up to about 0.4 m around the base and buries it unevenly. One boulder also overlaps the tower base.", "r": true, "rc": "The base sits on a white apron set into the rock. Nothing floats and nothing is buried."}, {"n": "12", "c": "When orbited, the ocean reaches the horizon with no visible edge", "d": "Scene Fidelity", "m": false, "mc": "There is no ocean, so orbiting shows the edge of the terrain slab against empty sky.", "r": true, "rc": "The sea and the far shore wrap around the whole orbit range, and no sea edge shows at any allowed angle."}, {"n": "13", "c": "Shadows of the tower and rocks all match one sun direction", "d": "Lighting", "m": true, "mc": "One directional sun with a shadow map, and all shadows fall to the right.", "r": true, "rc": "All lighting comes from one baked sun, so the shadows of the tower, boulders, steps and handrail fall the same way."}, {"n": "14", "c": "The white tower shows shading on its shadow side and is not blown out", "d": "Lighting", "m": true, "mc": "The tower shows a lit left face and a cool grey shaded side, and it is not blown out.", "r": true, "rc": "The tower’s shaded faces read cool grey and the sunlit faces stay below pure white."}, {"n": "15", "c": "The horizon fades into haze", "d": "Lighting", "m": false, "mc": "The sky has a haze band, but with the sea missing there is no sea horizon fading into it. The distant coast reads as a flat grey slab.", "r": true, "rc": "The sea and the far shore lose contrast and turn pale blue toward the horizon."}, {"n": "16", "c": "No area of the default view is fully black or blown out to white", "d": "Lighting", "m": true, "mc": "No area is fully black or clipped to white. The darkest parts are the red boulders in shadow.", "r": true, "rc": "The darkest wet rock at the waterline is lifted to a dark grey, and the snow highlights stay below clipping."}, {"n": "17", "c": "The paint shows subtle weathering, not clean plastic", "d": "Materials", "m": false, "mc": "Pure white flat shaded paint with no grime, streaks or wear. It reads as clean plastic.", "r": true, "rc": "The paint has faint plaster variation and light grime streaks under the top edges, so it doesn’t read as clean plastic."}, {"n": "18", "c": "Snow reads as snow (bright and soft, not grey plastic); exposed rock reads as real stone, darker and wet near the waterline", "d": "Materials", "m": false, "mc": "The snow is plausible, but the rock reads as glossy red plastic and there is no darker wet rock at the waterline.", "r": true, "rc": "Snow is bright and soft with a crystal grain. Exposed granite is grainy and cracked, and it gets darker and wet looking near the waterline."}, {"n": "19", "c": "The lantern glass reflects and is see-through", "d": "Materials", "m": false, "mc": "The glass is a 38% opacity pane with no environment map, so it is see-through but reflects no sky.", "r": true, "rc": "The lantern glass uses real transmission, so the lens shows through and the sky reflects in the panes."}, {"n": "20", "c": "The sea reflects more sky at grazing angles and shifts colour with depth", "d": "Materials", "m": false, "mc": "The ocean is not drawn. Even in the shader code, the water colour comes only from noise, with no shift by depth.", "r": true, "rc": "Fresnel gives more sky reflection at grazing angles, and the water shifts from deep navy offshore to a lighter tone in the shallows."}, {"n": "21", "c": "The horizon is level", "d": "Composition", "m": true, "mc": "The horizon is level and the camera has no roll.", "r": true, "rc": "The horizon is level across the frame."}, {"n": "22", "c": "Waves roll in continuously, with varied heights", "d": "Motion", "m": false, "mc": "The ocean doesn’t render, so no waves are visible.", "r": true, "rc": "Several layered wave trains with different lengths and speeds keep the swell coming in with varied heights."}, {"n": "23", "c": "Waves break on the rocks with foam and spray", "d": "Motion", "m": false, "mc": "There is no visible sea and no spray system at all, so nothing breaks on the rocks.", "r": true, "rc": "Swell breaks on the rocks with a foam wash, and spray bursts at the shore points."}, {"n": "24", "c": "Foam spreads and fades gradually (doesn't pop in or out)", "d": "Motion", "m": false, "mc": "The foam lives inside the ocean shader that fails to compile, so no foam shows.", "r": true, "rc": "The foam rises and thins with the surge and fades out over time. It never pops in or out."}, {"n": "25", "c": "Wind shows in the scene (drifting snow, spray blown off the waves)", "d": "Motion", "m": true, "mc": "Snow drifts across the rock from left to right and the grass tufts sway in the wind.", "r": true, "rc": "Snow drifts low across the rock, spray is blown inland and the grass sways in the wind."}, {"n": "26", "c": "Motion runs at real-world speed and loops without visible jumps", "d": "Motion", "m": true, "mc": "Motion runs on a real time clock at believable speeds, and the drifting snow wraps with a fade, so nothing jumps.", "r": true, "rc": "Everything moves at real world speed on a 48 second loop with no visible jump."}, {"n": "27", "c": "No repeating tile pattern on the ocean toward the horizon", "d": "Realism", "m": false, "mc": "The ocean is missing, so this can’t be judged as a pass.", "r": true, "rc": "Two normal layers at different scales plus noise break up the tiling, so no repeating grid shows toward the horizon."}, {"n": "28", "c": "Spray particles are soft, not visible sprite squares", "d": "Realism", "m": false, "mc": "There are no spray particles in the scene. The only particles are small snow points.", "r": true, "rc": "Spray and snow use soft round sprites with fading alpha, not hard squares."}, {"n": "29", "c": "Water meets the rocks with foam, not a hard clipping line", "d": "Realism", "m": false, "mc": "No water is drawn, so the terrain edge drops into empty sky instead of meeting the sea with foam.", "r": true, "rc": "The water meets the rock through a soft foam rim that follows the swell, not a hard clip line."}, {"n": "30", "c": "A paused frame of the default view could pass for the reference photo at first glance", "d": "Realism", "m": false, "mc": "Red boulders, the missing ocean and the plain snow foreground make the paused frame read clearly as CG, not as the photo.", "r": true, "rc": "Paused on the default view, the tower, rock, snow, sea and sky read as the photo at a first glance."}], "round_count": 3, "rounds": [], "turns": [], "note": ""}];

// Design time per sample, estimated from the trajectories and the platform timer (review time not included).
const TIME = { moraine: '~15–20 h', bamboo: '~15 h', lighthouse: '~15.5 h' };

const ICON_BOX = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>';
const ARROWS = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18-6-6 6-6"/><path d="m15 6 6 6-6 6"/></svg>';

const menu = document.getElementById('menu');
const page = document.getElementById('page');
menu.innerHTML = SAMPLES.map(s => `<a href="#${s.id}" data-id="${s.id}">${ICON_BOX}<span>${s.name}</span></a>`).join('');

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const host = u => u.replace(/^https?:\/\//, '').replace(/\/$/, '');
const na = '<span class="na">–</span>';
const mark = v => v === true ? '<span class="yes" aria-label="Pass">&#10003;</span>' : v === false ? '<span class="no" aria-label="Fail">&#10007;</span>' : '<span class="na" aria-label="Not scored">–</span>';
const score = (rows, k) => `${rows.filter(r => r[k] === true).length} / ${rows.length}`;

const CATS = [
  ['Builds', 'The scene opens in the browser and runs at 30 fps or more.', true],
  ['Orbit', 'The camera orbits the scene and can\'t go below the ground or outside it.', true],
  ['Prompt Adherence', 'No UI or interaction besides orbiting, and motion runs on load.'],
  ['Reference Fidelity', 'The scene matches the photo: colours, landmarks, light and time of day.'],
  ['Scene Fidelity', 'Shapes read as real (rock, trees, buildings), with no holes or edges when orbiting.'],
  ['Lighting', 'Light direction, shadows, haze and exposure look natural.'],
  ['Materials', 'Surfaces read as the real thing: water, rock, snow, paint, glass.'],
  ['Composition', 'The opening view matches the photo\'s framing, with a level horizon.'],
  ['Motion', 'Wind, water and snow move at real-world speed and loop without jumps.'],
  ['Realism', 'Common giveaways of CG (tiling, cloned objects, clipping), and whether a paused frame could pass for the photo.']
];

const STEPS = [
  ['Start from a photo', 'Client', 'Shares a reference photo and the answer its model, Gemini 4 Argon, generated from it with one prompt: “' + PROMPT + '”', ['Reference photo', 'Model answer (HTML)']],
  ['Rate the model answer', 'Senior designer', 'Scores the model\'s answer against the rubric', ['Rubric scores for the model answer']],
  ['Build the scene in Blender', 'Senior designer, with Claude Opus 5.5', 'First gets the scene right in Blender, in three stages: modelling, texturing and adding motion effects such as water, wind and snow', ['Blender scene', 'Renders from the photo\'s angle']],
  ['Transpose it to HTML', 'Senior designer, with Claude Opus 5.5', 'Once the Blender scene is right, transposes it to HTML so it runs in the browser', ['HTML scene and its assets', 'Design trajectory']],
  ['Review', 'Another senior designer', 'Reviews every submission and sends feedback. If it isn\'t there yet, the task goes back for another round', ['Review feedback', 'Approved sample']]
];

function renderOverview() {
  const steps = STEPS.map(([title, who, what, out], i) => `<li class="step"><div class="step-head"><span class="num">${i + 1}</span><h2>${esc(title)}</h2></div><dl><dt>Who</dt><dd>${esc(who)}</dd><dt>What</dt><dd>${esc(what)}</dd><dt>Output</dt><dd><ul>${out.map(o => `<li>${esc(o)}</li>`).join('')}</ul></dd></dl></li>`).join('');
  const cats = CATS.map(([cat, what, gate]) => {
    const counts = SAMPLES.map(s => s.rubric.filter(r => r.d === cat).length);
    const n = Math.min(...counts) === Math.max(...counts) ? String(counts[0]) : `${Math.min(...counts)} to ${Math.max(...counts)}`;
    return `<tr class="${gate ? 'gate' : cat === 'Realism' ? 'real' : ''}"><td>${esc(cat)}${gate ? ' <span class="src">· gate</span>' : ''}</td><td class="cm">${esc(what)}</td><td class="mono">${n}</td></tr>`;
  }).join('');
  const results = SAMPLES.map(s => `<tr><td><a href="#${s.id}" style="text-decoration:none">${esc(s.name)}</a></td><td class="mono">${score(s.rubric, 'm')}</td><td class="mono">${score(s.rubric, 'r')}</td><td class="mono">${s.round_count}</td><td class="mono">${TIME[s.id] || '–'}</td></tr>`).join('');
  page.className = 'doc';
  page.innerHTML = `
    <h1 class="home">Overview</h1>
    <p class="lead">These are Image2Code samples created by senior designers. Each one recreates a real photo as a photorealistic 3D scene that runs in the browser.</p>
    <div class="label refs-label">Reference images</div>
    <div class="refs">${SAMPLES.map(s => `<a href="#${s.id}"><img src="${esc(s.thumb)}" alt="Reference photo: ${esc(s.name)}" loading="lazy"><span class="label">${esc(s.name)}</span></a>`).join('')}</div>
    <ol class="boxes" aria-label="Workflow">${steps}</ol>
    <h2>Rubrics</h2>
    <p class="note">Each criterion is scored pass or fail, on both Gemini's answer and the redesign. Gate criteria must pass, or the task goes back for rework. Each sample has 32 to 33 criteria, written for its photo.</p>
    <div class="table-wrap"><table class="rubric plain"><thead><tr><th>Category</th><th>What it checks</th><th>Criteria</th></tr></thead><tbody>${cats}</tbody></table></div>
    <h2>Results</h2>
    <p class="note">Each sample went through 3 review rounds before approval. The redesigns passed every rubric criterion, against 13 to 18 for Gemini. Each sample took about 15 hours of design time, estimated from the trajectories and the platform's timer.</p>
    <div class="table-wrap"><table class="rubric plain"><thead><tr><th>Sample</th><th>Model</th><th>Redesign</th><th>Review rounds</th><th>Design time (est.)</th></tr></thead><tbody>${results}</tbody></table></div>`;
}

function pane(label, src) {
  const body = src
    ? `<iframe data-src="${esc(src)}" title="${esc(label)}" allow="fullscreen" allowfullscreen></iframe><div class="loading" aria-live="polite"><span class="spin" aria-hidden="true"></span><span class="label">Loading</span></div>`
    : `<div class="pending">HTML pending</div>`;
  const open = src ? `<a href="${esc(src)}" target="_blank" rel="noopener">Open full screen</a>` : '';
  return `<figure class="pane"><div class="pane-head"><span class="label">${esc(label)}</span>${open}</div><div class="frame">${body}</div></figure>`;
}

function filesTable(list) {
  if (!list.length) return `<div class="pending" style="margin-top:12px">Final scene pending</div>`;
  const rows = list.map(f => `<tr><td class="mono" style="color:var(--ink)">${esc(f.name)}</td><td class="mono">${esc(f.size)}</td><td class="cm">${esc(f.type)}</td></tr>`).join('');
  return `<div class="table-wrap"><table class="rubric plain"><thead><tr><th>Asset</th><th>Size</th><th>Type</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function sourcesTable(list) {
  const rows = list.map(a => `<tr><td>${esc(a.name)}</td><td class="src">${a.source ? `<a href="${esc(a.source)}" target="_blank" rel="noopener">${esc(host(a.source))}</a>` : na}</td><td class="cm">${esc(a.licence)}</td></tr>`).join('');
  return `<div class="table-wrap"><table class="rubric plain"><thead><tr><th>Source asset</th><th>Source</th><th>Licence</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function rubricTable(rows) {
  const order = [];
  rows.forEach(r => { if (!order.includes(r.d)) order.push(r.d); });
  const body = order.map(d => `<tr class="grp"><th colspan="4">${esc(d)}</th></tr>` + rows.filter(r => r.d === d).map(r =>
    `<tr class="${r.n.startsWith('G') ? 'gate' : r.d === 'Realism' ? 'real' : ''}"><td><strong>${esc(r.n)}</strong> &mdash; ${esc(r.c)}</td><td class="c">${mark(r.m)}</td><td class="c">${mark(r.r)}</td><td class="cm">${r.mc ? `<p class="cl"><span class="src">Model</span> ${esc(r.mc)}</p>` : ''}${r.rc ? `<p class="cl"><span class="src">Redesign</span> ${esc(r.rc)}</p>` : ''}</td></tr>`).join('')).join('');
  return `<div class="legend label"><span><i style="background:rgba(63,140,232,.5)"></i>Gate</span><span><i style="background:rgba(232,190,63,.5)"></i>Realism check</span></div>
    <div class="table-wrap"><table class="rubric merged"><thead><tr><th>Rubric</th><th>Model version</th><th>Redesign</th><th>Comments</th></tr></thead><tbody>${body}</tbody></table></div>`;
}

function renderSample(s) {
  const total = s.files.reduce((a, f) => a + f.bytes, 0);
  page.className = 'doc wide';
  page.innerHTML = `
    <header class="title-row"><div><h1>${esc(s.name)}</h1><div class="label">${s.rubric.length} criteria &middot; ${s.round_count} review rounds</div></div></header>
    <div class="prompt"><img src="${esc(s.thumb)}" alt="Reference photo sent with the prompt"><div><div class="label">Prompt &middot; sent with the reference photo</div><p>${esc(PROMPT)}</p></div></div>
    <section id="compare"><div class="compare">${pane('Model version', s.model)}${pane('Redesign', s.redesign)}</div></section>
    <section>
      <h2>Reference vs render</h2>
      <div class="slider" id="cmp" style="--pos:50%">
        <img src="${esc(s.ref)}" alt="Reference photo">
        <div class="top"><img src="${esc(s.render)}" alt="3D render"></div>
        <div class="bar"></div><div class="knob">${ARROWS}</div>
        <span class="tag l label">Photo</span><span class="tag r label">${esc(s.render_label)}</span>
      </div>
    </section>
    <details class="sec"><summary><h2>Assets</h2><span class="label">${s.files.length} files &middot; ${(total / 1048576).toFixed(1)} MB</span></summary>
      ${filesTable(s.files)}
      <div class="label sub-h">Sources and licences</div>
      ${sourcesTable(s.sources)}
    </details>
    <details class="sec"><summary><h2>Rubrics</h2><span class="label">Model ${score(s.rubric, 'm')} &middot; Redesign ${score(s.rubric, 'r')} pass</span></summary>${rubricTable(s.rubric)}</details>`;
  // Set src only after the listener is in place, and ignore the about:blank load that comes before it.
  page.querySelectorAll('.frame iframe[data-src]').forEach(f => {
    let started = false;
    f.addEventListener('load', () => {
      if (!started) return;
      let href = '';
      try { href = f.contentWindow.location.href; } catch (e) { href = 'cross-origin'; }
      if (href === 'about:blank') return;
      f.nextElementSibling?.classList.add('done');
    });
    requestAnimationFrame(() => { started = true; f.src = f.dataset.src; });
  });
  wireSlider(document.getElementById('cmp'));
}

function render() {
  const id = location.hash.slice(1);
  const s = SAMPLES.find(x => x.id === id);
  document.querySelectorAll('.side a[data-id]').forEach(a => { if (a.dataset.id === (s ? s.id : 'overview')) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (s) renderSample(s); else renderOverview();
  window.scrollTo(0, 0);
}

function wireSlider(el) {
  const set = x => { const r = el.getBoundingClientRect(); el.style.setProperty('--pos', Math.min(100, Math.max(0, (x - r.left) / r.width * 100)) + '%'); };
  let drag = false;
  el.addEventListener('pointerdown', e => { drag = true; el.setPointerCapture(e.pointerId); set(e.clientX); });
  el.addEventListener('pointermove', e => { if (drag) set(e.clientX); });
  el.addEventListener('pointerup', () => { drag = false; });
  el.tabIndex = 0;
  el.addEventListener('keydown', e => {
    const cur = parseFloat(el.style.getPropertyValue('--pos')) || 50;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); el.style.setProperty('--pos', Math.min(100, Math.max(0, cur + (e.key === 'ArrowRight' ? 5 : -5))) + '%'); }
  });
}

window.addEventListener('hashchange', render);
render();
</script>
