, {"name": "Snow 014", "source": "https://ambientcg.com/view?id=Snow014", "licence": "CC0"}, {"name": "Concrete 034", "source": "https://ambientcg.com/view?id=Concrete034", "licence": "CC0"}, {"name": "Painted Plaster Wall", "source": "https://polyhaven.com/a/painted_plaster_wall", "licence": "CC0"}, {"name": "Grass Medium 01", "source": "https://polyhaven.com/a/grass_medium_01", "licence": "CC0"}, {"name": "Aerial Grass Rock", "source": "https://polyhaven.com/a/aerial_grass_rock", "licence": "CC0"}, {"name": "Aerial Rocks 02", "source": "https://polyhaven.com/a/aerial_rocks_02", "licence": "CC0"}, {"name": "Syferfontein 18d Clear Pure Sky (HDRI)", "source": "https://polyhaven.com/a/syferfontein_18d_clear_puresky", "licence": "CC0"}, {"name": "Water normals texture", "source": "https://github.com/mrdoob/three.js/blob/dev/examples/textures/waternormals.jpg", "licence": "MIT (credit: three.js authors)"}, {"name": "three.js r170", "source": "https://github.com/mrdoob/three.js", "licence": "MIT"}, {"name": "meshoptimizer decoder", "source": "https://github.com/zeux/meshoptimizer", "licence": "MIT"}], "rubric": [{"n": "G1", "c": "The HTML opens in Chrome and the scene renders, with no errors or blank screen", "d": "Builds", "m": false, "mc": "The ocean fragment shader does not compile because it reads p.z from a vec2. The console shows shader errors and the ocean never draws, so the space beyond the rocks is empty sky.", "r": true, "rc": "Opens straight from index.html in Chrome with no server. All assets are local in the assets folder, and there are no console errors and no blank screen."}, {"n": "G2", "c": "Dragging orbits the camera around the scene; the camera can't go below the ground or outside the scene", "d": "Orbit", "m": false, "mc": "The polar limit keeps the camera above the ground, but the max distance lets it pull back past the terrain edge. From there the headland reads as a flat slab floating in empty sky.", "r": true, "rc": "Orbit is limited in distance and angle. The camera stays above the terrain, so it can’t go under the rock or leave the scene."}, {"n": "G3", "c": "The scene runs at 30 fps or more on a standard laptop", "d": "Builds", "m": true, "mc": "The load is moderate, one shadow map, one terrain mesh, procedural sky and simple primitives. A standard laptop should hold 30 fps.", "r": true, "rc": "Lighting and shadows are baked into lightmaps, so the page draws flat textured meshes plus light sea, spray and snow shaders. The screen recording ran at 30 fps on an RTX 5060 while capturing."}, {"n": "1", "c": "There is no UI, text or interaction other than orbiting", "d": "Prompt Adherence", "m": true, "mc": "No UI, no text and no buttons. Orbit is the only interaction.", "r": true, "rc": "No UI, no text and no buttons. Orbit is the only interaction."}, {"n": "2", "c": "At least one environmental motion runs on load, without any input", "d": "Prompt Adherence", "m": true, "mc": "Clouds drift, the grass sways, snow drifts and the lens turns as soon as the page loads.", "r": true, "rc": "The sea, shore foam, wave spray, drifting snow and wind in the grass all start on load with no input."}, {"n": "3", "c": "The default view matches the photo's camera angle and framing", "d": "Composition", "m": false, "mc": "The horizon sits higher than in the photo and the tower is smaller in frame. The rock outcrops that fill the photo’s foreground are replaced by a snow slope.", "r": true, "rc": "The camera is locked to the photo: 24 mm lens, eye height of about 1.45 m, the same corner on view of the tower and the same horizon height."}, {"n": "4", "c": "The lighthouse matches the photo's shape and colours (tower, lantern, trim)", "d": "Reference Fidelity", "m": true, "mc": "White octagonal tapered tower, red lantern and cap, white gallery rail. The colours and silhouette read as the photo, though the model adds a small gabled porch that the photo doesn’t have.", "r": true, "rc": "White octagonal tower with a red lantern and red cap, white gallery, door, black plaque and small windows, as in the photo."}, {"n": "5", "c": "The lighthouse sits on a rocky shore with snow on the rocks, as in the photo", "d": "Reference Fidelity", "m": false, "mc": "The shore reads as a smooth snow field. The boulders render dark red and magenta because their vertex colour data gets multiplied into the rock colour, so it doesn’t read as a snowy granite shore.", "r": true, "rc": "The tower stands on rounded granite outcrops with snow lying in patches and in the hollows, plus scattered boulders and snowy stone steps."}, {"n": "6", "c": "The ocean is visible beyond the rocks, as in the photo", "d": "Reference Fidelity", "m": false, "mc": "The ocean shader fails to compile, so no sea is visible beyond the rocks.", "r": true, "rc": "Deep blue ocean all along the horizon behind the rocks, with the far shoreline on the right, as in the photo."}, {"n": "7", "c": "The clear blue winter sky and light match the photo", "d": "Reference Fidelity", "m": true, "mc": "Clear blue gradient sky with a pale horizon and low sun from the left, as in the photo.", "r": true, "rc": "Clear blue sky that gets paler toward the horizon, with low bright winter sun from the left."}, {"n": "8", "c": "The tower's shape and proportions match the photo", "d": "Scene Fidelity", "m": true, "mc": "Slender tapered octagonal shaft with the lantern on top, close to the photo’s proportions.", "r": true, "rc": "Tapered octagonal tower with the same height to width ratio and the lantern on top, matched against the photo."}, {"n": "9", "c": "The lantern room has windows and a railing gallery", "d": "Scene Fidelity", "m": true, "mc": "The lantern has glazed panes with red mullions and a white railing gallery around it.", "r": true, "rc": "The lantern has glazed panels with mullions and a gallery with a railing around it."}, {"n": "10", "c": "Rocks show natural shapes with cracks and fissures, not smooth blobs", "d": "Scene Fidelity", "m": false, "mc": "The boulders are noise-displaced spheres with a faceted low-poly look and no real cracks. The crack lines on the terrain are only painted on.", "r": true, "rc": "Rounded granite lobes with crevices, plus scanned Poly Haven rock that adds cracks, pits and grain."}, {"n": "11", "c": "The lighthouse base sits flush on the rock (no floating or sinking)", "d": "Scene Fidelity", "m": false, "mc": "The right whaleback bump is added after the plinth pad is flattened, so the ground rises up to about 0.4 m around the base and buries it unevenly. One boulder also overlaps the tower base.", "r": true, "rc": "The base sits on a white apron set into the rock. Nothing floats and nothing is buried."}, {"n": "12", "c": "When orbited, the ocean reaches the horizon with no visible edge", "d": "Scene Fidelity", "m": false, "mc": "There is no ocean, so orbiting shows the edge of the terrain slab against empty sky.", "r": true, "rc": "The sea and the far shore wrap around the whole orbit range, and no sea edge shows at any allowed angle."}, {"n": "13", "c": "Shadows of the tower and rocks all match one sun direction", "d": "Lighting", "m": true, "mc": "One directional sun with a shadow map, and all shadows fall to the right.", "r": true, "rc": "All lighting comes from one baked sun, so the shadows of the tower, boulders, steps and handrail fall the same way."}, {"n": "14", "c": "The white tower shows shading on its shadow side and is not blown out", "d": "Lighting", "m": true, "mc": "The tower shows a lit left face and a cool grey shaded side, and it is not blown out.", "r": true, "rc": "The tower’s shaded faces read cool grey and the sunlit faces stay below pure white."}, {"n": "15", "c": "The horizon fades into haze", "d": "Lighting", "m": false, "mc": "The sky has a haze band, but with the sea missing there is no sea horizon fading into it. The distant coast reads as a flat grey slab.", "r": true, "rc": "The sea and the far shore lose contrast and turn pale blue toward the horizon."}, {"n": "16", "c": "No area of the default view is fully black or blown out to white", "d": "Lighting", "m": true, "mc": "No area is fully black or clipped to white. The darkest parts are the red boulders in shadow.", "r": true, "rc": "The darkest wet rock at the waterline is lifted to a dark grey, and the snow highlights stay below clipping."}, {"n": "17", "c": "The paint shows subtle weathering, not clean plastic", "d": "Materials", "m": false, "mc": "Pure white flat shaded paint with no grime, streaks or wear. It reads as clean plastic.", "r": true, "rc": "The paint has faint plaster variation and light grime streaks under the top edges, so it doesn’t read as clean plastic."}, {"n": "18", "c": "Snow reads as snow (bright and soft, not grey plastic); exposed rock reads as real stone, darker and wet near the waterline", "d": "Materials", "m": false, "mc": "The snow is plausible, but the rock reads as glossy red plastic and there is no darker wet rock at the waterline.", "r": true, "rc": "Snow is bright and soft with a crystal grain. Exposed granite is grainy and cracked, and it gets darker and wet looking near the waterline."}, {"n": "19", "c": "The lantern glass reflects and is see-through", "d": "Materials", "m": false, "mc": "The glass is a 38% opacity pane with no environment map, so it is see-through but reflects no sky.", "r": true, "rc": "The lantern glass uses real transmission, so the lens shows through and the sky reflects in the panes."}, {"n": "20", "c": "The sea reflects more sky at grazing angles and shifts colour with depth", "d": "Materials", "m": false, "mc": "The ocean is not drawn. Even in the shader code, the water colour comes only from noise, with no shift by depth.", "r": true, "rc": "Fresnel gives more sky reflection at grazing angles, and the water shifts from deep navy offshore to a lighter tone in the shallows."}, {"n": "21", "c": "The horizon is level", "d": "Composition", "m": true, "mc": "The horizon is level and the camera has no roll.", "r": true, "rc": "The horizon is level across the frame."}, {"n": "22", "c": "Waves roll in continuously, with varied heights", "d": "Motion", "m": false, "mc": "The ocean doesn’t render, so no waves are visible.", "r": true, "rc": "Several layered wave trains with different lengths and speeds keep the swell coming in with varied heights."}, {"n": "23", "c": "Waves break on the rocks with foam and spray", "d": "Motion", "m": false, "mc": "There is no visible sea and no spray system at all, so nothing breaks on the rocks.", "r": true, "rc": "Swell breaks on the rocks with a foam wash, and spray bursts at the shore points."}, {"n": "24", "c": "Foam spreads and fades gradually (doesn't pop in or out)", "d": "Motion", "m": false, "mc": "The foam lives inside the ocean shader that fails to compile, so no foam shows.", "r": true, "rc": "The foam rises and thins with the surge and fades out over time. It never pops in or out."}, {"n": "25", "c": "Wind shows in the scene (drifting snow, spray blown off the waves)", "d": "Motion", "m": true, "mc": "Snow drifts across the rock from left to right and the grass tufts sway in the wind.", "r": true, "rc": "Snow drifts low across the rock, spray is blown inland and the grass sways in the wind."}, {"n": "26", "c": "Motion runs at real-world speed and loops without visible jumps", "d": "Motion", "m": true, "mc": "Motion runs on a real time clock at believable speeds, and the drifting snow wraps with a fade, so nothing jumps.", "r": true, "rc": "Everything moves at real world speed on a 48 second loop with no visible jump."}, {"n": "27", "c": "No repeating tile pattern on the ocean toward the horizon", "d": "Realism", "m": false, "mc": "The ocean is missing, so this can’t be judged as a pass.", "r": true, "rc": "Two normal layers at different scales plus noise break up the tiling, so no repeating grid shows toward the horizon."}, {"n": "28", "c": "Spray particles are soft, not visible sprite squares", "d": "Realism", "m": false, "m const ICON_BOX = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>';
const CHEVRON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
const ARROWS = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18-6-6 6-6"/><path d="m15 6 6 6-6 6"/></svg>';

const menu = document.getElementById('menu');
const page = document.getElementById('page');
menu.innerHTML = SAMPLES.map(s => `<a href="#${s.id}" data-id="${s.id}">${ICON_BOX}<span>${s.name}</span></a>`).join('');

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = s => s ? new Date(s).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'UTC' }) + ' UTC' : '';
const host = u => u.replace(/^https?:\/\//, '').replace(/\/$/, '');
const na = '<span class="na">–</span>';

function pane(label, src) {
  const body = src ? `<iframe src="${esc(src)}" title="${esc(label)}" loading="lazy" allow="fullscreen"></iframe>` : `<div class="empty"><span class="label">HTML pending</span></div>`;
  const open = src ? `<a href="${esc(src)}" target="_blank" rel="noopener">Full screen ↗</a>` : '';
  return `<div class="pane"><div class="head"><span class="label">${esc(label)}</span>${open}</div><div class="frame">${body}</div></div>`;
}

function filesTable(list) {
  if (!list.length) return `<div class="scroll"><table class="tbl"><thead><tr><th>Asset</th><th>Size</th><th>Type</th></tr></thead><tbody><tr><td colspan="3" class="label">Final scene pending</td></tr></tbody></table></div>`;
  const total = list.reduce((a, f) => a + f.bytes, 0);
  const rows = list.map(f => `<tr><td class="mono" style="color:var(--ink)">${esc(f.name)}</td><td class="mono">${esc(f.size)}</td><td>${esc(f.type)}</td></tr>`).join('');
  return `<p class="sub">${list.length} files · ${(total / 1048576).toFixed(1)} MB</p><div class="scroll"><table class="tbl"><thead><tr><th>Asset</th><th>Size</th><th>Type</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function sourcesTable(list) {
  const rows = list.map(a => `<tr><td>${esc(a.name)}</td><td class="src">${a.source ? `<a href="${esc(a.source)}" target="_blank" rel="noopener">${esc(host(a.source))}</a>` : na}</td><td>${esc(a.licence)}</td></tr>`).join('');
  return `<div class="scroll"><table class="tbl"><thead><tr><th>Source asset</th><th>Source</th><th>Licence</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

const mark = v => v === true ? '<span class="ok" aria-label="Pass">✓</span>' : v === false ? '<span class="no" aria-label="Fail">✕</span>' : '<span class="na" aria-label="Not scored">–</span>';

function rubricTable(rows) {
  const body = rows.map(r => `<tr class="${r.n.startsWith('G') ? 'gate' : r.d === 'Realism' ? 'real' : ''}"><td class="num">${esc(r.n)}</td><td>${esc(r.c)}</td><td class="mono">${esc(r.d)}</td><td class="v">${mark(r.m)}</td><td class="v">${mark(r.r)}</td><td class="cm">${r.mc ? `<span class="label">Model</span>${esc(r.mc)}` : ''}${r.rc ? `<span class="label">Redesign</span>${esc(r.rc)}` : ''}</td></tr>`).join('');
  return `<div class="legend label"><span><i style="background:rgba(63,140,232,.45)"></i>Gate</span><span><i style="background:rgba(232,190,63,.45)"></i>Realism check</span></div>
    <div class="scroll"><table class="tbl"><thead><tr><th>#</th><th>Criterion</th><th>Dimension</th><th>Model</th><th>Redesign</th><th>Comments</th></tr></thead><tbody>${body}</tbody></table></div>`;
}

const score = (rows, k) => `${rows.filter(r => r[k] === true).length} / ${rows.length}`;

function turnItem(t, i) {
  return `<li class="turn"><button aria-expanded="false"><span class="n">${i}</span><span class="p">${esc(t.prompt)}</span><span></span><span class="t">${esc(fmt(t.t))}</span></button><div class="body">${t.reply ? `<div class="reply">${esc(t.reply)}</div>` : ''}${t.calls.length ? `<ul class="calls">${t.calls.map(c => `<li>${esc(c)}</li>`).join('')}</ul>` : ''}</div></li>`;
}

function roundItem(r, i) {
  return `<li class="round"><span class="n">R${i}</span><div><div class="head"><b>Round ${i} submitted</b><span class="label">${esc(fmt(r.submitted))}</span><span class="tag-rev">${esc(r.rate.replace(/_/g, ' '))}</span></div>${r.review ? `<div class="review"><span class="who label">Reviewer${r.reviewed ? ' · ' + esc(fmt(r.reviewed)) : ''}</span>${esc(r.review)}</div>` : ''}</div></li>`;
}

// Turns and review rounds in time order: each round's review lands before the turns that answer it.
function timeline(s) {
  const items = [];
  s.rounds.forEach((r, i) => items.push({ at: r.submitted, html: roundItem(r, i + 1) }));
  s.turns.forEach((t, i) => items.push({ at: t.t, html: turnItem(t, i + 1) }));
  items.sort((a, b) => new Date(a.at) - new Date(b.at));
  const LIMIT = 40;
  const head = items.slice(0, LIMIT).map(x => x.html).join('');
  const rest = items.slice(LIMIT).map(x => x.html).join('');
  const note = s.note ? `<div class="note"><span class="who label" style="display:block;margin-bottom:6px">Trajectory note from the designer</span>${esc(s.note)}</div>` : '';
  return `${note}<ol class="turns">${head}</ol>${rest ? `<button class="more" data-more>Show ${items.length - LIMIT} more</button><ol class="turns" hidden>${rest}</ol>` : ''}`;
}

function render() {
  const id = location.hash.slice(1);
  const s = SAMPLES.find(x => x.id === id) || SAMPLES[0];
  menu.querySelectorAll('a').forEach(a => { if (a.dataset.id === s.id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  const trajLabel = s.turns.length ? `${s.turns.length} prompts · ${s.rounds.length} rounds` : `${s.rounds.length} rounds`;
  page.innerHTML = `
    <h1>${esc(s.name)}</h1>
    <section class="pair">${pane('Model · Gemini 4 Argon', s.model)}${pane('Redesign', s.redesign)}</section>
    <h2>Reference vs render</h2>
    <div class="compare" id="cmp" style="--pos:50%">
      <img src="${esc(s.ref)}" alt="Reference photo">
      <div class="top"><img src="${esc(s.render)}" alt="3D render"></div>
      <div class="bar"></div><div class="knob">${ARROWS}</div>
      <span class="tag l label">Photo</span><span class="tag r label">${esc(s.render_label)}</span>
    </div>
    <h2>Assets</h2>
    ${filesTable(s.files)}
    <h3 class="label" style="margin:28px 0 12px">Sources and licences</h3>
    ${sourcesTable(s.sources)}
    <details class="acc"><summary><h2>Rubrics</h2><span class="sumr"><span class="label">Model ${score(s.rubric, 'm')} · Redesign ${score(s.rubric, 'r')}</span>${CHEVRON}</span></summary>${rubricTable(s.rubric)}</details>
    <details class="acc"><summary><h2>Trajectory</h2><span class="sumr"><span class="label">${trajLabel}</span>${CHEVRON}</span></summary>${timeline(s)}</details>`;
  wireCompare(document.getElementById('cmp'));
  page.querySelectorAll('.turn > button').forEach(b => b.addEventListener('click', () => {
    const open = b.parentElement.classList.toggle('open'); b.setAttribute('aria-expanded', String(open));
  }));
  const more = page.querySelector('[data-more]');
  if (more) more.addEventListener('click', () => { more.nextElementSibling.hidden = false; more.remove(); });
  window.scrollTo(0, 0);
}

function wireCompare(el) {
  const set = x => { const r = el.getBoundingClientRect(); el.style.setProperty('--pos', Math.min(100, Math.max(0, (x - r.left) / r.width * 100)) + '%'); };
  let drag = false;
  el.addEventListener('pointerdown', e => { drag = true; el.setPointerCapture(e.pointerId); set(e.clientX); });
  el.addEventListener('pointermove', e => { if (drag) set(e.clientX); });
  el.addEventListener('pointerup', () => { drag = false; });
  el.tabIndex = 0;
  el.addEventListener('keydown', e => {
    const cur = parseFloat(el.style.getPropertyValue('--pos')) || 50;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); el.style.setProperty('--pos', Math.min(100, Math.max(0, cur + (e.key === 'ArrowRight' ? 5 : -5))) + '%'); }
  });
}

window.addEventListener('hashchange', render);
render();
</script>
